<style>
:root{
 --bg:#121517;--card:#1B1F21;--ink:#E8EAE9;--mute:#97A1A2;--line:#2E3436;--line2:#3C4446;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font:400 16px/1.55 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.pr{color:var(--mute);font-size:15px}.pr.set{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}

.chip:hover:not(:disabled){border-color:var(--accent)}.chip:disabled{opacity:.22;cursor:default}
.forms{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}

.fb.sm{font:400 15px "IBM Plex Sans",sans-serif;text-align:left;line-height:1.35}
.fb:hover:not(:disabled){border-color:var(--accent)}.fb:disabled{cursor:default}
.fb.good{border-color:var(--ok);background:#16281F}.fb.bad{border-color:var(--no);opacity:.35}

.arow:last-child{border:0}
.aw{font:600 21px/1 "EB Garamond",serif;min-width:104px}
.pick{position:relative}

.panel{position:absolute;z-index:30;top:calc(100% + 5px);left:0;display:none;gap:10px;

.panel.right{left:auto;right:0}
.col{flex:1 1 0;min-width:104px}
.col h4{font:500 10px/1.2 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;
 color:var(--mute);margin:0 0 8px;text-align:center;white-space:nowrap;overflow:visible}
.cb{display:block;width:100%;text-align:center;border:0;border-radius:3px;padding:9px 6px;margin-bottom:4px;
 font:500 13px "IBM Plex Mono",monospace;white-space:nowrap}
.cb:hover{outline:2px solid var(--ink);outline-offset:1px}
.tag{font:500 11px/1 "IBM Plex Mono",monospace;padding:5px 8px;border-radius:3px}

.hint:hover{border-color:var(--gold);color:var(--gold)}
.hintbox{flex-basis:100%;font:400 16px "EB Garamond",serif;color:var(--gold);padding-left:2px}
.grey{color:var(--mute);font-size:13px;font-style:italic}

 font-size:14.5px;color:#BDC6C7;border-radius:0 3px 3px 0}

.note.g{border-color:var(--gold);background:#262117}
.note.r{border-color:var(--no);background:#261A1A}

.term{display:grid;grid-template-columns:auto 1fr 1fr;gap:2px 14px;margin:10px 0 8px;
 font:500 13px/1.7 "IBM Plex Mono",monospace}
.term i{color:var(--mute);font-style:normal;font-size:10px;letter-spacing:.09em;
 text-transform:uppercase}
.term u{text-decoration:none;color:var(--ink)}
.term s{text-decoration:none;color:var(--mute)}
.note h5{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;
 color:var(--gold);margin:13px 0 5px}
.note h5:first-child{margin-top:0}
.lit{font-family:"EB Garamond",serif;font-style:italic;font-size:17px;color:var(--ink)}
.flag{color:var(--gold);font:500 11px "IBM Plex Mono",monospace;cursor:help;border-bottom:1px dotted var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.lg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mute)}
.sw{width:11px;height:11px;border-radius:2px}

 color:var(--mute);flex-wrap:wrap}
.go{background:var(--accent);color:#0F1418;border:0;border-radius:4px;padding:11px 22px;
 font-size:15px;font-weight:600;margin-left:auto}

.ghost{background:transparent;border:0;color:var(--mute);font-size:14px;text-decoration:underline}
.menu{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);

.menu:hover:not(:disabled){border-color:var(--accent);border-left-color:var(--accent)}
.menu:disabled{cursor:default;opacity:.4}
.menu.opt{border-left-color:var(--gold)}.menu.ok{border-left-color:var(--ok)}
.mt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mn{font:500 15px "IBM Plex Sans",sans-serif}
.ms{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.ms.ok{color:var(--ok)}
.md{font-size:13px;color:var(--mute);margin-top:3px}
.hgroup{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;

.fam{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:6px;font-size:15px}
.dpanel{display:inline-flex;gap:5px;margin-left:7px;vertical-align:middle}
.dpanel .db{font:500 12px "IBM Plex Mono",monospace;padding:5px 8px}
.dtag{font:500 11px "IBM Plex Mono",monospace;color:var(--mute);margin-left:6px;
 border:1px solid var(--line2);border-radius:3px;padding:2px 6px;vertical-align:middle}
.dgroup{display:inline-flex;gap:6px}
.cellb.pre{color:var(--mute);font-style:italic}
.hidden{display:none}
.srs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.srsb{flex:1 1 0;min-width:96px;border:1px solid var(--line2);background:transparent;border-radius:4px;
 padding:11px 8px;font-size:14px}
.srsb:hover{border-color:var(--accent)}
.face{font:400 26px/1.35 "EB Garamond",serif;text-align:center;padding:26px 8px;min-height:120px;
 display:flex;align-items:center;justify-content:center}
.face.fr{font-size:20px;font-family:"IBM Plex Sans",sans-serif}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

}

/* ═══ mode lecture facilitée ═══

body.facile{font-size:19px;line-height:1.7;letter-spacing:.055em}

body.facile .opt,body.facile .cho{font-size:17px}
.lisi{position:absolute;top:0;right:0;background:none;border:1px solid var(--line);

.lisi[aria-pressed="true"]{color:#121517;background:var(--ui);border-color:var(--ui)}
header{position:relative}

/* ═══ sommaire général — écran d'accueil de la version distribuée ═══ */
.accueil{margin:0}
.uni{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);

.uni:hover{border-color:var(--mute)}

 color:var(--gold);display:block;margin-bottom:5px}
.uni .t{font:500 17px/1.3 "IBM Plex Sans";display:block}
.uni .s{font-family:"EB Garamond",serif;font-size:16px;color:var(--mute);display:block;margin-top:3px}

 letter-spacing:.09em;text-transform:uppercase;position:absolute;top:0;left:0}
.retour:hover{color:var(--ink);border-color:var(--mute)}
header{position:relative;padding-top:26px}

<script>
/* ═══ catalogue des unités ═══ */
const CATALOGUE={};
var META,NOTE_PARAD,DECL,REVIS,D,COMPL,INTRUS,DICO,PREREMPLI,PARAD,FAM,REC,SOURCES;
CATALOGUE[1]=(function(){
/* ═══════════════ IDENTITÉ DE L'UNITÉ ═══════════════
   Tout ce qui distingue cette unité d'une autre. Le moteur n'en sait rien d'autre. */
const META={
 unite:'Unité 1',

   '<b>Six terminaisons pour douze cases.</b> C’est le fait marquant de cette déclinaison, et il vaut pour toutes les autres : une forme latine porte souvent plusieurs valeurs. C’est le contexte qui permet de trancher, pas la forme seule.',
  ],
  suite:'La deuxième déclinaison, celle de <span class="lit">dominus</span> et de <span class="lit">bellum</span> — deux genres au lieu d’un, et le premier neutre.'

  [1,'<b>Quinze phrases, un seul mot à trouver.</b> Tu n’as pas encore de quoi trier : il n’y a qu’une déclinaison à ton programme. À l’unité suivante, la question deviendra <i>laquelle ?</i>'],
 ],

        ['Famille de mots','Les six mots de l’unité et leurs descendants français.',0],
        ['Cartes','Revoir les dix citations, dans les deux sens.',2]]
};

const NOTE_PARAD=`<b>Six terminaisons pour douze cases.</b> <span class="lit">-a</span> en remplit trois, <span class="lit">-ae</span> en remplit quatre, <span class="lit">-is</span> deux. Seules <span class="lit">-am</span>, <span class="lit">-as</span> et <span class="lit">-arum</span> désignent un cas et un seul. C’est pourquoi on n’analyse jamais un mot latin isolément.`;

const DECL=[];   /* absent de cette unité */
const PREREMPLI=[];   /* absent de cette unité */
const REVIS=[];   /* absent de cette unité */

/* ═══════════════ LES DIX CITATIONS ═══════════════
   Ordre du paradigme. Traductions et sources : voir le corpus.

const D=[
{id:'L1167',lat:'Historia magistra vitae',tr:'L’Histoire est maîtresse de la vie.',

 notes:[['Le sujet : nominatif','<span class="lit">Historia</span> est ce dont on parle, ce qui fait l’action ou porte l’état. En latin, le sujet se met au <b>nominatif</b>. <span class="lit">Magistra</span> dit ce qu’est l’Histoire : c’est l’attribut du sujet, et il se met au même cas que lui.'],
  ['Le complément du nom : génitif','<span class="lit">vitae</span> répond à la question <b>de qui ? de quoi ?</b> Maîtresse de quoi ? De la vie. Le français ajoute le mot « de » ; le latin, lui, change la fin du mot. C’est cela, décliner.']],
 mots:[
  {f:'Historia',an:'nominatif|singulier',lem:'historia, ae (f.)',fn:'sujet',
   amb:{'vocatif|singulier':'La terminaison <span class="lit">-a</span> peut en effet porter un vocatif. Mais personne ne s’adresse ici à l’Histoire : on parle d’elle.',

  {f:'magistra',an:'nominatif|singulier',lem:'magistra, ae (f.)',fn:'attribut du sujet',
   amb:{'vocatif|singulier':'Même terminaison, mais aucune apostrophe ici.',
        'ablatif|singulier':'Le mot dit ce qu’<b>est</b> l’Histoire : il s’accorde au sujet, il ne marque pas une circonstance.'}},
  {f:'vitae',an:'génitif|singulier',lem:'vita, ae (f.)',fn:'complément du nom',
   amb:{'datif|singulier':'La terminaison <span class="lit">-ae</span> vaut aussi pour le datif — c’est l’ambiguïté centrale de cette déclinaison. Mais ici le mot complète <span class="lit">magistra</span> : maîtresse <b>de</b> quoi ? C’est le contexte qui permet de trancher, pas la forme seule.',
        'nominatif|pluriel':'La terminaison <span class="lit">-ae</span> vaut aussi pour le nominatif pluriel. Mais la phrase a déjà son sujet, <span class="lit">Historia</span>.',
        'vocatif|pluriel':'Même terminaison, mais aucune apostrophe ici.'}}]},

{id:'L1950',lat:'O vita misero longa, felici brevis !',tr:'Ô vie, longue pour le malheureux, brève pour l’heureux !',
 dis:['Ô longue vie du malheureux, brève vie de l’heureux !','Ô malheureux à la vie longue, heureux à la vie brève !'],
 grp:[['o vita','ô vie'],['longa','longue'],['misero','pour le malheureux'],['brevis','brève'],['felici','pour l’heureux']],
 notes:[['On s’adresse à quelqu’un : vocatif','Ici on ne parle pas de la vie, on lui parle. Le cas de celui qu’on interpelle est le <b>vocatif</b>. À la 1re déclinaison il ne se distingue pas du nominatif : c’est le <span class="lit">o</span> placé devant, et le sens, qui le signalent.'],
  ['Pour qui ? datif','<span class="lit">misero</span> et <span class="lit">felici</span> désignent ceux à qui la vie paraît longue ou brève. Le <b>datif</b> répond à la question <b>à qui ? pour qui ?</b>']],
 mots:[{f:'vita',an:'vocatif|singulier',lem:'vita, ae (f.)',fn:'apostrophe, marquée par o',
   amb:{'nominatif|singulier':'La forme est exactement celle du nominatif — la 1re déclinaison ne distingue pas les deux. C’est le <span class="lit">o</span> placé devant, et l’absence de verbe, qui font l’apostrophe.',

{id:'L1128',lat:'Gratia gratiam parit',tr:'La faveur engendre la faveur.',

{id:'L1875',lat:'Non scholae, sed vitae discimus',tr:'Nous n’apprenons pas pour l’école, mais pour la vie.',
 dis:['Nous n’apprenons pas de l’école, mais de la vie.','Ce n’est pas l’école, mais la vie, qui nous instruit.'],
 grp:[['non discimus','nous n’apprenons pas'],['scholae','pour l’école'],['sed','mais'],['vitae','pour la vie']],
 notice:'<h5>Une devise retournée</h5>Sénèque avait écrit l’inverse : <span class="lit">non vitae, sed scholae discimus</span> — nous apprenons pour l’école au lieu d’apprendre pour la vie. C’était un reproche adressé aux écoles de son temps. En intervertissant deux mots, le XIX<sup>e</sup> siècle en a fait une devise scolaire, et un programme.',
 notes:[['Le datif : à qui, pour quoi ?','<span class="lit">scholae</span> et <span class="lit">vitae</span> disent en vue de quoi l’on apprend. Le <b>datif</b> répond à la question <b>à qui ? pour qui ? pour quoi ?</b> Il correspond le plus souvent à ce que le français appelle le complément d’objet indirect.'],
  ['La même forme, deux cas','<span class="lit">vitae</span> voulait dire « de la vie » dans la première citation : c’était un génitif. Ici il veut dire « pour la vie » : c’est un datif. C’est le contexte qui permet de trancher, pas la forme seule.']],
 mots:[{f:'scholae',an:'datif|singulier',lem:'schola, ae (f.)',fn:'datif de but',
   amb:{'génitif|singulier':'La terminaison <span class="lit">-ae</span> vaut aussi pour le génitif. Mais il n’y a ici aucun nom à compléter : le mot dépend du verbe <span class="lit">discimus</span>.',
        'nominatif|pluriel':'La phrase a déjà son sujet, contenu dans <span class="lit">discimus</span> : « nous ».',
        'vocatif|pluriel':'Aucune apostrophe ici.'}},
  {f:'vitae',an:'datif|singulier',lem:'vita, ae (f.)',fn:'datif de but, coordonné à scholae',
   amb:{'génitif|singulier':'C’est bien le cas qu’il avait dans <span class="lit">Historia magistra vitae</span>. Pas ici : <span class="lit">sed</span> le coordonne à <span class="lit">scholae</span>, donc il en partage la fonction.',
        'nominatif|pluriel':'La phrase a déjà son sujet.',
        'vocatif|pluriel':'Aucune apostrophe ici.'}}]},

{id:'L2561',lat:'Sine ira et studio',tr:'Sans colère ni parti pris.',

 grp:[['sine','sans'],['ira','colère'],['et','et'],['studio','(sans) parti pris']],
 notice:'<h5>Comment écrire l’histoire</h5>Tacite ouvre ainsi ses <i>Annales</i> : il annonce qu’il écrira sans colère ni faveur. <span class="lit">Studium</span> n’est pas ici le zèle mais la faveur partisane, le parti pris. C’est la formule qu’on cite encore pour dire l’impartialité d’un historien, d’un journaliste ou d’un juge.',
 notes:[['Le cas des circonstances : ablatif','<span class="lit">sine</span> est toujours suivi de l’<b>ablatif</b>. C’est le cas qui dit avec quoi, sans quoi, par quel moyen, en quel lieu. Ici la préposition gouverne les deux noms à la fois, bien que « sans » ne soit écrit qu’une fois.']],

        'vocatif|singulier':'Même terminaison, mais personne n’est interpellé.'}}]},

{id:'L2673',lat:'Tantaene animis caelestibus irae ?',tr:'De si grandes colères dans les âmes célestes ?',

{id:'L1767',lat:'Nigra sum et formosa, filiae Jerusalem',tr:'Je suis noire et belle, filles de Jérusalem.',

 notes:[['L’attribut : nominatif','<span class="lit">nigra</span> et <span class="lit">formosa</span> disent ce qu’est le sujet, un « je » qui n’est pas écrit mais que porte le verbe <span class="lit">sum</span>. L’attribut du sujet se met au <b>nominatif</b>, comme le sujet lui-même.'],
  ['Encore une apostrophe : vocatif pluriel','<span class="lit">filiae</span> : celles à qui l’on parle. Au pluriel non plus, la 1re déclinaison ne distingue pas le <b>vocatif</b> du nominatif ; seuls la virgule et le sens le font.']],
 mots:[{f:'filiae',an:'vocatif|pluriel',lem:'filia, ae (f.)',fn:'apostrophe',
   amb:{'nominatif|pluriel':'La forme est exactement celle du nominatif pluriel. Mais le sujet de <span class="lit">sum</span> est « je », à la première personne : ces filles ne peuvent pas en être le sujet. Elles sont interpellées.',
        'génitif|singulier':'Même terminaison, mais aucun nom à compléter ici.',
        'datif|singulier':'Même terminaison, mais le mot ne dépend d’aucun verbe.'}}]},

  ['Deux accusatifs, deux rôles','<span class="lit">Somnum</span> est l’objet de <span class="lit">habes</span> ; <span class="lit">imaginem</span> dit ce que le sommeil est. Les deux portent le même cas, mais l’un est pris par le verbe et l’autre s’appose au premier.']],

  {f:'imaginem',an:'accusatif|singulier',d:'3e',lem:'imago, imaginis (f.)',fn:'apposition à somnum',

{id:'L0141',lat:'Adhuc sub judice lis est',tr:'Le procès est encore devant le juge.',

 grp:[['lis est','le procès est'],['adhuc','encore'],['sub judice','devant le juge']],

 notes:[['L’ablatif en -e','C’est la forme normale de l’ablatif singulier à la 3e déclinaison. <span class="lit">Sub</span> peut être suivi de l’accusatif ou de l’ablatif : accusatif s’il y a mouvement vers, ablatif s’il y a repos. Ici l’affaire ne bouge pas, elle attend.']],
 mots:[{f:'judice',an:'ablatif|singulier',d:'3e',lem:'judex, judicis (m.)',fn:'après sub',
   amb:{'datif|singulier':'Le datif singulier de la 3e est en <span class="lit">-i</span> : <span class="lit">judici</span>. La terminaison <span class="lit">-e</span> n’appartient qu’à l’ablatif.',
        'accusatif|singulier':'<span class="lit">Sub</span> accepte l’accusatif, mais pour marquer un mouvement vers. Ici l’affaire est en attente, elle ne se déplace pas. Et l’accusatif serait <span class="lit">judicem</span>.'}},
  {f:'lis',an:'nominatif|singulier',d:'3e',lem:'lis, litis (f.)',fn:'sujet d’est',

{id:'L1188',lat:'Honores mutant mores',tr:'Les honneurs changent les mœurs.',
 dis:['Les mœurs changent les honneurs.','Les honneurs et les mœurs changent.'],
 grp:[['honores','les honneurs'],['mutant','changent'],['mores','les mœurs']],
 notice:'<h5>Proverbe médiéval</h5>Attesté au XIII<sup>e</sup> siècle. La suite, qu’on ne cite jamais, retourne la formule : <span class="lit">sed raro in meliores</span>, mais rarement en de meilleures.',
 notes:[['Deux mots, une terminaison, deux cas','<span class="lit">Honores</span> et <span class="lit">mores</span> se terminent de la même façon et ne sont pas au même cas. Au pluriel de la 3e, <span class="lit">-es</span> vaut pour le nominatif, le vocatif et l’accusatif. Ici <span class="lit">mutant</span> réclame un sujet, et il n’en a qu’un de disponible : le premier commande, le second subit.']],
 mots:[{f:'Honores',an:'nominatif|pluriel',d:'3e',lem:'honor, honoris (m.)',fn:'sujet',
   amb:{'accusatif|pluriel':'Même forme : au pluriel de la 3e, <span class="lit">-es</span> vaut pour le nominatif, le vocatif et l’accusatif. Mais <span class="lit">mutant</span> est à la troisième personne du pluriel et réclame un sujet : ce sont les honneurs qui changent.',
        'vocatif|pluriel':'Même forme, mais on ne s’adresse pas aux honneurs.'}},
  {f:'mores',an:'accusatif|pluriel',d:'3e',lem:'mos, moris (m.)',fn:'COD de mutant',
   amb:{'nominatif|pluriel':'Même forme que <span class="lit">honores</span>, et le même verbe. Mais <span class="lit">mutant</span> a déjà son sujet : <span class="lit">mores</span> est ce que les honneurs changent.',
        'vocatif|pluriel':'Même forme encore, mais aucune apostrophe ici.'}}]},

{id:'L2123',lat:'Plaudite, cives !',tr:'Applaudissez, citoyens !',
 dis:['Les citoyens applaudissent.','Applaudissons les citoyens !'],
 grp:[['plaudite','applaudissez'],['cives','citoyens']],
 notice:'<h5>Formule de théâtre</h5>Les comédies de Térence s’achèvent sur <span class="lit">vos valete et plaudite</span>, portez-vous bien et applaudissez. La formule avec <span class="lit">cives</span> circule dans les recueils depuis le XIX<sup>e</sup> siècle, mais aucun texte conservé ne la porte : c’est une reconstitution, faite à partir d’un usage bien réel.',
 notes:[['Au pluriel, la règle ne change pas','Le vocatif reste identique au nominatif, comme il l’était au singulier pour <span class="lit">virgo</span>. <span class="lit">Cives</span> pourrait donc être un sujet. Ce qui l’en empêche, c’est <span class="lit">plaudite</span> : un impératif n’exprime jamais le sien, et les citoyens sont ceux à qui l’on parle.']],
 mots:[{f:'cives',an:'vocatif|pluriel',d:'3e',lem:'civis, civis (m.)',fn:'apostrophe',
   amb:{'nominatif|pluriel':'La forme est identique. Mais <span class="lit">plaudite</span> est un impératif, et l’impératif n’exprime jamais son sujet : les citoyens sont ceux à qui l’on parle.',
        'accusatif|pluriel':'Même forme encore, mais <span class="lit">plaudite</span> n’a pas d’objet : on n’applaudit pas les citoyens, on leur demande d’applaudir.'}}]},

{id:'L1557',lat:'Mater artium necessitas',tr:'La nécessité est la mère des talents.',

 grp:[['mater','la mère'],['artium','des talents'],['necessitas','(est) la nécessité']],
 notice:'<h5>Proverbe du latin populaire</h5>C’est le besoin qui fait trouver le procédé. Aucun auteur ne la revendique : elle appartient à ce fonds de formules dont on ne connaît jamais que la circulation.',
 notes:[['Le génitif pluriel en -ium','<span class="lit">Artium</span> vient de <span class="lit">ars, artis</span>. La 3e a <b>deux</b> génitifs pluriels : <span class="lit">-um</span>, le plus fréquent, et <span class="lit">-ium</span>, celui d’<span class="lit">artium</span>. On verra plus tard à quoi tient le partage. Attention à ne pas prendre ce <span class="lit">-um</span> pour l’accusatif singulier de la 2e : là-bas c’est un singulier, ici un pluriel.'],
  ['Sujet et attribut interchangeables','Aucun verbe n’est exprimé, et <span class="lit">mater</span> comme <span class="lit">necessitas</span> sont au nominatif. Rien ne dit lequel est le sujet : la phrase se lit dans les deux sens, et les deux disent la même chose.']],
 mots:[{f:'Mater',an:'nominatif|singulier',d:'3e',lem:'mater, matris (f.)',fn:'attribut, ou sujet',
   amb:{'vocatif|singulier':'Même forme, mais on ne s’adresse à personne ici.'}},
  {f:'artium',an:'génitif|pluriel',d:'3e',lem:'ars, artis (f.)',fn:'complément de mater',
   amb:{'accusatif|singulier':'Aucun accusatif de la 3e ne finit en <span class="lit">-ium</span>.'}},
  {f:'necessitas',an:'nominatif|singulier',d:'3e',lem:'necessitas, necessitatis (f.)',fn:'sujet, ou attribut',
   amb:{'accusatif|singulier':'Ce serait <span class="lit">necessitatem</span>. Le nominatif, lui, s’arrête à <span class="lit">-tas</span>.'}}]},

{id:'L2082',lat:'Pedibus timor addidit alas',tr:'La peur ajouta des ailes à ses pieds.',

   amb:{'ablatif|pluriel':'La terminaison <span class="lit">-ibus</span> vaut pour les deux, comme <span class="lit">dentibus</span> dans la phrase du chien. Mais <span class="lit">addidit</span> ajoute quelque chose <b>à</b> quelque chose : c’est un datif.'}},
  {f:'timor',an:'nominatif|singulier',d:'3e',lem:'timor, timoris (m.)',fn:'sujet',
   amb:{'vocatif|singulier':'Même forme, mais on ne s’adresse pas à la peur.'}},
  {f:'alas',an:'accusatif|pluriel',d:'1re',lem:'ala, ae (f.)',fn:'COD d’addidit',

const NOTE_PARAD=`<b>Sept terminaisons pour dix cases — et deux cases qui n’en ont aucune.</b><div class="term"><i></i><i>singulier</i><i>pluriel</i><i>Nom.</i><s>—</s><u>-es</u><i>Voc.</i><s>—</s><u>-es</u><i>Acc.</i><u>-em</u><u>-es</u><i>Gén.</i><u>-is</u><u>-um / -ium</u><i>Dat.</i><u>-i</u><u>-ibus</u><i>Abl.</i><u>-e</u><u>-ibus</u></div>Le tiret ne marque pas une case vide : il marque qu’il <b>n’y a pas de terminaison à retenir</b>. <span class="lit">homo</span>, <span class="lit">mater</span>, <span class="lit">canis</span>, <span class="lit">timor</span>, <span class="lit">lis</span>, <span class="lit">virgo</span> : onze mots, onze terminaisons différentes. La 3e déclinaison n’a pas de nominatif type, et c’est là toute sa difficulté — il faut lire la seconde forme du dictionnaire pour trouver le radical.<br><br>Le vocatif, lui, ne s’écrit jamais autrement que le nominatif. Sur les cinq déclinaisons, une seule case porte une forme qui lui soit propre : le <span class="lit">-e</span> d’<span class="lit">amice</span>, à la 2e. Tu viens de ranger <span class="lit">virgo</span> et <span class="lit">cives</span> dans des cases que rien, dans leur terminaison, ne désignait : ce sont les phrases qui l’ont dit, les impératifs <span class="lit">collige</span> et <span class="lit">plaudite</span>.`;

   amb:{'datif|singulier':'Le datif singulier est en <span class="lit">-i</span> lui aussi : les deux se confondent, comme partout à la 3e. Mais <span class="lit">a</span> ne peut être suivi que d’un ablatif.',
        'nominatif|singulier':'Le nominatif est <span class="lit">mare</span>, comme à la fin de la phrase. Compare les deux formes.'}},
  {f:'mare',an:'accusatif|singulier',d:'3e',lem:'mare, maris (n.)',fn:'après ad',
   amb:{'nominatif|singulier':'La forme est identique — c’est la règle du neutre. Mais <span class="lit">ad</span> ne peut être suivi que d’un accusatif.',
        'ablatif|singulier':'L’ablatif de ce mot est <span class="lit">mari</span>, comme au début de la phrase. Regarde les deux formes : elles ne se ressemblent pas.'}}]},

{id:'L1201',lat:'Hostis humani generis',tr:'Ennemi du genre humain.',
 dis:['L’ennemi est de race humaine.','Le genre humain est ennemi.'],
 grp:[['hostis','ennemi'],['generis','du genre'],['humani','humain']],
 notice:'<h5>Langue du droit</h5>Terme du droit maritime, appliqué au pirate : quiconque peut le poursuivre, puisqu’il n’est l’ennemi de personne en particulier. Cicéron a l’idée mais non la formule — chez lui le pirate est <span class="lit">communis hostis omnium</span>. Ce sont les juristes anglais Coke et Blackstone qui la fixent, et le XIX<sup>e</sup> siècle l’étendra aux négriers.',
 notes:[['Le génitif en -is','<span class="lit">Generis</span> complète <span class="lit">hostis</span> : ennemi de quoi ? La terminaison est la même qu’au masculin et au féminin — le neutre ne se distingue qu’au nominatif, au vocatif et à l’accusatif. Partout ailleurs, il se décline comme les autres.'],
  ['Deux mots en -is, deux cas','<span class="lit">Hostis</span> est un nominatif, <span class="lit">generis</span> un génitif. Rien dans la terminaison ne le dit : c’est le sens qui range l’un sous l’autre.']],
 mots:[{f:'Hostis',an:'nominatif|singulier',d:'3e',lem:'hostis, hostis (m.)',fn:'sujet',
   amb:{'génitif|singulier':'Le génitif de ce mot s’écrit aussi <span class="lit">hostis</span> — c’est l’un des cas où le dictionnaire répète la forme. Mais un génitif ne peut pas ouvrir la phrase sans mot à compléter.'}},
  {f:'generis',an:'génitif|singulier',d:'3e',lem:'genus, generis (n.)',fn:'complément d’hostis',
   amb:{'nominatif|singulier':'Le nominatif est <span class="lit">genus</span>, en <span class="lit">-us</span> — ce qui le fait ressembler à un masculin de la 2e. C’est le piège de l’unité.'}}]},

{id:'L2686',lat:'Tempori serviendum est',tr:'Il faut s’adapter à la circonstance.',
 dis:['Le temps doit être servi par nous.','Il faut du temps pour servir.'],
 grp:[['serviendum est','il faut s’adapter'],['tempori','à la circonstance']],
 notice:'<h5>Cicéron, Correspondance</h5>Printemps 49, guerre civile. Cicéron décrit à Atticus une lutte pour la royauté entre deux hommes, dont le plus modéré a été chassé et dont l’autre, s’il gagne, vaincra à la manière de Sylla. Puis il conclut : <span class="lit">neutrum tibi palam sentiendum et tempori serviendum est</span> — ne te prononce ouvertement pour aucun des deux, et sers la circonstance. Le conseil de prudence d’un homme qui sait déjà qu’il n’y a pas de bon camp.',
 notes:[['Le datif en -i','<span class="lit">Servio</span> se construit avec le datif : servir <b>à</b> quelque chose. Le neutre y prend la même terminaison que le masculin et le féminin.'],
  ['<span class="lit">Tempus</span> veut dire deux choses','Le temps qui passe, et le moment favorable — la circonstance, l’occasion. C’est ce second sens qui est ici, et il explique pourquoi la traduction ne parle pas du temps.']],
 mots:[{f:'Tempori',an:'datif|singulier',d:'3e',lem:'tempus, temporis (n.)',fn:'après serviendum est',
   amb:{'ablatif|singulier':'L’ablatif serait <span class="lit">tempore</span>, en <span class="lit">-e</span>. La terminaison <span class="lit">-i</span> est celle du datif.',
        'génitif|singulier':'Le génitif est <span class="lit">temporis</span> : c’est lui que donne le dictionnaire, et il ne ressemble pas au nominatif.'}}]},

{id:'L1600',lat:'Mens sana in corpore sano',tr:'Un esprit sain dans un corps sain.',
 dis:['Un corps sain dans un esprit sain.','L’esprit et le corps sont sains.'],
 grp:[['mens','un esprit'],['sana','bien portant'],['in corpore','dans un corps'],['sano','bien portant']],
 notice:'<h5>Juvénal, Satires X</h5>Juvénal énumère ce qu’il est raisonnable de demander aux dieux, contre tout ce que les hommes leur réclament de travers. La formule est devenue le nom d’une marque : <b>ASICS</b> est l’acronyme d’<span class="lit">anima sana in corpore sano</span> — il a fallu remplacer <span class="lit">mens</span> par <span class="lit">anima</span> pour que les initiales tombent juste.',
 notes:[['L’ablatif en -e','C’est la forme normale du neutre à la 3e déclinaison : <span class="lit">corpore</span>, <span class="lit">tempore</span>, <span class="lit">opere</span>, <span class="lit">itinere</span>. Le <span class="lit">-i</span> de <span class="lit">mari</span> est l’exception, non la règle.'],
  ['Un nominatif qui ment','<span class="lit">Corpus</span> se termine par <span class="lit">-us</span> comme <span class="lit">amicus</span>, et pourtant il est neutre et de la 3e. Le génitif <span class="lit">corporis</span> est le seul indice fiable. Retiens le couple : c’est le piège de toute l’unité.']],
 mots:[{f:'Mens',an:'nominatif|singulier',d:'3e',lem:'mens, mentis (f.)',fn:'sujet sous-entendu',
   amb:{'accusatif|singulier':'L’accusatif serait <span class="lit">mentem</span>. Ce mot est féminin : il distingue ses cas, contrairement au neutre.'}},
  {f:'corpore',an:'ablatif|singulier',d:'3e',lem:'corpus, corporis (n.)',fn:'après in',
   amb:{'datif|singulier':'Le datif est en <span class="lit">-i</span> : <span class="lit">corpori</span>. La terminaison <span class="lit">-e</span> n’appartient qu’à l’ablatif.',
        'nominatif|singulier':'Le nominatif est <span class="lit">corpus</span>, en <span class="lit">-us</span> — et c’est bien là le piège.'}}]},

{id:'L2386',lat:'Quot capita, tot sententiae',tr:'Autant de têtes, autant d’avis.',
 dis:['Autant d’avis, autant de têtes qui les portent.','Il y a plus d’avis que de têtes.'],
 grp:[['quot capita','autant de têtes'],['tot sententiae','autant d’avis']],
 notice:'<h5>D’après Térence</h5>Le <i>Phormion</i> porte <span class="lit">quot homines tot sententiae : suo quoique mos</span> — autant d’hommes, autant d’avis, chacun sa manière. Érasme l’a mise en circulation par les <i>Adages</i>. Une seconde forme, <span class="lit">quot capita tot sensus</span>, court dans la tradition française : la nôtre croise les deux.',
 notes:[['Le pluriel neutre en -a','<span class="lit">Capita</span> vaut pour trois cases à lui seul — nominatif, vocatif et accusatif pluriels. C’est la marque la plus visible du neutre, et elle traverse les déclinaisons : le <span class="lit">-a</span> d’<span class="lit">arma</span>, à l’unité 3, faisait déjà le même travail.'],
  ['Deux corrélatifs','<span class="lit">Quot… tot…</span> : autant… autant… Le latin construit l’égalité par un simple couple de mots, sans verbe et sans préposition.']],
 mots:[{f:'capita',an:'nominatif|pluriel',d:'3e',lem:'caput, capitis (n.)',fn:'sujet sous-entendu',
   amb:{'accusatif|pluriel':'Même forme — le neutre ne les distingue jamais. Mais aucun verbe transitif n’est là pour en faire un objet.',
        'nominatif|singulier':'Le nominatif singulier est <span class="lit">caput</span>. Le <span class="lit">-a</span> final est la marque du pluriel neutre.'}},
  {f:'sententiae',an:'nominatif|pluriel',d:'1re',lem:'sententia, ae (f.)',fn:'sujet sous-entendu',
   amb:{'génitif|singulier':'La 1re confond le génitif singulier et le nominatif pluriel : la terminaison <span class="lit">-ae</span> vaut pour les deux. Ici <span class="lit">tot</span>, « autant de », appelle un pluriel.',
        'datif|singulier':'Même terminaison encore. Mais rien n’appelle un datif dans cette phrase sans verbe.'}}]},

{id:'L2652',lat:'Sursum corda !',tr:'Haut les cœurs !',
 dis:['Nos cœurs sont en haut.','Le cœur s’élève.'],
 grp:[['sursum','haut'],['corda','les cœurs']],
 notice:'<h5>Cyprien de Carthage</h5>Ce n’est pas une exclamation mais une <b>moitié de dialogue</b>. Vers 250, Cyprien décrit déjà le prêtre qui prépare l’assemblée en disant <span class="lit">Sursum corda</span>, à quoi le peuple répond <span class="lit">Habemus ad Dominum</span> — nous les tenons tournés vers le Seigneur. Dix-sept siècles plus tard, la même réplique se donne encore.',
 notes:[['Un accusatif sans verbe','<span class="lit">Corda</span> est l’objet d’un verbe qu’on ne dit pas — <i>levez</i>, <i>tenez</i>. Le latin s’en passe parce que l’ordre est clair. Et comme le mot est neutre, sa forme d’accusatif est aussi celle du nominatif : rien ne le trahit.'],
  ['<span class="lit">Cor</span> est un tout petit mot','Nominatif <span class="lit">cor</span>, génitif <span class="lit">cordis</span>. Le nominatif ne garde presque rien du radical — comme <span class="lit">caput</span>, comme <span class="lit">jus</span>. C’est la 3e déclinaison qui recommence.']],
 mots:[{f:'corda',an:'accusatif|pluriel',d:'3e',lem:'cor, cordis (n.)',fn:'objet d’un verbe sous-entendu',
   amb:{'nominatif|pluriel':'Même forme, comme toujours au neutre. Mais <span class="lit">sursum</span> est un adverbe de mouvement : il appelle un ordre, donc un objet.'}}]},

{id:'L0426',lat:'Belua multorum capitum',tr:'La bête aux nombreuses têtes.',
 dis:['Les nombreuses têtes de la bête.','Une bête à la tête énorme.'],
 grp:[['belua','la bête'],['multorum','des nombreuses'],['capitum','têtes']],
 notice:'<h5>Horace, Épîtres I, 1</h5>Horace vient de citer la fable du renard qui refuse d’entrer chez le lion malade, parce que toutes les traces vont vers l’antre et qu’aucune n’en revient. Puis il se tourne vers le peuple romain et l’apostrophe : <span class="lit">belua multorum <b>es</b> capitum</span> — tu es un monstre à cent têtes. La locution a laissé tomber le <span class="lit">es</span>, et du même coup l’insulte en face.',
 notes:[['Le génitif pluriel en -um','<span class="lit">Capitum</span> complète <span class="lit">belua</span> : la bête <b>de</b> nombreuses têtes. Le français préfère « aux », le latin met un génitif — c’est la construction ordinaire pour décrire ce dont une chose est pourvue.'],
  ['Deux génitifs pluriels','La 3e déclinaison en a deux : <span class="lit">-um</span> et <span class="lit">-ium</span>. Le premier est le plus fréquent — <span class="lit">capitum</span>, <span class="lit">corporum</span>, <span class="lit">temporum</span> ; le second est celui d’<span class="lit">artium</span>, que tu as vu à l’unité précédente. On apprendra plus tard à quoi tient le partage ; pour l’instant, retiens que les deux existent.'],
  ['Ne prends pas <span class="lit">-um</span> pour un accusatif','C’est le piège du jour. À la 2e déclinaison, <span class="lit">-um</span> est un accusatif singulier — <span class="lit">amicum</span>, <span class="lit">bellum</span>. À la 3e, c’est un génitif <b>pluriel</b>. Même terminaison, deux nombres et deux cas : c’est le radical qui décide, et lui seul.']],
 mots:[{f:'Belua',an:'nominatif|singulier',d:'1re',lem:'belua, beluae (f.)',fn:'sujet',
   amb:{'ablatif|singulier':'L’ablatif de la 1re est en <span class="lit">-a</span> aussi, mais long ; à l’écrit rien ne les sépare. Ici le mot est le sujet de la phrase.'}},
  {f:'capitum',an:'génitif|pluriel',d:'3e',lem:'caput, capitis (n.)',fn:'complément de belua',
   amb:{'accusatif|singulier':'Aucun accusatif de la 3e ne finit en <span class="lit">-um</span> au neutre : ce serait <span class="lit">caput</span>, identique au nominatif.'}}]},

{id:'L2011',lat:'Operibus credite !',tr:'Croyez aux œuvres !',
 dis:['Les œuvres sont croyables.','Croyez par vos œuvres.'],
 grp:[['credite','croyez'],['operibus','aux œuvres']],
 notice:'<h5>Vulgate, Jean 10</h5>À la fête de la Dédicace, les Juifs sont sur le point de le lapider ; Jésus répond : <span class="lit">si autem facio et si mihi non vultis credere, operibus credite</span> — si vous ne voulez pas me croire, croyez aux œuvres. Jugez sur pièces, pas sur parole.',
 notes:[['Le datif pluriel en -ibus','<span class="lit">Credo</span> se construit avec le datif : croire <b>à</b> quelque chose. La terminaison est la même que pour les masculins et les féminins — <span class="lit">pedibus</span>, <span class="lit">dentibus</span> à l’unité précédente.'],
  ['La même forme reviendra en ablatif','Dans <span class="lit">Deum agnoscis ex operibus</span>, que tu trouveras plus loin, <span class="lit">operibus</span> suit <span class="lit">ex</span> et devient un ablatif. Deux cas, une seule forme : seule la construction décide.']],
 mots:[{f:'Operibus',an:'datif|pluriel',d:'3e',lem:'opus, operis (n.)',fn:'après credite',
   amb:{'ablatif|pluriel':'La terminaison <span class="lit">-ibus</span> vaut pour les deux. Mais <span class="lit">credo</span> demande un datif, et aucune préposition n’est là pour imposer l’ablatif.'}}]},

{id:'L1513',lat:'Magnis itineribus',tr:'À marches forcées.',
 dis:['Par de grands chemins.','Sur de longues routes.'],
 grp:[['magnis','à grandes'],['itineribus','marches']],
 notice:'<h5>César</h5>Expression courante de la <i>Guerre des Gaules</i> pour la marche forcée : plus d’étapes par jour que le règlement, la troupe arrivant avant qu’on l’attende. César l’intensifie parfois en <span class="lit">quam maximis potest itineribus</span>, ce qui montre que <span class="lit">magnis itineribus</span> est le degré normal d’un procédé, non une hyperbole isolée.',
 notes:[['L’ablatif pluriel en -ibus','Même terminaison que le datif, une fois de plus. Ici c’est un ablatif de moyen : on avance <b>par</b> de grandes étapes.'],
  ['Un nominatif méconnaissable','<span class="lit">Iter</span> au nominatif, <span class="lit">itineris</span> au génitif : le radical apparaît tout entier dans la seconde forme et presque pas dans la première. Le français a gardé la seconde — <i>itinéraire</i>.']],
 mots:[{f:'itineribus',an:'ablatif|pluriel',d:'3e',lem:'iter, itineris (n.)',fn:'ablatif de moyen',
   amb:{'datif|pluriel':'La terminaison vaut pour les deux, comme dans <span class="lit">Operibus credite</span>. Mais rien ici ne réclame un datif : la locution dit par quel moyen on avance.'}}]}
];

/* ═══════════════ FACULTATIF — famille de mots ═══════════════ */
const FAM=[
{lem:'jus, juris (n.)',sens:'le droit',cit:'Summum jus summa injuria',
 der:['justice','juger','injure','jus'],ko:'jus',
 koexp:'<b>jus</b>, celui qu’on boit, vient d’un <b>autre mot latin</b>, homonyme parfait : <span class="lit">jus, juris</span> au sens de « sauce, brouet ». Deux entrées distinctes dans le dictionnaire, un seul mot en français.',
 mot:'Le latin avait deux <span class="lit">jus</span>, tous deux neutres et tous deux de la 3e : le droit, et le bouillon. Le premier a donné <b>justice</b>, <b>juger</b>, <b>injure</b> ; le second, attesté en français dès 1165 chez Chrétien de Troyes, a donné le <b>jus</b> de la viande puis celui des fruits — Littré le rapproche du sanscrit <i>yûsha</i>, le bouillon. Curiosité : Curtius avait tenté de les ramener à une racine unique signifiant « lier, mêler ». L’étymologie moderne les sépare, mais l’idée qu’un bouillon et une loi soient l’un et l’autre des mélanges de choses liées avait quelque chose.'},
{lem:'corpus, corporis (n.)',sens:'le corps',cit:'Mens sana in corpore sano',
 der:['corps','corset','corpulent','corsaire'],ko:'corsaire',

 notice:'<h5>Sénèque, Apocoloquintose</h5>Le Sénat des dieux délibère sur la divinisation de Claude, et <b>Hercule court de l’un à l’autre pour acheter des voix</b> : « ne me refuse pas cela, c’est mon affaire qui se joue ; ensuite, si tu veux quelque chose, je te le rendrai — <span class="lit">manus manum lavat</span> ». Ce n’est pas une maxime sur l’entraide. Chez Pétrone, un affranchi s’en sert pour chiffrer un renvoi d’ascenseur : « il m’a offert un spectacle, et moi je l’applaudis ; compte, je te donne plus que je n’ai reçu ». L’origine est un vers du comique grec Épicharme.',
 notes:[['Deux cases d’un seul mot','<span class="lit">Manus</span> au nominatif, <span class="lit">manum</span> à l’accusatif. Le dictionnaire écrit <span class="lit">manus, manus</span> : ici les deux formes se distinguent, mais tu verras que c’est l’exception plutôt que la règle.'],
  ['L’accusatif en -um','Il est identique à celui de la 2e déclinaison — <span class="lit">amicum</span>, <span class="lit">manum</span>. C’est la seule case du singulier où la 4e ne dit pas <span class="lit">-us</span>.'],
  ['Un geste, deux intentions','À l’unité 4, Pilate se lavait les mains pour se dégager. Ici Hercule lave celle d’autrui pour être payé en retour. Même geste, intention opposée.']],
 mots:[{f:'Manus',an:'nominatif|singulier',d:'4e',lem:'manus, manus (f.)',fn:'sujet',
   amb:{'génitif|singulier':'Le génitif s’écrit <span class="lit">manus</span> lui aussi — c’est la difficulté de cette déclinaison. Mais <span class="lit">lavat</span> réclame un sujet.',
        'nominatif|pluriel':'Même forme encore. Mais <span class="lit">lavat</span> est à la troisième personne du <b>singulier</b>.'}},
  {f:'manum',an:'accusatif|singulier',d:'4e',lem:'manus, manus (f.)',fn:'COD de lavat',
   amb:{'nominatif|singulier':'Le nominatif est <span class="lit">manus</span>, comme au début de la phrase. Compare les deux formes : c’est l’une des rares fois où la 4e les sépare.'}}]},

{id:'L3042',lat:'Veni, sancte Spiritus',tr:'Viens, Esprit saint.',
 dis:['L’Esprit saint est venu.','Je viens, Esprit saint.'],
 grp:[['veni','viens'],['sancte Spiritus','Esprit saint']],
 notice:'<h5>Liturgie de la Pentecôte</h5>Deux textes différents commencent ainsi : une antienne du XI<sup>e</sup> siècle, et la <b>Séquence dorée</b> du XIII<sup>e</sup>, attribuée après bien des hésitations à Étienne Langton, archevêque de Cantorbéry. Le concile de Trente a supprimé en 1570 la quasi-totalité des centaines de séquences médiévales : <b>quatre seulement ont survécu</b>, dont celle-ci.',
 notes:[['Le vocatif copie le nominatif','Comme au neutre. Et c’est ici la meilleure preuve qu’on n’est pas à la 2e masculine : là-bas, on dirait <span class="lit">Spirite</span>.'],
  ['Deux vocatifs de forme opposée','<span class="lit">Sancte</span> est un vocatif de 2e en <span class="lit">-e</span>, accordé à <span class="lit">Spiritus</span>, vocatif de 4e en <span class="lit">-us</span>. Deux mots, deux terminaisons contraires, un seul cas. C’est ce qui t’attend quand on abordera les adjectifs.']],
 mots:[{f:'Spiritus',an:'vocatif|singulier',d:'4e',lem:'spiritus, spiritus (m.)',fn:'apostrophe',
   amb:{'nominatif|singulier':'La forme est identique — la 4e n’a pas de vocatif propre. Mais <span class="lit">veni</span> est un impératif, et l’Esprit est celui à qui l’on parle.',
        'génitif|singulier':'Même forme encore. Mais il n’y a aucun nom à compléter dans cette phrase.'}}]},

{id:'L2449',lat:'Sacrificium intellectus',tr:'Le sacrifice de l’intelligence.',
 dis:['L’intelligence du sacrifice.','Un sacrifice intelligent.'],
 grp:[['sacrificium','le sacrifice'],['intellectus','de l’intelligence']],
 notice:'<h5>Vocabulaire théologique</h5>La doctrine est d’Ignace de Loyola, la formule ne l’est pas : le terme n’est né qu’aux alentours du concile Vatican I, en 1870, puis appliqué rétroactivement. Ce qu’Ignace écrit, c’est que le plus haut degré d’obéissance est atteint quand l’inférieur ne veut pas seulement ce que veut le supérieur, mais <b>pense ce qu’il pense</b>. Bismarck emploiera l’expression dans ses mémoires pour dire que ses ministres avaient capitulé devant Guillaume II.',
 notes:[['Le génitif en -us','Voilà la vraie difficulté. <span class="lit">Intellectus</span> est ici un <b>génitif</b>, et il s’écrit exactement comme le nominatif. Seule la construction le dit : un sacrifice <b>de</b> quoi ?'],
  ['Un nominatif qui ment','<span class="lit">Intellectus</span> ressemble à <span class="lit">amicus</span>. Le dictionnaire donne <span class="lit">intellectus, intellectus</span> : le génitif en <span class="lit">-us</span> range le mot à la 4e, celui en <span class="lit">-i</span> l’aurait rangé à la 2e.']],
 mots:[{f:'Sacrificium',an:'nominatif|singulier',d:'2e',lem:'sacrificium, ii (n.)',fn:'sujet sous-entendu',
   amb:{'accusatif|singulier':'Même forme : le neutre ne les distingue jamais. Mais aucun verbe transitif n’est là.'}},
  {f:'intellectus',an:'génitif|singulier',d:'4e',lem:'intellectus, intellectus (m.)',fn:'complément de sacrificium',
   amb:{'nominatif|singulier':'La forme est identique — c’est la marque de la 4e. Mais deux nominatifs côte à côte ne feraient pas de phrase : le second complète le premier.'}}]},

{id:'L1116',lat:'Gloria Patri et Filio et Spiritui Sancto',tr:'Gloire au Père, et au Fils, et à l’Esprit Saint.',
 dis:['La gloire du Père, du Fils et de l’Esprit Saint.','Le Père, le Fils et l’Esprit Saint sont la gloire.'],
 grp:[['gloria','gloire'],['Patri','au Père'],['et Filio','et au Fils'],['et Spiritui Sancto','et à l’Esprit Saint']],
 notice:'<h5>Doxologie mineure</h5>La formule est attestée dès le II<sup>e</sup> siècle, mais sa seconde moitié est un ajout de combat : le concile de Vaison, en 529, ordonne d’ajouter <span class="lit">sicut erat in principio</span> « à cause des hérétiques qui disent que le Fils de Dieu a commencé dans le temps ». Et l’on ne sait plus à quoi <span class="lit">erat</span> se rapporte : tout le monde comprend aujourd’hui « comme <b>la gloire</b> était au commencement », mais il semble qu’à l’origine ce fût « comme <b>le Fils</b> était au commencement » — allusion transparente aux premiers mots de l’Évangile de Jean.',
 notes:[['Trois datifs, trois déclinaisons','<span class="lit">Patri</span> est de la 3e, <span class="lit">Filio</span> de la 2e, <span class="lit">Spiritui</span> de la 4e. Une seule phrase, et tout ce que tu sais du datif s’y trouve.'],
  ['Le datif en -ui','C’est la terminaison propre de la 4e, et la seule case du singulier qui ne ressemble à rien d’autre. Retiens-la : elle te servira à reconnaître la déclinaison quand le nominatif te trompera.'],
  ['Un adjectif d’une autre déclinaison','<span class="lit">Sancto</span> est un datif de 2e, accordé à <span class="lit">Spiritui</span> qui est de la 4e. L’adjectif ne prend pas la déclinaison de son nom : il prend son cas, son genre et son nombre, et les dit avec ses propres terminaisons.']],
 mots:[{f:'Gloria',an:'nominatif|singulier',d:'1re',lem:'gloria, ae (f.)',fn:'sujet sous-entendu',
   amb:{'ablatif|singulier':'L’ablatif de la 1re s’écrit pareil. Mais aucune préposition, aucun verbe n’en demande un ici.'}},
  {f:'Patri',an:'datif|singulier',d:'3e',lem:'pater, patris (m.)',fn:'celui à qui l’on rend gloire',
   amb:{'ablatif|singulier':'L’ablatif singulier de la 3e est en <span class="lit">-e</span> : <span class="lit">patre</span>.'}},
  {f:'Filio',an:'datif|singulier',d:'2e',lem:'filius, ii (m.)',fn:'celui à qui l’on rend gloire',
   amb:{'ablatif|singulier':'La 2e confond le datif et l’ablatif singuliers en <span class="lit">-o</span>. Ici <span class="lit">et</span> le range avec <span class="lit">Patri</span>, qui est un datif.'}},
  {f:'Spiritui',an:'datif|singulier',d:'4e',lem:'spiritus, spiritus (m.)',fn:'celui à qui l’on rend gloire',
   amb:{'ablatif|singulier':'L’ablatif singulier de la 4e est en <span class="lit">-u</span> : <span class="lit">spiritu</span>. Le <span class="lit">-ui</span> n’appartient qu’au datif.'}}]},

{id:'L1433',lat:'Lato sensu',tr:'Au sens large.',
 dis:['Le sens est large.','Dans un large espace.'],
 grp:[['sensu','au sens'],['lato','large']],
 notice:'<h5>Formule d’école</h5>Elle s’oppose à <span class="lit">stricto sensu</span>, au sens strict. On l’entend et on l’écrit souvent « latu sensu », qui est fautif : l’adjectif est <span class="lit">latus, lata, latum</span>, et son ablatif neutre est <span class="lit">lato</span>. Aucune source antique — c’est du latin de professeur, comme <span class="lit">grosso modo</span> ou <span class="lit">a contrario</span>.',
 notes:[['L’ablatif en -u','Une seule lettre, et c’est la case la plus reconnaissable de la déclinaison. On la retrouve dans <span class="lit">de visu</span>, <span class="lit">in situ</span>, <span class="lit">manu militari</span>.'],
  ['L’adjectif n’est pas de la même déclinaison','<span class="lit">Lato</span> est un ablatif de 2e accordé à <span class="lit">sensu</span>, qui est de la 4e — comme <span class="lit">Sancto</span> tout à l’heure. Les deux mots ne se ressemblent pas et sont pourtant au même cas.']],
 mots:[{f:'sensu',an:'ablatif|singulier',d:'4e',lem:'sensus, sensus (m.)',fn:'ablatif de point de vue',
   amb:{'datif|singulier':'Le datif est en <span class="lit">-ui</span> : <span class="lit">sensui</span>.',
        'nominatif|singulier':'Le nominatif est <span class="lit">sensus</span>. Le <span class="lit">-u</span> seul n’appartient qu’à l’ablatif.'}}]}
,
{id:'L2452',lat:'Saepe morborum gravium exitus incerti sunt',tr:'Souvent, les issues des maladies graves sont incertaines.',
 dis:['Souvent, les maladies graves ont une issue certaine.','Les issues incertaines sont souvent graves.'],
 grp:[['saepe','souvent'],['exitus','les issues'],['morborum gravium','des maladies graves'],['incerti sunt','sont incertaines']],
 notice:'<h5>Adage médical</h5>Aucune source. Onze répertoires la donnent — en français, en italien, en roumain, en polonais, en sicilien — et pas un ne cite d’auteur. Elle appartient à ce fonds de sentences de métier dont on ne connaît jamais que la circulation, comme <span class="lit">salus aegroti suprema lex</span>, qui la suit dans presque tous les recueils.',
 notes:[['Le nominatif pluriel en -us','Il est identique au nominatif singulier, et rien dans le mot ne les sépare. Ici seul <span class="lit">incerti sunt</span> tranche : le verbe est au pluriel, donc le sujet aussi.'],
  ['C’est la difficulté de la 4e en une phrase','<span class="lit">Exitus</span> peut être six choses. Chaque fois, il faudra regarder ailleurs que le mot lui-même.']],
 mots:[{f:'morborum',an:'génitif|pluriel',d:'2e',lem:'morbus, i (m.)',fn:'complément d’exitus',
   amb:{}},
  {f:'exitus',an:'nominatif|pluriel',d:'4e',lem:'exitus, exitus (m.)',fn:'sujet',
   amb:{'nominatif|singulier':'Même forme, et c’est tout le problème. Mais <span class="lit">sunt</span> est au pluriel : le sujet l’est donc aussi.',
        'génitif|singulier':'Même forme encore. Mais un génitif aurait un nom à compléter, et il n’y en a pas.',
        'accusatif|pluriel':'Même forme toujours. Mais <span class="lit">sunt</span> n’est pas un verbe transitif : il lui faut un sujet, non un objet.'}}]},

{id:'L1683',lat:'Natura non facit saltus',tr:'La nature ne fait pas de sauts.',
 dis:['Les sauts ne font pas la nature.','La nature ne fait qu’un saut.'],
 grp:[['natura','la nature'],['non facit','ne fait pas'],['saltus','de sauts']],
 notice:'<h5>Linné, Philosophia botanica</h5>De Linné, non d’Aristote. La formule latine paraît en 1751 ; l’idée, elle, est bien d’Aristote. Leibniz l’avait énoncée <b>en français</b> — « tout va par degré dans la nature, et rien par saut » — pour combattre Newton et nier les quantités indivisibles. Darwin s’en sert pour la sélection naturelle, l’économiste Alfred Marshall la met en épigraphe de son manuel en 1890, et la mécanique quantique finit par la démentir avec son saut du même nom.',
 notes:[['L’accusatif pluriel en -us','Encore la même forme. <span class="lit">Saltus</span> est ici un objet, parce que <span class="lit">facit</span> est transitif — c’est le verbe qui le dit, jamais la terminaison.'],
  ['Un mot, deux sens','<span class="lit">Saltus</span> désigne le saut, mais aussi le défilé de montagne et le pâturage boisé. Deux mots différents en réalité, que le latin écrit pareil.']],
 mots:[{f:'Natura',an:'nominatif|singulier',d:'1re',lem:'natura, ae (f.)',fn:'sujet',
   amb:{'ablatif|singulier':'L’ablatif de la 1re s’écrit pareil, mais <span class="lit">facit</span> réclame un sujet.'}},
  {f:'saltus',an:'accusatif|pluriel',d:'4e',lem:'saltus, saltus (m.)',fn:'COD de facit',
   amb:{'nominatif|singulier':'Même forme, comme toujours à la 4e. Mais <span class="lit">Natura</span> est déjà le sujet, et <span class="lit">facit</span> appelle un objet.',
        'génitif|singulier':'Même forme encore. Mais il n’y a aucun nom à compléter.'}}]},

{id:'L2969',lat:'Documentum humanorum casuum fuit',tr:'Il fut un exemple des vicissitudes humaines.',
 dis:['Les vicissitudes humaines furent un exemple.','Il fut l’exemple d’un accident humain.'],
 grp:[['fuit','il fut'],['documentum','un exemple'],['casuum','des vicissitudes'],['humanorum','humaines']],
 notice:'<h5>Tite-Live, livre XLV</h5>Triomphe de Paul-Émile sur la Macédoine, en 167. Le roi vaincu Persée marche enchaîné devant le char — mais Tite-Live ajoute aussitôt : <span class="lit">sed etiam victor Paulus auro purpuraque fulgens</span>, <b>et le vainqueur aussi, resplendissant d’or et de pourpre</b>. Paul-Émile venait de perdre ses deux fils, l’un quelques jours avant le triomphe, l’autre quelques jours après. Notre citation s’arrête juste avant le retournement.',
 notes:[['Le génitif pluriel en -uum','C’est la seule case de la déclinaison qu’on ne puisse confondre avec aucune autre. Deux <span class="lit">u</span> de suite : nulle part ailleurs.'],
  ['<span class="lit">Documentum</span> n’est pas l’exemple à imiter','Le mot vient de <span class="lit">doceo</span>, enseigner : c’est la leçon, la preuve, l’avertissement. Ce que le peuple romain devait apprendre en regardant passer les deux hommes.']],
 mots:[{f:'Documentum',an:'nominatif|singulier',d:'2e',lem:'documentum, i (n.)',fn:'attribut',
   amb:{'accusatif|singulier':'Même forme au neutre. Mais <span class="lit">fuit</span> n’a pas d’objet : ce qui suit est un attribut.'}},
  {f:'casuum',an:'génitif|pluriel',d:'4e',lem:'casus, casus (m.)',fn:'complément de documentum',
   amb:{'nominatif|pluriel':'Le nominatif pluriel est <span class="lit">casus</span>. Le <span class="lit">-uum</span> n’appartient qu’au génitif pluriel, et il est le seul de sa forme dans toute la déclinaison.'}}]},

{id:'L3016',lat:'Gallias exercitibus diripiendas permittere',tr:'Permettre aux armées de piller les Gaules.',
 dis:['Permettre aux Gaules de piller les armées.','Livrer les armées au pillage des Gaules.'],
 grp:[['permittere','permettre'],['exercitibus','aux armées'],['diripiendas Gallias','de piller les Gaules']],
 notice:'<h5>Suétone, Néron</h5>Printemps 68, la Gaule s’est soulevée. Suétone énumère les projets que Néron « médita, monstrueux mais conformes à sa nature » : envoyer des assassins aux chefs d’armées, massacrer tous les Gaulois présents à Rome, <b>livrer les Gaules au pillage des armées</b>, empoisonner le Sénat entier au cours de banquets, incendier la ville après avoir lâché les fauves sur le peuple. Il y renonça, précise Suétone, <b>non par remords mais par désespoir de les mener à bien</b>.',
 notes:[['Le datif pluriel en -ibus','Le même qu’à la 3e — <span class="lit">operibus</span>, <span class="lit">itineribus</span> à l’unité précédente. Au pluriel, les deux déclinaisons cessent de se distinguer.'],
  ['Une phrase sans verbe conjugué','<span class="lit">Permittere</span> est un infinitif : Suétone rapporte au style indirect une liste de projets. Ne cherche pas de sujet, il n’y en a pas — c’est un article dans un inventaire de crimes envisagés.']],
 mots:[{f:'Gallias',an:'accusatif|pluriel',d:'1re',lem:'Gallia, ae (f.)',fn:'objet de diripiendas',
   amb:{'nominatif|pluriel':'Le nominatif pluriel de la 1re est en <span class="lit">-ae</span>.'}},
  {f:'exercitibus',an:'datif|pluriel',d:'4e',lem:'exercitus, exercitus (m.)',fn:'à qui l’on permet',
   amb:{'ablatif|pluriel':'La terminaison vaut pour les deux. Mais <span class="lit">permitto</span> permet quelque chose <b>à</b> quelqu’un : c’est un datif.'}}]},

{id:'L0012',lat:'A fluctibus opes',tr:'Les richesses viennent des flots.',
 dis:['Les flots viennent de la richesse.','La richesse est dans les flots.'],
 grp:[['opes','les richesses (viennent)'],['a fluctibus','des flots']],
 notice:'<h5>Devise de Sarzeau</h5>Commune du Morbihan, sur la presqu’île de Rhuys, entre le golfe et l’Atlantique. Son blason porte un vaisseau d’or sur champ de gueules — c’est lui qui explique la devise. La commune traduit elle-même « la richesse vient des flots » ; les répertoires disent « de la mer », moins exact, <span class="lit">fluctus</span> étant le flot, la vague, et non l’étendue d’eau.',
 notes:[['L’ablatif pluriel en -ibus','Identique au datif, comme partout. Ici c’est <span class="lit">a</span> qui décide : cette préposition ne peut être suivie que d’un ablatif.'],
  ['Une phrase sans verbe','Le latin des devises s’en passe volontiers. À toi de rétablir « viennent », que rien n’écrit.']],
 mots:[{f:'Opes',an:'nominatif|pluriel',d:'3e',lem:'ops, opis (f.)',fn:'sujet sous-entendu',
   amb:{'accusatif|pluriel':'Au pluriel de la 3e, <span class="lit">-es</span> vaut pour trois cas. Mais aucun verbe transitif n’est exprimé.'}},
  {f:'fluctibus',an:'ablatif|pluriel',d:'4e',lem:'fluctus, fluctus (m.)',fn:'après a',
   amb:{'datif|pluriel':'Même terminaison, comme dans <span class="lit">Gallias exercitibus</span>. Mais <span class="lit">a</span> impose l’ablatif — là c’était le verbe qui décidait, ici c’est la préposition.'}}]}
];

 notes:[['Le verbe est celui du jardinier','<span class="lit">Carpo</span>, c’est détacher, cueillir — on cueille une fleur avant qu’elle se fane. « Saisis le jour » force le geste : le latin est doux là où le français est brusque.'],

  ['<span class="lit">Dies</span> est masculin','Sauf quand il désigne une date fixée ou un délai, où il devient féminin. Tu verras le mot hésiter dans <span class="lit">Dies irae, dies illa</span>.']],

{id:'L0125',lat:'Ad perpetuam rei memoriam',tr:'En mémoire perpétuelle de la chose.',

{id:'L2635',lat:'Sufficit diei malitia sua',tr:'À chaque jour suffit sa peine.',

 notes:[['<span class="lit">Malitia</span> n’est pas la méchanceté','C’est la peine, le tourment, le mal qu’on subit. La traduction française reçue est donc exacte, alors qu’un calque sur le sens moderne induirait en erreur.'],

{id:'L3010',lat:'O spes fallaces et cogitationes inanes meae !',tr:'Ô mes espoirs trompeurs et mes pensées vaines !',

 notes:[['Deux vocatifs pluriels, deux déclinaisons','<span class="lit">Spes</span> est de la 5e, <span class="lit">cogitationes</span> de la 3e — et les deux sont coordonnés par <span class="lit">et</span>, donc au même cas. C’est la meilleure occasion du cours de voir la règle jouer sur deux déclinaisons à la fois.'],

{id:'L1274',lat:'In medias res',tr:'Au milieu des choses.',
 dis:['Par le milieu des choses.','Les choses du milieu.'],
 grp:[['in res','dans les choses'],['medias','moyennes']],
 notice:'<h5>Horace, Art poétique</h5>Horace loue Homère de ne pas commencer l’<i>Iliade</i> par les origines : <span class="lit">nec gemino bellum Trojanum orditur ab ovo</span>, il n’entame pas la guerre de Troie à partir de l’œuf jumeau — celui de Léda, d’où naquit Hélène. Puis : il court toujours au dénouement et emporte l’auditeur <b>au milieu des choses</b> comme si elles lui étaient déjà connues. Les deux formules sont voisines d’un vers, et le français a gardé les deux : commencer <i>ab ovo</i>, c’est remonter à l’origine ; commencer <i>in medias res</i>, c’est jeter le lecteur au milieu.',
 notes:[['Trois mots qui ne se coupent pas comme on croit','<span class="lit">In</span> régit <span class="lit">res</span>, et <span class="lit">medias</span> s’accorde à <span class="lit">res</span> : ce n’est pas « dans le milieu des choses » mais « dans les choses moyennes ».'],
  ['L’accusatif pluriel après <span class="lit">in</span>','<span class="lit">In</span> demande l’accusatif quand il y a mouvement vers, l’ablatif quand il y a repos. Ici on entre : accusatif.'],
  ['Le quatrième emprunt à la même œuvre','L’unité 4 y a pris <span class="lit">Adhuc sub judice lis est</span>, l’unité 5 <span class="lit">Laudator temporis acti</span>, et la formule <span class="lit">vos plaudite</span> y figure aussi. Quatre citations du cours sortent d’un poème de quatre cent soixante-seize vers.']],
 mots:[{f:'res',an:'accusatif|pluriel',d:'5e',lem:'res, rei (f.)',fn:'après in, mouvement',
   amb:{'nominatif|pluriel':'Même forme, comme toujours. Mais <span class="lit">in</span> ne peut être suivi que d’un accusatif ou d’un ablatif — jamais d’un nominatif.',
        'nominatif|singulier':'Même forme encore. Mais <span class="lit">medias</span> est un pluriel, et il s’accorde.'}}]},

{id:'L2645',lat:'Sunt lacrimae rerum',tr:'Il y a des larmes pour les choses.',
 dis:['Les choses sont des larmes.','Les larmes ont leurs raisons.'],
 grp:[['sunt','il y a'],['lacrimae','des larmes'],['rerum','pour les choses']],
 notice:'<h5>Virgile, Énéide I</h5>Énée vient d’échouer à Carthage. Dans le temple que Didon fait bâtir à Junon, il découvre des fresques : la guerre de Troie, Priam, Achille cruel aux deux camps. Il s’arrête, il pleure, et dit : <span class="lit">quis iam locus, quae regio in terris nostri non plena laboris ?</span> Puis vient notre vers, suivi de <span class="lit">et mentem mortalia tangunt</span>. <b>Ce qui le bouleverse, c’est que des étrangers aient peint son malheur</b> — donc qu’ils l’aient compris. Ce n’est pas seulement une plainte, c’est une consolation. Diderot voulait qu’on écrivît le vers sur la porte des ateliers de peintres.',
 notes:[['Un génitif qu’on ne sait pas trancher','<span class="lit">Rerum</span> peut être objectif — des larmes <b>pour</b> les choses, on pleure sur les malheurs du monde — ou subjectif — les larmes <b>des</b> choses, le monde lui-même pleure. La critique tient l’ambiguïté pour délibérée, et les traducteurs se partagent depuis deux mille ans.'],
  ['Attention au français','« Pour les choses » sonne comme un datif. Ce n’en est pas un : <span class="lit">rerum</span> est un <b>génitif pluriel</b>. C’est le même piège que la <span class="lit">belua multorum capitum</span> de l’unité 5 : le français disait « la bête <b>aux</b> nombreuses têtes », et c’était un génitif.'],
  ['Et <span class="lit">res</span> reste vague exprès','Traduire par « malheurs » ou « circonstances » trancherait à la place de Virgile. Le mot le plus imprécis du latin fait ici un chef-d’œuvre.']],

{id:'L0511',lat:'Cedit amor rebus',tr:'L’amour cède aux affaires.',

{id:'L2398',lat:'Rebus sic stantibus',tr:'Les choses demeurant en l’état.',

 notice:'<h5>Langue du droit</h5>Fragment d’une clause dont la forme complète est <span class="lit">conventio omnis intelligitur rebus sic stantibus</span> : toute convention s’entend les choses demeurant en l’état. Un engagement est pris dans des circonstances données, et ces circonstances font partie de l’engagement. Le principe est ancien — Polybe rapporte qu’en 211 avant notre ère on l’invoquait déjà — mais la formule est attribuée au juriste Scipione Gentili, mort en 1616. Le droit moderne l’a codifiée à l’article 62 de la Convention de Vienne sur le droit des traités. C’est l’exact contraire de <span class="lit">pacta sunt servanda</span>, et les deux maximes se disputent le droit des traités depuis quatre siècles.',
 notes:[['L’ablatif pluriel en -ebus','Même forme qu’au datif, comme dans <span class="lit">Cedit amor rebus</span>. Mais ici il n’y a pas de verbe qui commande : c’est un <b>ablatif absolu</b>, une construction où le nom et le participe forment à eux seuls une proposition.'],
  ['Deux phrases, une forme, deux cas','<span class="lit">Rebus</span> était datif chez Ovide parce que <span class="lit">cedo</span> l’exigeait ; il est ablatif ici parce que la construction l’impose. C’est la troisième fois que le cours te montre cela — après <span class="lit">pedibus</span> et <span class="lit">dentibus</span>, puis <span class="lit">operibus</span>.']],
 mots:[{f:'Rebus',an:'ablatif|pluriel',d:'5e',lem:'res, rei (f.)',fn:'ablatif absolu avec stantibus',

function casse(mot,modele){
 const maj=modele[0]===modele[0].toUpperCase()&&modele[0]!==modele[0].toLowerCase();

/* messages d'erreur de déclinaison, écrits par terminaison et non par mot */
function msgDecl(forme,bonne,choisie){
 const f=forme.toLowerCase();
 const L=t=>`<span class="lit">${t}</span>`;
 /* Le message explique pourquoi la terminaison ne peut pas appartenir
    à la déclinaison choisie. Il est écrit par terminaison, jamais par mot. */
 if(choisie==='3e'){
  if(/(ae|arum|as|am)$/.test(f))return `${L('-ae')}, ${L('-am')}, ${L('-as')}, ${L('-arum')} : ce sont les terminaisons de la 1re. La 3e n’en a aucune.`;
  if(/(us|um|os|orum)$/.test(f))return `${L('-us')}, ${L('-um')}, ${L('-os')}, ${L('-orum')} : ce sont les terminaisons de la 2e. La 3e fait son accusatif en ${L('-em')} et son génitif pluriel en ${L('-um')} ou ${L('-ium')}.`;
  if(/(a|o|i)$/.test(f))return `Cette terminaison appartient aux deux premières déclinaisons. Le radical le confirme : c’est le génitif en ${L('-is')} qui signale la 3e.`;
  return `Regarde le radical : la 3e se reconnaît à son génitif en ${L('-is')}, pas à cette terminaison.`;
 }
 if(bonne==='3e'){
  if(/ibus$/.test(f))return `La 1re et la 2e font leur datif-ablatif pluriel en ${L('-is')}, jamais en ${L('-ibus')}. Le ${L('-ibus')} est la marque de la 3e.`;
  if(/em$/.test(f))return `Ni la 1re ni la 2e n’ont d’accusatif en ${L('-em')} : la 1re a ${L('-am')}, la 2e ${L('-um')}.`;
  if(/ium$/.test(f))return `Le génitif pluriel est en ${L('-arum')} à la 1re et en ${L('-orum')} à la 2e. Le ${L('-ium')} n’appartient qu’à la 3e.`;
  if(/es$/.test(f))return `Aucune des deux premières déclinaisons n’a de forme en ${L('-es')}. Leurs pluriels sont en ${L('-ae')} et ${L('-as')}, ou en ${L('-i')} et ${L('-os')}.`;
  if(/is$/.test(f))return `${L('-is')} existe aux deux premières déclinaisons, mais seulement au datif-ablatif <b>pluriel</b>. Ici la forme est un singulier.`;
  if(/e$/.test(f))return `Le ${L('-e')} final n’est un vocatif qu’à la 2e, et seulement sur les noms en ${L('-us')}. Partout ailleurs, c’est l’ablatif singulier de la 3e.`;
  return `La 3e déclinaison n’a pas de nominatif type : c’est le génitif en ${L('-is')} qui la fait reconnaître, et lui seul.`;
 }
 if(bonne==='2e'){
  if(/a$/.test(f))return `Le ${L('-a')} de la 1re est un singulier ; celui du neutre de 2e est un pluriel. Les deux s’écrivent pareil — c’est au radical qu’on les sépare.`;
  if(/(us|um|e|os)$/.test(f))return `La 1re déclinaison n’a aucune forme de ce type. Son nominatif singulier est en ${L('-a')}, son accusatif en ${L('-am')}, son accusatif pluriel en ${L('-as')}.`;
  if(/orum$/.test(f))return `La 1re a ${L('-arum')}, la 2e ${L('-orum')} : seule la voyelle change.`;
  if(/i$/.test(f))return `Le ${L('-i')} n’existe pas à la 1re déclinaison. C’est le ${L('-ae')} qui y remplit les mêmes cases.`;
  if(/o$/.test(f))return `La 1re déclinaison n’a pas de ${L('-o')}. Son datif et son ablatif singuliers sont en ${L('-ae')} et en ${L('-a')}.`;
  if(/is$/.test(f))return `Les deux déclinaisons ont un datif-ablatif pluriel en ${L('-is')}. Regarde le reste du mot : le radical n’est pas celui d’un nom en ${L('-a')}.`;
 }
 if(/is$/.test(f))return `Les deux déclinaisons ont un datif-ablatif pluriel en ${L('-is')}. Regarde le reste du mot.`;
 return `La 2e déclinaison n’a aucune forme en ${L('-a')} au singulier. Son nominatif est en ${L('-us')}, son accusatif pluriel en ${L('-os')}.`;
}

 const fait={d:SANSDECL,c:false}; let livre=false;
 const check=()=>{if(fait.d&&fait.c&&!livre){livre=true;fin();}};
 const ouvrePanneau=()=>{panel.classList.add('open');
  const r=panel.getBoundingClientRect();
  if(r.right>window.innerWidth-8)panel.classList.add('right');
  /* Sur un écran étroit, un panneau ouvert sur une ligne basse déborde sous le pli :
     on fait remonter la ligne juste ce qu'il faut pour que le panneau tienne entier. */
  /* Recadrage vertical, pour le mobile : visualViewport donne la hauteur
     réellement visible, barre d'adresse déduite, là où innerHeight l'ignore.
     RESTE IMPARFAIT — la barre se redéploie parfois après le recadrage et masque
     de nouveau la dernière ligne du panneau. Une écoute du redimensionnement du
     viewport a été tentée le 2 septembre : sans effet observable, retirée. */
  setTimeout(()=>{
   const vv=window.visualViewport;
   const h=(vv&&vv.height)||window.innerHeight||600;
   const q=panel.getBoundingClientRect(), MARGE=28;
   if(q.bottom>h-MARGE){
    const d=Math.min(q.bottom-h+MARGE, row.getBoundingClientRect().top-12);
    if(d>0&&window.scrollBy)window.scrollBy({top:d,behavior:'smooth'});
   }},220);};
 const indice=()=>{hbox.innerHTML=QUESTION[cc];hbox.classList.remove('hidden');hb.classList.add('hidden');};
 hb.onclick=indice;
 /* Sans question de déclinaison, toutes les lignes seraient prêtes en même temps
    et tous les panneaux s'ouvriraient d'un coup. On n'ouvre que la première non faite. */
 if(SANSDECL)row.ouvrir=ouvrePanneau;
 row.querySelectorAll('.db').forEach(b=>b.onclick=()=>{
  if(b.dataset.d!==m.d){
   b.style.borderColor='var(--no)';rate(sub);
   setTimeout(()=>b.style.borderColor='',700);
   amb.innerHTML=`<div class="note r">${msgDecl(m.f,m.d,b.dataset.d)}</div>`;amb.classList.remove('hidden');
   return;}
  row.querySelectorAll('.db').forEach(x=>{x.disabled=true;if(x!==b)x.style.opacity=.22});
  b.classList.add('sel');amb.classList.add('hidden');
  fait.d=true;
  if(!fait.c)ouvrePanneau();   /* le menu s'ouvre de lui-même */
  check();});
 pb.onclick=()=>{if(panel.classList.contains('open'))panel.classList.remove('open');else ouvrePanneau();};
 panel.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{
  if(b.dataset.v!==m.an){
   b.style.outline='2px solid var(--no)';rate(sub);
   setTimeout(()=>b.style.outline='',700);
   amb.innerHTML=m.amb&&m.amb[b.dataset.v]
     ? `<div class="note r">${m.amb[b.dataset.v]}</div>`
     : `<div class="note r">Cette terminaison ne peut pas porter ce cas.</div>`;
   amb.classList.remove('hidden');
   /* Le panneau se referme : déployé, il masquait la moitié du message.
      Le bouton reste visible pour rouvrir et corriger. */
   setTimeout(()=>panel.classList.remove('open'),260);
   return;}
  panel.classList.remove('open');pb.classList.add('hidden');amb.classList.add('hidden');
  row.dataset.fait='1';
  tag.textContent=ABR[cc]+' '+ABRN[nn];
  tag.style.background=`var(${CAS[cc]})`;tag.style.color=FG(cc);tag.classList.remove('hidden');
  if(k>=0){const w=document.getElementById('w'+k);
   if(w){w.style.background=`var(${CAS[cc]})`;w.style.color=FG(cc);}}
  indice();
  det.innerHTML=`<b>${esc(m.lem)}</b> · ${cc} ${nn} — ${m.fn}`;
  det.classList.remove('hidden');
  fait.c=true;check();});}

/* ═══════════════ RECONNAÎTRE ═══════════════ */
/* Deux exercices sous un même nom, selon ce que les données portent.
   • entrées avec n:[[forme,déclinaison,note]] → trier les noms par déclinaison (unités 2 et suivantes)
   • entrées avec ok / c / n                   → repérer le nom au programme et donner son cas
   Le second est le seul possible tant qu'une seule déclinaison est connue. */
/* Deux mécaniques sous un même nom. Quand plusieurs déclinaisons sont connues,
   on trie chaque nom de la phrase (données : n:[[forme,décl,note]]). Quand une seule
   l'est, trier n'a pas de sens : on clique sur le mot qui en relève
   (données : ok, c, n, note). Le moteur choisit d'après la forme des données. */
function reconn(j){
 /* Attention : à l'unité 1, le champ n porte le NOMBRE (une chaîne).
    Le tri se reconnaît à ce que n est un tableau de noms à classer. */
 return Array.isArray(REC[j].n) ? reconnTri(j) : reconnCas(j); }

function reconnCas(j){
 const R=REC[j];
 eye.textContent=META.unite+' · reconnaître';st.textContent='';
 bar.innerHTML=REC.map((_,k)=>`<i class="${k<j?'done':k===j?'cur':''}"></i>`).join('');
 app.innerHTML=`<div class="card opt">
  <p class="grey" style="margin:0 0 14px">${esc(META.consigneRec||'Clique sur le mot de la 1re déclinaison.')}</p>
  <p class="latin">${R.lat.split(' ').map((w,k)=>
    `<span class="w" id="r${k}" style="cursor:pointer">${esc(w)}</span>`).join(' ')}</p>
  <div id="tail"></div></div>`+pied();
 R.lat.split(' ').forEach((w,k)=>{
  const el=document.getElementById('r'+k);
  el.onclick=()=>{
   if(net(w)!==R.ok){
    el.style.background='#2A1919';setTimeout(()=>el.style.background='',600);return;}
   el.style.background=`var(${CAS[R.c]})`;el.style.color=FG(R.c);
   document.querySelectorAll('.latin .w').forEach(x=>x.onclick=null);
   document.getElementById('tail').innerHTML=
    `<div class="note"><b>${esc(R.tr)}</b></div>
     <div class="note"><span class="lit">${esc(R.ok)}</span> — ${R.c} ${R.n}. ${R.note}</div>`
    +(R.lem?`<div class="note"><b>Au dictionnaire.</b> <span class="lit">${esc(R.ok)}</span> — <span class="lit">${esc(R.lem)}</span></div>`:'')
     +(R.src?`<div class="note g">${R.src}</div>`:'');
   suivant(j+1<REC.length?'Suivant':'Retour').onclick=()=>{
    if(j+1<REC.length)reconn(j+1);else{bonus[1]=1;finRec();}};};});}

function reconnTri(j){
 const R=REC[j];let faits=0;
 const cibles={};R.n.forEach((x,i)=>{cibles[i]=x;});
 eye.textContent=META.unite+' · reconnaître';st.textContent='';
 bar.innerHTML=REC.map((_,k)=>`<i class="${k<j?'done':k===j?'cur':''}"></i>`).join('');
 const mots=R.lat.split(' ');
 /* on associe chaque cible à sa position dans la phrase, doublons compris */
 let used=[];
 const pos=R.n.map(x=>{
  const i=mots.findIndex((w,idx)=>net(w)===x[0]&&!used.includes(idx));
  used.push(i);return i;});
 app.innerHTML=`<div class="card opt">
  <p class="grey" style="margin:0 0 14px">Clique sur chaque nom, et dis à quelle déclinaison il appartient.</p>
  <p class="latin">${mots.map((w,k)=>
    `<span class="w" id="n${k}"${pos.includes(k)?' style="cursor:pointer;border-bottom:1px dotted var(--mute)"':''}>${esc(w)}</span>`).join(' ')}</p>
  <div id="tail"></div></div>`+pied();
 pos.forEach((k,i)=>{
  const el=document.getElementById('n'+k);
  el.onclick=()=>{
   if(el.dataset.done||document.querySelector('.dpanel'))return;
   const box=document.createElement('span');box.className='dpanel';
   box.innerHTML=DECL.map(d=>`<button class="db" data-d="${d}">${d}</button>`).join('');
   el.after(box);
   box.querySelectorAll('.db').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    if(b.dataset.d!==cibles[i][1]){
     b.style.borderColor='var(--no)';setTimeout(()=>b.style.borderColor='',600);return;}
    box.remove();el.dataset.done=1;el.style.borderBottom='';el.style.cursor='default';
    const t=document.createElement('span');t.className='dtag';
    t.textContent=cibles[i][1]==='une autre'?(cibles[i][2]||'autre'):cibles[i][1];
    el.after(t);
    if(++faits===R.n.length){
     /* Récapitulatif des lemmes : c'est le génitif qui justifie chaque réponse,
        et l'étudiant ne l'a pas sous les yeux pendant qu'il trie. */
     const lem=R.n.filter(x=>x[3]).map(x=>
       `<span class="lit">${esc(x[0])}</span> — <span class="lit">${esc(x[3])}</span>, ${x[1]==='une autre'?(x[2]||'autre'):x[1]}`);
     document.getElementById('tail').innerHTML=
      `<div class="note"><b>${esc(R.tr)}</b></div>`
      +(lem.length?`<div class="note"><b>Au dictionnaire.</b><br>${lem.join('<br>')}</div>`:'')
      +(R.n.some(x=>x[1]==='une autre')
        ? `<div class="note g">Les déclinaisons que tu ne connais pas encore viendront : ${
            R.n.filter(x=>x[1]==='une autre').map(x=>`<span class="lit">${esc(x[0])}</span>, ${x[2]}`).join(' · ')}.</div>`
        : '')
      +(R.src?`<div class="note g">${R.src}</div>`:'');
     suivant(j+1<REC.length?'Suivant':'Retour').onclick=()=>{
      if(j+1<REC.length)reconn(j+1);else{bonus[1]=1;finRec();}};}});};});}

const SEUIL=2;
let CARD=null;
function cartesChoix(){
 eye.textContent=META.unite+' · cartes';st.textContent='';bar.innerHTML='';
 const N=D.length;
 const opts=[5,10,20,30].filter(x=>x<N);opts.push(N);

  <p class="grey" style="margin:0 0 16px">Elles sont tirées au sort parmi les ${N} citations de l’unité.</p>
  <div class="forms" id="f"></div></div>`+pied();
 const box=document.getElementById('f');
 opts.forEach(x=>{
  const b=document.createElement('button');b.className='fb sm';
  b.style.minWidth='120px';b.style.textAlign='center';
  b.textContent=x===N?`Toutes (${N})`:`${x} cartes`;
  b.onclick=()=>{CARD=mix(D.map((d,i)=>({i:i,niv:0}))).slice(0,x);cartes();};
  box.appendChild(b);});
 document.getElementById('foot').innerHTML='<button class="ghost" id="rt">Retour au sommaire</button>';
 document.getElementById('rt').onclick=menu;}

function cartes(){
 if(!CARD)return cartesChoix();
 eye.textContent=META.unite+' · cartes';st.textContent='';
 const q=CARD.filter(c=>c.niv<SEUIL);
 if(!q.length){bonus[2]=1;bar.innerHTML='';
  app.innerHTML=`<div class="card opt">
   <p style="font:600 21px/1.3 'EB Garamond',serif;margin:0">
   ${CARD.length} citation${CARD.length>1?'s':''} sue${CARD.length>1?'s':''}, dans les deux sens.</p>
   <p class="grey" style="margin-top:8px">Rien n’est conservé d’une séance à l’autre :
   au prochain passage, le tirage recommencera.</p></div>
   <div class="foot" id="foot"><button class="ghost" id="rj">Autres cartes</button></div>`;
  document.getElementById('rj').onclick=()=>{CARD=null;cartesChoix();};
  suivant('Retour').onclick=menu;return;}
 const c=q[0], d=D[c.i], envers=c.niv>=1;
 const sues=CARD.filter(x=>x.niv>=SEUIL).length;
 bar.innerHTML=CARD.map(x=>`<i class="${x.niv>=SEUIL?'done':x===c?'cur':''}"></i>`).join('');
 app.innerHTML=`<div class="card opt">
  <div class="step">${envers?'Français → latin':'Latin → français'} · ${sues} / ${CARD.length} sues</div>
  <div class="face${envers?' fr':''}">${esc(envers?d.tr:d.lat)}</div>
  <div id="back"></div></div>`+pied();
 suivant('Retourner').onclick=()=>{
  document.getElementById('back').innerHTML=
   `<div class="face${envers?'':' fr'}" style="border-top:1px solid var(--line);min-height:0">
    ${esc(envers?d.lat:d.tr)}</div>
    <div class="srs">
     <button class="srsb" data-v="2">Je sais</button>
     <button class="srsb" data-v="1">À moitié</button>
     <button class="srsb" data-v="0">À revoir</button></div>`;
  document.getElementById('foot').innerHTML='<span></span>';
  document.querySelectorAll('.srsb').forEach(b=>b.onclick=()=>{
   const v=+b.dataset.v;
   CARD=CARD.filter(x=>x!==c);
   if(v===2){c.niv++;CARD.splice(Math.min(CARD.length,9),0,c);}
   else if(v===1){CARD.splice(Math.min(CARD.length,6),0,c);}
   else{c.niv=0;CARD.splice(Math.min(CARD.length,2),0,c);}
   cartes();});};}

/* ═══ lecture facilitée ═══
   Mémorisé d'une session à l'autre. localStorage n'est pas garanti sur file://
   selon le navigateur : on l'entoure d'un try/catch et on retombe en mémoire,
   auquel cas le réglage tient le temps de la session et rien ne casse. */
let FACILE=false;
const MEM=(()=>{try{const k='latin.facile';localStorage.setItem(k,localStorage.getItem(k)||'');
 return{lire:()=>localStorage.getItem(k)==='1',ecrire:v=>localStorage.setItem(k,v?'1':'0')};}
 catch(e){let m=false;return{lire:()=>m,ecrire:v=>{m=v;}};}})();
function appliquerLisibilite(v){
 FACILE=v; document.body.classList.toggle('facile',v);
 const b=document.getElementById('lisi');
 if(b){b.setAttribute('aria-pressed',v?'true':'false');
       b.textContent=v?'Lecture normale':'Lecture facilitée';}
 MEM.ecrire(v);
}
(function(){
 const b=document.getElementById('lisi');
 if(b)b.onclick=()=>appliquerLisibilite(!FACILE);
 appliquerLisibilite(MEM.lire());
})();

/* ═══════════════ SOMMAIRE GÉNÉRAL ═══════════════
   La version distribuée réunit les sept unités. Charger une unité consiste à
   remplacer les données que le moteur consomme, puis à réinitialiser son état. */
const PROGRES={};
let UNITE=null;

function chargerUnite(n){
 const U=CATALOGUE[n];
 META=U.META; NOTE_PARAD=U.NOTE_PARAD; DECL=U.DECL; REVIS=U.REVIS; D=U.D;
 COMPL=U.COMPL; INTRUS=U.INTRUS; DICO=U.DICO; PREREMPLI=U.PREREMPLI;
 PARAD=U.PARAD; FAM=U.FAM; REC=U.REC; SOURCES=U.SOURCES;
 /* EXOS et ACTIFS ont été construits sur les données de la première unité :
    on recalcule ce qui en dépend. */
 ACTIFS.length=0; EXOS.forEach(e=>{if(e.len()>0)ACTIFS.push(e);});
 /* La progression de chaque unité est gardée le temps de la session : passer par
    le sommaire et revenir ne doit pas tout reverrouiller. */
 if(!PROGRES[n])PROGRES[n]={fini:EXOS.map(e=>e.len()>0?0:1),bonus:[0,0,0],pose:{}};
 UNITE=n;
 fini=PROGRES[n].fini; bonus=PROGRES[n].bonus; POSE=PROGRES[n].pose;
 S=null; RATES=new Set();
 document.getElementById('tt').textContent=META.h1;
 document.getElementById('st').innerHTML=META.sous;
 document.title=META.titre;
 menu();
 const b=document.createElement('button');
 b.className='retour'; b.textContent='Sommaire'; b.onclick=accueil;
 const h=document.querySelector('header');
 const vieux=h.querySelector('.retour'); if(vieux)vieux.remove();
 h.appendChild(b);
}

function accueil(){
 const h=document.querySelector('header');
 const v=h.querySelector('.retour'); if(v)v.remove();
 document.getElementById('eye').textContent='';
 document.getElementById('tt').textContent='Le latin par les locutions';
 document.getElementById('st').innerHTML='les cinq déclinaisons';
 document.title='Le latin par les locutions — les cinq déclinaisons';
 bar.innerHTML='';
 app.innerHTML='<div class="accueil">'
  +'<p class="ms" style="margin:0 0 14px;color:var(--ui)">Version en cours de développement</p>'
  +'<p class="grey" style="margin:0 0 16px">'
  +'Sept unités, à faire dans l’ordre. Chacune s’ouvre sur une révision de la précédente.</p>'
  +Object.keys(CATALOGUE).map(n=>{const M=CATALOGUE[n].META;
    return `<button class="uni" data-u="${n}"><span class="n">${esc(M.unite)}</span>`
      +`<span class="t">${esc(M.h1)}</span><span class="s">${M.sous}</span></button>`;}).join('')
  +'</div>';
 document.querySelectorAll('.uni').forEach(b=>b.onclick=()=>chargerUnite(+b.dataset.u));
}

/* Le bouton de fin d'unité mène à la suivante quand elle existe. */
const bilanOrigine=bilan;
bilan=function(){
 bilanOrigine();
 const g=document.querySelector('.foot .go[disabled]');
 if(!g)return;
 const n=Object.keys(CATALOGUE).map(Number).find(k=>CATALOGUE[k].META.unite===META.suivante);
 if(n){g.disabled=false;g.onclick=()=>chargerUnite(n);}
};

accueil();

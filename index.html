<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Le latin par les locutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#121517;--card:#1B1F21;--ink:#E8EAE9;--mute:#97A1A2;--line:#2E3436;--line2:#3C4446;
 --accent:#7FA3D1;--ok:#4CAF82;--no:#E06C6C;--gold:#C9A24A;
 --nom:#56B4E9;--voc:#CC79A7;--acc:#D55E00;--gen:#009E73;--dat:#F0E442;--abl:#F2F2F2;
 --ui:#E69F00;
 --on:#101314;--on-acc:#FFFFFF;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font:400 16px/1.55 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:22px 18px 100px}
header{margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:13px}
.eyebrow{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font:600 28px/1.15 "EB Garamond",Georgia,serif;margin:8px 0 4px;color:var(--ink)}
.sub{color:var(--mute);font-size:14px}
.bar{display:flex;gap:3px;margin-top:12px;min-height:3px}
.bar i{height:3px;flex:1;background:var(--line);border-radius:2px;transition:background .3s}
.bar i.done{background:var(--accent)}.bar i.cur{background:var(--ui)}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:22px 20px;margin-bottom:14px}
.card.opt{border-left:3px solid var(--gold)}
.step{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;
 color:var(--mute);margin-bottom:16px}
.step em{color:var(--ui);font-style:normal}.step b{color:var(--gold);font-weight:500}
.latin{font:400 27px/1.4 "EB Garamond",Georgia,serif;margin:0 0 18px;color:var(--ink)}
.latin .w{padding:1px 4px;border-radius:3px;transition:background .3s,color .3s}
.latin .gap{border-bottom:2px solid var(--ui);padding:0 24px;color:var(--ui)}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt-b{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line2);
 border-radius:4px;padding:12px 15px;margin-bottom:8px;font-size:15px;transition:.15s}
.opt-b:hover:not(:disabled){border-color:var(--accent)}.opt-b:disabled{cursor:default}
.opt-b.good{border-color:var(--ok);background:#16281F;color:var(--ok);font-weight:500}
.opt-b.bad{border-color:var(--no);background:#2A1919;color:var(--no);text-decoration:line-through}
.pair{display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px dotted var(--line)}
.pair:last-child{border:0}
.pl{font:400 20px/1.3 "EB Garamond",serif;min-width:180px}
.pr{color:var(--mute);font-size:15px}.pr.set{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{background:transparent;border:1px solid var(--line2);border-radius:15px;padding:7px 14px;font-size:14px}
.chip:hover:not(:disabled){border-color:var(--accent)}.chip:disabled{opacity:.22;cursor:default}
.forms{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}
.fb{border:1px solid var(--line2);background:transparent;border-radius:4px;padding:9px 17px;
 font:400 21px "EB Garamond",serif}
.fb.sm{font:400 15px "IBM Plex Sans",sans-serif;text-align:left;line-height:1.35}
.fb:hover:not(:disabled){border-color:var(--accent)}.fb:disabled{cursor:default}
.fb.good{border-color:var(--ok);background:#16281F}.fb.bad{border-color:var(--no);opacity:.35}
.arow{display:flex;gap:9px;align-items:center;padding:11px 0;flex-wrap:wrap;border-bottom:1px dotted var(--line)}
.arow:last-child{border:0}
.aw{font:600 21px/1 "EB Garamond",serif;min-width:104px}
.pick{position:relative}
.pb{border:1px solid var(--line2);background:transparent;border-radius:4px;padding:7px 13px;
 font-size:14px;color:var(--mute)}
.pb:hover{border-color:var(--accent);color:var(--ink)}
/* inactif tant que la déclinaison n'est pas trouvée : visible, grisé, sans survol */
.pb:disabled{opacity:.38;cursor:default}
.pb:disabled:hover{border-color:var(--line2);color:var(--mute)}
.panel{position:absolute;z-index:30;top:calc(100% + 5px);left:0;display:none;gap:10px;
 background:var(--card);border:1px solid var(--accent);border-radius:5px;padding:11px;
 box-shadow:0 8px 26px rgba(0,0,0,.55)}
.panel.open{display:flex}
.panel.right{left:auto;right:0}
.col{flex:1 1 0;min-width:104px}
.col h4{font:500 10px/1.2 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;
 color:var(--mute);margin:0 0 8px;text-align:center;white-space:nowrap;overflow:visible}
.cb{display:block;width:100%;text-align:center;border:0;border-radius:3px;padding:9px 6px;margin-bottom:4px;
 font:500 13px "IBM Plex Mono",monospace;white-space:nowrap}
.cb:hover{outline:2px solid var(--ink);outline-offset:1px}
.tag{font:500 11px/1 "IBM Plex Mono",monospace;padding:5px 8px;border-radius:3px}
.detail{flex-basis:100%;font-size:13.5px;color:var(--mute);padding-left:2px}
.detail b{color:var(--ink);font-weight:500}
.hint{border:1px dashed var(--line2);background:transparent;border-radius:4px;padding:6px 11px;
 font-size:13px;color:var(--mute)}
.hint:hover{border-color:var(--gold);color:var(--gold)}
.hintbox{flex-basis:100%;font:400 16px "EB Garamond",serif;color:var(--gold);padding-left:2px}
.grey{color:var(--mute);font-size:13px;font-style:italic}
.note{background:#20262A;border-left:2px solid var(--accent);padding:11px 14px;margin-top:14px;
 font-size:14.5px;color:#BDC6C7;border-radius:0 3px 3px 0}
.note+.note{margin-top:8px}
.note.g{border-color:var(--gold);background:#262117}
.note.r{border-color:var(--no);background:#261A1A}
.note b{color:var(--ink);font-weight:500}
/* Tableau des terminaisons, dans la note de clôture du paradigme.
   Le tiret y marque une case SANS terminaison — non une case vide. */
.term{display:grid;grid-template-columns:auto 1fr 1fr;gap:2px 14px;margin:10px 0 8px;
 font:500 13px/1.7 "IBM Plex Mono",monospace}
.term i{color:var(--mute);font-style:normal;font-size:10px;letter-spacing:.09em;
 text-transform:uppercase}
.term u{text-decoration:none;color:var(--ink)}
.term s{text-decoration:none;color:var(--mute)}
/* Marque des formes verbales — cercles vides au singulier, pleins au pluriel,
   le compte disant la personne. Jamais de couleur : elle est aux déclinaisons. */
.mq{font:400 10px/1 monospace;letter-spacing:2px;color:var(--ink);vertical-align:middle}
.mq.dim{opacity:.28}

/* grille du paradigme à trois colonnes (unité 10) : une colonne par conjugaison.
   .auto = la terminaison nue, portée automatiquement dans les cases que les trois
   conjugaisons partagent. .dico = les temps primitifs, sans quoi le rangement des
   deux lignes qui distinguent serait indevinable. */
table.par.trois td{width:28%}
table.par.trois td.lab{width:16%}
table.par.trois .cellb{font-size:16px}
.cellb.auto{color:var(--mute);font:400 14px "IBM Plex Mono",monospace;cursor:default}
.dico{font:500 12px "IBM Plex Mono",monospace;color:var(--mute);margin:2px 0 16px}
/* la même entrée, mais sous le mot d’une ligne d’analyse : elle y est plus serrée */
.dico.dsous{display:block;font-size:11.5px;margin:3px 0 7px}
.term4{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:2px 14px;margin:10px 0 8px;
 font:500 13px/1.7 "IBM Plex Mono",monospace}
.term4 i{color:var(--mute);font-style:normal;font-size:10px;letter-spacing:.09em;text-transform:uppercase}
.term4 u{text-decoration:none;color:var(--ink)}
.term4 s{text-decoration:none;color:var(--mute)}
.term4 b{color:var(--ui);font-weight:500}
/* la marque est positionnée sous le mot SANS entrer dans le flux : le mot ne bouge
   pas, la ligne ne bouge pas. Une première version en display:block faisait remonter
   le mot d'une ligne. */
.latin .w{position:relative}
.mq.sous{position:absolute;left:0;right:0;top:100%;margin-top:-4px;text-align:center;
 letter-spacing:3px;font-size:10px;line-height:1;pointer-events:none}
.note h5{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;
 color:var(--gold);margin:13px 0 5px}
.note h5:first-child{margin-top:0}
.lit{font-family:"EB Garamond",serif;font-style:italic;font-size:17px;color:var(--ink)}
.flag{color:var(--gold);font:500 11px "IBM Plex Mono",monospace;cursor:help;border-bottom:1px dotted var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.lg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mute)}
.sw{width:11px;height:11px;border-radius:2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;
 color:var(--mute);flex-wrap:wrap}
.go{background:var(--accent);color:#0F1418;border:0;border-radius:4px;padding:11px 22px;
 font-size:15px;font-weight:600;margin-left:auto}
.go:hover{filter:brightness(1.1)}
.ghost{background:transparent;border:0;color:var(--mute);font-size:14px;text-decoration:underline}
.menu{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
 border-left:3px solid var(--line2);border-radius:4px;padding:14px 17px;margin-bottom:8px;transition:.15s}
.menu:hover:not(:disabled){border-color:var(--accent);border-left-color:var(--accent)}
.menu:disabled{cursor:default;opacity:.4}
.menu.opt{border-left-color:var(--gold)}.menu.ok{border-left-color:var(--ok)}
.mt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mn{font:500 15px "IBM Plex Sans",sans-serif}
.ms{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.ms.ok{color:var(--ok)}
.md{font-size:13px;color:var(--mute);margin-top:3px}
.hgroup{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;
 color:var(--mute);margin:20px 0 9px}
table.par{width:100%;border-collapse:collapse;margin-top:4px}
table.par th{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;
 color:var(--mute);padding:0 0 7px;text-align:center;font-weight:500}
table.par td{border:1px solid var(--line);padding:0;height:52px;width:42%;vertical-align:middle}
table.par td.lab{border:0;width:16%;font:500 12px "IBM Plex Mono",monospace;color:var(--mute);
 padding-right:8px;text-align:right}
.cellb{width:100%;height:100%;min-height:52px;background:transparent;border:0;border-radius:0;
 padding:4px 3px;font:400 19px "EB Garamond",serif;line-height:1.1}
.cellb:hover:not(:disabled){background:#242A2D}
.cellb:disabled{cursor:default}
.cellb .cit{display:block;font:400 10.5px "IBM Plex Sans",sans-serif;color:var(--mute);
 margin-top:2px;line-height:1.25}
.fam{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:6px;font-size:15px}
.dpanel{display:inline-flex;gap:5px;margin-left:7px;vertical-align:middle}
.dpanel .db{font:500 12px "IBM Plex Mono",monospace;padding:5px 8px}
.dtag{font:500 11px "IBM Plex Mono",monospace;color:var(--mute);margin-left:6px;
 border:1px solid var(--line2);border-radius:3px;padding:2px 6px;vertical-align:middle}
.dgroup{display:inline-flex;gap:6px}
.cellb.pre{color:var(--mute);font-style:italic}
.hidden{display:none}
.srs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.srsb{flex:1 1 0;min-width:96px;border:1px solid var(--line2);background:transparent;border-radius:4px;
 padding:11px 8px;font-size:14px}
.srsb:hover{border-color:var(--accent)}
.face{font:400 26px/1.35 "EB Garamond",serif;text-align:center;padding:26px 8px;min-height:120px;
 display:flex;align-items:center;justify-content:center}
.face.fr{font-size:20px;font-family:"IBM Plex Sans",sans-serif}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:560px){
 .pl{min-width:0}.pair{flex-direction:column;gap:2px}
 .latin{font-size:23px}
 .panel{gap:8px;padding:9px;left:0;right:0;width:auto}
 .cb{font-size:13px;padding:10px 4px}
 .col{min-width:0}
 .aw{min-width:88px;font-size:19px}
 table.par td{height:48px}.cellb{font-size:17px;min-height:48px}
}

/* ═══ mode lecture facilitée ═══
   Réglages validés par Rello & Baeza-Yates : corps 18-26px, espacement des
   caractères 0,07-0,14em, caractères romains. L'italique de .lit disparaît :
   c'est la seule condition que l'étude désigne comme franchement nuisible. */
body.facile{font-size:19px;line-height:1.7;letter-spacing:.055em}
body.facile .lit{font-style:normal;font-size:21px;letter-spacing:.06em}
body.facile .pre{font-style:normal}
body.facile .grey{font-style:normal;font-size:16px;letter-spacing:.055em}
body.facile .note{font-size:17px;line-height:1.7}
body.facile i{font-style:normal;border-bottom:1px dotted var(--mute)}
body.facile [style*="justify"],body.facile .just{text-align:left!important}
body.facile .opt,body.facile .cho{font-size:17px}
.lisi{position:absolute;top:0;right:0;background:none;border:1px solid var(--line);
 color:var(--mute);border-radius:3px;padding:5px 9px;cursor:pointer;
 font:500 9px/1.4 "IBM Plex Mono",monospace;letter-spacing:.09em;text-transform:uppercase}
.lisi:hover{color:var(--ink);border-color:var(--mute)}
.lisi[aria-pressed="true"]{color:#121517;background:var(--ui);border-color:var(--ui)}
header{position:relative}

/* ─── Revoir les notices ─── le panneau est une couche au-dessus de #app, jamais
   un remplacement : l'écran courant et la réponse en cours restent intacts. */
.jrn{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;
 background:var(--card);color:var(--mute);border:1px solid var(--line);border-radius:999px;
 padding:9px 15px;font-size:13px;cursor:pointer}
.jrn:hover{border-color:var(--gold);color:var(--ink)}
#revoir{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.revoir-fond{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.revoir-boite{position:relative;width:min(720px,100%);max-height:82vh;display:flex;flex-direction:column;
 background:var(--bg);border:1px solid var(--line);border-radius:10px 10px 0 0;overflow:hidden}
.revoir-tete{display:flex;justify-content:space-between;align-items:center;gap:12px;
 padding:14px 18px;border-bottom:1px solid var(--line);color:var(--ink);font-size:15px}
.revoir-corps{overflow-y:auto;padding:4px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.revoir-item{padding:14px 0;border-bottom:1px solid var(--line)}
.revoir-item:last-child{border-bottom:0}
.revoir-item .step{margin-bottom:2px}
/* Les écrans d'intrus n'ont pas de citation : leur question titre l'entrée, et
   la petite capitale du .step la rendrait criarde sur deux lignes. */
.revoir-item .step .q{text-transform:none;letter-spacing:0;font-size:12.5px}

/* ═══ sommaire général — écran d'accueil de la version distribuée ═══ */
.accueil{margin:0}
.uni{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);
 border:1px solid var(--line);border-radius:4px;padding:15px 17px;margin-bottom:9px;
 cursor:pointer;font:inherit;transition:border-color .15s}
.uni:hover{border-color:var(--mute)}
.uni .n{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;
 color:var(--gold);display:block;margin-bottom:5px}
.uni .t{font:500 17px/1.3 "IBM Plex Sans";display:block}
.uni .s{font-family:"EB Garamond",serif;font-size:16px;color:var(--mute);display:block;margin-top:3px}
.retour{background:none;border:1px solid var(--line);color:var(--mute);border-radius:3px;
 padding:5px 9px;cursor:pointer;font:500 9px/1.4 "IBM Plex Mono",monospace;
 letter-spacing:.09em;text-transform:uppercase;position:absolute;top:0;left:0}
.retour:hover{color:var(--ink);border-color:var(--mute)}
header{position:relative;padding-top:26px}
</style></head><body>
<div class="wrap">
<header>
 <button class="lisi" id="lisi" type="button" aria-pressed="false"
  title="Corps plus grand, lettres plus espacées, caractères romains">Lecture facilitée</button>
 <div class="eyebrow" id="eye"></div>
 <h1 id="tt">Le latin par les locutions</h1>
 <div class="sub" id="st">déclinaisons et conjugaisons</div>
 <div class="bar" id="bar"></div>
</header>
<div id="app"><noscript><div class="note g" style="margin-top:20px">
<b>Cette application a besoin de JavaScript.</b> Le programme dans lequel vous l’avez ouverte
ne l’exécute pas — c’est le cas de la plupart des « visionneuses » et des aperçus de pièces
jointes. Ouvrez le fichier dans un vrai navigateur : Chrome, Firefox ou Safari.
</div></noscript></div></div>
<script>
/* ═══ catalogue des unités ═══ */
const CATALOGUE={};
var META,NOTE_PARAD,DECL,REVIS,D,COMPL,INTRUS,DICO,PREREMPLI,PARAD,FAM,REC,SOURCES;
CATALOGUE[1]=(function(){
/* ═══════════════ IDENTITÉ DE L'UNITÉ ═══════════════
   Tout ce qui distingue cette unité d'une autre. Le moteur n'en sait rien d'autre. */
const META={
 unite:'Unité 1',
 titre:'Unité 1 — la 1re déclinaison',
 h1:'La première déclinaison',
 sous:'<i>vita, vitae</i> — féminin',
 decl:['1re'],   /* une seule : le moteur ne pose pas la question */
 consigneRec:'Clique sur le mot de la 1re déclinaison.',
 notePre:'',
 suivante:'Unité 2',
 bilan:{
  titre:'La première déclinaison est vue.',
  notes:[
   '<b>Douze cases, onze citations.</b> Le nominatif, le vocatif, l’accusatif, le génitif, le datif et l’ablatif de <span class="lit">vita</span> ont tous été rencontrés dans une phrase réelle, au singulier et au pluriel.',
   '<b>Six terminaisons pour douze cases.</b> C’est le fait marquant de cette déclinaison, et il vaut pour toutes les autres : une forme latine porte souvent plusieurs valeurs. C’est le contexte qui permet de trancher, pas la forme seule.',
  ],
  suite:'La deuxième déclinaison, celle de <span class="lit">dominus</span> et de <span class="lit">bellum</span> — deux genres au lieu d’un, et le premier neutre.'
 },
 finRec:[
  [0,'<b>Un mot, cinq cas.</b> <span class="lit">vita</span> au nominatif, <span class="lit">vitam</span> à l’accusatif, <span class="lit">vitae</span> au génitif — deux fois — et la série entière n’a montré qu’un seul pluriel, <span class="lit">tegulis</span>. Le singulier suffit à remplir presque tout.'],
  [0,'<b>Le génitif se cache dans le français.</b> <i>Curriculum vitae</i>, <i>Dies irae</i> : deux formules que tu emploies ou entends sans y voir un cas latin. C’est la même terminaison <span class="lit">-ae</span> qui, ailleurs, fait un nominatif pluriel.'],
  [0,'<b>La préposition tranche.</b> <span class="lit">poena</span>, <span class="lit">cauda</span>, <span class="lit">tegulis</span> : chaque fois, c’est le petit mot qui impose l’ablatif, non la terminaison. Retiens les prépositions, tu tiendras les cas.'],
  [1,'<b>Dix-sept phrases, un seul mot à trouver.</b> Tu n’as pas encore de quoi trier : il n’y a qu’une déclinaison à ton programme. À l’unité suivante, la question deviendra <i>laquelle ?</i>'],
 ],
 bonus:[['Reconnaître','Dix-sept phrases que tu n’as pas vues. Une seule chose à y trouver.',1],
        ['Famille de mots','Les six mots de l’unité et leurs descendants français.',0],
        ['Cartes','Revoir les onze citations, dans les deux sens.',2]]
};

const NOTE_PARAD=`<b>Six terminaisons pour douze cases.</b> <span class="lit">-a</span> en remplit trois, <span class="lit">-ae</span> en remplit quatre, <span class="lit">-is</span> deux. Seules <span class="lit">-am</span>, <span class="lit">-as</span> et <span class="lit">-arum</span> désignent un cas et un seul. C’est pourquoi on n’analyse jamais un mot latin isolément.`;

const DECL=[];   /* absent de cette unité */
const PREREMPLI=[];   /* absent de cette unité */
const REVIS=[];   /* absent de cette unité */

/* ═══════════════ LES ONZE CITATIONS ═══════════════
   Ordre du paradigme. Traductions et sources : voir le corpus.
   Seules L1875, L2561 et L3048 portent une notice documentée.     */
const D=[
{id:'L1167',lat:'Historia magistra vitae',tr:'L’Histoire est maîtresse de la vie.',
 dis:['La vie est la maîtresse de l’Histoire.','L’Histoire de la vie est une maîtresse.'],
 grp:[['historia','L’Histoire'],['magistra','(est) maîtresse'],['vitae','de la vie']],
 notes:[['Le sujet : nominatif','<span class="lit">Historia</span> est ce dont on parle, ce qui fait l’action ou porte l’état. En latin, le sujet se met au <b>nominatif</b>. <span class="lit">Magistra</span> dit ce qu’est l’Histoire : c’est l’attribut du sujet, et il se met au même cas que lui.'],
  ['Le complément du nom : génitif','<span class="lit">vitae</span> répond à la question <b>de qui ? de quoi ?</b> Maîtresse de quoi ? De la vie. Le français ajoute le mot « de » ; le latin, lui, change la fin du mot. C’est cela, décliner.']],
 mots:[
  {f:'Historia',an:'nominatif|singulier',lem:'historia, ae (f.)',fn:'sujet',
   amb:{'vocatif|singulier':'La terminaison <span class="lit">-a</span> peut en effet porter un vocatif. Mais personne ne s’adresse ici à l’Histoire : on parle d’elle.',
        'ablatif|singulier':'La terminaison <span class="lit">-a</span> peut en effet porter un ablatif. Mais le mot n’est commandé par aucune préposition et n’indique aucune circonstance : il est ce dont on parle.'}},
  {f:'magistra',an:'nominatif|singulier',lem:'magistra, ae (f.)',fn:'attribut du sujet',
   amb:{'vocatif|singulier':'Même terminaison, mais aucune apostrophe ici.',
        'ablatif|singulier':'Le mot dit ce qu’<b>est</b> l’Histoire : il s’accorde au sujet, il ne marque pas une circonstance.'}},
  {f:'vitae',an:'génitif|singulier',lem:'vita, ae (f.)',fn:'complément du nom',
   amb:{'datif|singulier':'La terminaison <span class="lit">-ae</span> vaut aussi pour le datif — c’est l’ambiguïté centrale de cette déclinaison. Mais ici le mot complète <span class="lit">magistra</span> : maîtresse <b>de</b> quoi ? C’est le contexte qui permet de trancher, pas la forme seule.',
        'nominatif|pluriel':'La terminaison <span class="lit">-ae</span> vaut aussi pour le nominatif pluriel. Mais la phrase a déjà son sujet, <span class="lit">Historia</span>.',
        'vocatif|pluriel':'Même terminaison, mais aucune apostrophe ici.'}}]},

{id:'L1950',lat:'O vita misero longa, felici brevis !',tr:'Ô vie, longue pour le malheureux, brève pour l’heureux !',
 dis:['Ô longue vie du malheureux, brève vie de l’heureux !','Ô malheureux à la vie longue, heureux à la vie brève !'],
 grp:[['o vita','ô vie'],['longa','longue'],['misero','pour le malheureux'],['brevis','brève'],['felici','pour l’heureux']],
 notes:[['On s’adresse à quelqu’un : vocatif','Ici on ne parle pas de la vie, on lui parle. Le cas de celui qu’on interpelle est le <b>vocatif</b>. À la 1re déclinaison il ne se distingue pas du nominatif : c’est le <span class="lit">o</span> placé devant, et le sens, qui le signalent.'],
  ['Pour qui ? datif','<span class="lit">misero</span> et <span class="lit">felici</span> désignent ceux à qui la vie paraît longue ou brève. Le <b>datif</b> répond à la question <b>à qui ? pour qui ?</b>']],
 mots:[{f:'vita',an:'vocatif|singulier',lem:'vita, ae (f.)',fn:'apostrophe, marquée par o',
   amb:{'nominatif|singulier':'La forme est exactement celle du nominatif — la 1re déclinaison ne distingue pas les deux. C’est le <span class="lit">o</span> placé devant, et l’absence de verbe, qui font l’apostrophe.',
        'ablatif|singulier':'Même terminaison, mais aucune préposition ni aucune circonstance ici.'}}]},

{id:'L1128',lat:'Gratia gratiam parit',tr:'La faveur engendre la faveur.',
 dis:['La faveur naît de la faveur.','Il faut de la grâce pour obtenir une grâce.'],

  {f:'gratiam',an:'accusatif|singulier',lem:'gratia, ae (f.)',fn:'COD de parit',
   amb:{}}]},

{id:'L1875',lat:'Non scholae, sed vitae discimus',tr:'Nous n’apprenons pas pour l’école, mais pour la vie.',
 dis:['Nous n’apprenons pas de l’école, mais de la vie.','Ce n’est pas l’école, mais la vie, qui nous instruit.'],
 grp:[['non discimus','nous n’apprenons pas'],['scholae','pour l’école'],['sed','mais'],['vitae','pour la vie']],
 notice:'<h5>Une devise retournée</h5>Sénèque avait écrit l’inverse : <span class="lit">non vitae, sed scholae discimus</span> — nous apprenons pour l’école au lieu d’apprendre pour la vie. C’était un reproche adressé aux écoles de son temps. En intervertissant deux mots, le XIX<sup>e</sup> siècle en a fait une devise scolaire, et un programme.',
 notes:[['Le datif : à qui, pour quoi ?','<span class="lit">scholae</span> et <span class="lit">vitae</span> disent en vue de quoi l’on apprend. Le <b>datif</b> répond à la question <b>à qui ? pour qui ? pour quoi ?</b> Il correspond le plus souvent à ce que le français appelle le complément d’objet indirect.'],
  ['La même forme, deux cas','<span class="lit">vitae</span> voulait dire « de la vie » dans la première citation : c’était un génitif. Ici il veut dire « pour la vie » : c’est un datif. C’est le contexte qui permet de trancher, pas la forme seule.']],
 mots:[{f:'scholae',an:'datif|singulier',lem:'schola, ae (f.)',fn:'datif de but',
   amb:{'génitif|singulier':'La terminaison <span class="lit">-ae</span> vaut aussi pour le génitif. Mais il n’y a ici aucun nom à compléter : le mot dépend du verbe <span class="lit">discimus</span>.',
        'nominatif|pluriel':'La phrase a déjà son sujet, contenu dans <span class="lit">discimus</span> : « nous ».',
        'vocatif|pluriel':'Aucune apostrophe ici.'}},
  {f:'vitae',an:'datif|singulier',lem:'vita, ae (f.)',fn:'datif de but, coordonné à scholae',
   amb:{'génitif|singulier':'C’est bien le cas qu’il avait dans <span class="lit">Historia magistra vitae</span>. Pas ici : <span class="lit">sed</span> le coordonne à <span class="lit">scholae</span>, donc il en partage la fonction.',
        'nominatif|pluriel':'La phrase a déjà son sujet.',
        'vocatif|pluriel':'Aucune apostrophe ici.'}}]},

{id:'L2561',lat:'Sine ira et studio',tr:'Sans colère ni parti pris.',
 dis:['Avec ardeur, mais sans colère.','Sans colère et avec application.'],
 grp:[['sine','sans'],['ira','colère'],['et','et'],['studio','(sans) parti pris']],
 notice:'<h5>Comment écrire l’histoire</h5>Tacite ouvre ainsi ses <i>Annales</i> : il annonce qu’il écrira sans colère ni faveur. <span class="lit">Studium</span> n’est pas ici le zèle mais la faveur partisane, le parti pris. C’est la formule qu’on cite encore pour dire l’impartialité d’un historien, d’un journaliste ou d’un juge.',
 notes:[['Le cas des circonstances : ablatif','<span class="lit">sine</span> est toujours suivi de l’<b>ablatif</b>. C’est le cas qui dit avec quoi, sans quoi, par quel moyen, en quel lieu. Ici la préposition gouverne les deux noms à la fois, bien que « sans » ne soit écrit qu’une fois.']],
 mots:[{f:'ira',an:'ablatif|singulier',lem:'ira, ae (f.)',fn:'après sine',
   amb:{'nominatif|singulier':'La terminaison est la même — mais la phrase n’a pas de verbe, donc pas de sujet, et <span class="lit">sine</span> commande le mot.',
        'vocatif|singulier':'Même terminaison, mais personne n’est interpellé.'}}]},

{id:'L2673',lat:'Tantaene animis caelestibus irae ?',tr:'Les cœurs célestes ont-ils de si grandes colères ?',
 dis:['Le cœur céleste a-t-il une si grande colère ?','Les colères célestes ont-elles de si grands cœurs ?'],
 grp:[['tantaene irae','de si grandes colères (sont-elles)'],['animis','aux cœurs'],['caelestibus','célestes']],
 notes:[['Un sujet sans verbe : nominatif','<span class="lit">irae</span> est le sujet, au <b>nominatif pluriel</b>. Aucun verbe n’est écrit : le latin sous-entend volontiers le verbe être. Rétabli et remis dans l’ordre, le vers donne <i>Tantaene irae (sunt) animis caelestibus ?</i>'],
  ['Avoir, en latin, c’est être à quelqu’un','Mot à mot : « de si grandes colères (sont-elles) <b>aux</b> cœurs célestes ? ». Le latin exprime l’appartenance avec le verbe être et un datif : <span class="lit">animis</span> est ce datif. C’est le tour de <i>mihi est liber</i>, « il y a un livre à moi », c’est-à-dire « j’ai un livre ». Le français inverse les rôles : ce qui était sujet en latin devient complément, et le possesseur devient sujet — « Les cœurs célestes <b>ont</b>-ils de si grandes colères ? » C’est le <b>datif de possession</b>.']],
 /* animis écarté de l’analyse : la forme est celle d’animus, animi, 2e déclinaison — non vue à
    l’unité 1. Lemme arbitré le 13 septembre 2026 (Servius : dis superis, τοῖς θυμοῖς). */
 mots:[{f:'irae',an:'nominatif|pluriel',lem:'ira, ae (f.)',fn:'sujet, sans verbe écrit',
   amb:{'génitif|singulier':'La terminaison <span class="lit">-ae</span> vaut aussi pour le génitif singulier. Mais il n’y a ici aucun nom à compléter, et <span class="lit">Tantaene</span> s’accorde au mot : un pluriel.',
        'datif|singulier':'Même terminaison, mais <span class="lit">Tantaene</span> s’accorde au mot et impose le pluriel.',
        'vocatif|pluriel':'Aucune apostrophe ici : c’est une question, pas une invocation.'}}]},

{id:'L1767',lat:'Nigra sum et formosa, filiae Jerusalem',tr:'Je suis noire et belle, filles de Jérusalem.',
 dis:['Les filles de Jérusalem sont noires et belles.','Je suis la fille noire et belle de Jérusalem.'],
 grp:[['sum','je suis'],['nigra','noire'],['et','et'],['formosa','belle'],['filiae','filles'],['Jerusalem','de Jérusalem']],
 notice:'<h5>Un mot changé</h5>L’hébreu du <i>Cantique des cantiques</i> écrit « et », et le grec de la Septante écrit <i>kai</i>, « et » lui aussi. En traduisant <span class="lit">sed</span>, « mais », Jérôme de Stridon a transformé une coordination en concession : de « je suis noire et belle », il a fait « je suis noire mais belle ». La forme donnée ici rétablit le sens original.',
 notes:[['L’attribut : nominatif','<span class="lit">nigra</span> et <span class="lit">formosa</span> disent ce qu’est le sujet, un « je » qui n’est pas écrit mais que porte le verbe <span class="lit">sum</span>. L’attribut du sujet se met au <b>nominatif</b>, comme le sujet lui-même.'],
  ['Encore une apostrophe : vocatif pluriel','<span class="lit">filiae</span> : celles à qui l’on parle. Au pluriel non plus, la 1re déclinaison ne distingue pas le <b>vocatif</b> du nominatif ; seuls la virgule et le sens le font.']],
 mots:[{f:'filiae',an:'vocatif|pluriel',lem:'filia, ae (f.)',fn:'apostrophe',
   amb:{'nominatif|pluriel':'La forme est exactement celle du nominatif pluriel. Mais le sujet de <span class="lit">sum</span> est « je », à la première personne : ces filles ne peuvent pas en être le sujet. Elles sont interpellées.',
        'génitif|singulier':'Même terminaison, mais aucun nom à compléter ici.',
        'datif|singulier':'Même terminaison, mais le mot ne dépend d’aucun verbe.'}}]},

{id:'L1338',lat:'Injuriarum remedium est oblivio',tr:'Le remède aux offenses est l’oubli.',
 dis:['L’oubli des offenses est un remède.','Le remède est l’oubli de l’injustice.'],
 grp:[['remedium','le remède'],['injuriarum','des injustices'],['est','est'],['oblivio','l’oubli']],
 notes:[['Le complément du nom, au pluriel','<span class="lit">Injuriarum</span> complète <span class="lit">remedium</span> : le remède <b>de</b> quoi ? Même question qu’avec <span class="lit">vitae</span> dans la première citation, même cas — le <b>génitif</b> — mais pour plusieurs. Au pluriel, il se termine en <span class="lit">-arum</span>.'],
  ['Deux nominatifs, aucun arbitre','<span class="lit">remedium</span> et <span class="lit">oblivio</span> sont tous deux au nominatif singulier. Rien ne dit lequel est le sujet et lequel est l’attribut : ni la forme, ni l’ordre des mots, que le latin ne fixe pas. Les deux lectures sont recevables.']],
 mots:[{f:'Injuriarum',an:'génitif|pluriel',lem:'injuria, ae (f.)',fn:'complément du nom',amb:{}}]},

{id:'L3048',lat:'Parcere personis, dicere de vitiis',tr:'Épargner les personnes, parler des vices.',
 dis:['Les personnes épargnent, les vices parlent.','Épargner les vices, parler des personnes.'],
 grp:[['parcere','épargner'],['personis','les personnes'],['dicere','parler'],['de vitiis','des vices']],
 notice:'<h5>La devise de la satire</h5>Martial se défend, auprès de son ami Munatius Gallus, d’écrire des vers venimeux : ses livres, dit-il, ont su garder une mesure — épargner les personnes, parler des vices. La formule est la seconde moitié d’un distique et se rattache au vers qui précède, <i>Hunc servare modum nostri novere libelli</i> ; elle circule seule depuis des siècles comme devise de la satire. Et c’est une parodie : Virgile avait écrit <i>Parcere subjectis et debellare superbos</i> — épargner les vaincus et abattre les superbes. Martial garde le verbe et change l’objet.',
 notes:[['Un verbe qui commande le datif','Le français dit « épargner <b>quelqu’un</b> », le latin dit « épargner <b>à</b> quelqu’un » : <span class="lit">parco</span> se construit avec le <b>datif</b>. <span class="lit">personis</span> est ce datif, au pluriel. C’est le même cas qu’à <i>Non scholae, sed vitae discimus</i>, mais pour une autre raison : là, le but ; ici, le verbe qui l’impose.']],
 /* parcere et dicere écartés : deux infinitifs, rien à ranger dans un panneau d’une seule case
    (règle de l’unité 8). vitiis écarté : 2e déclinaison, non vue à l’unité 1. */
 mots:[{f:'personis',an:'datif|pluriel',lem:'persona, ae (f.)',fn:'complément de parcere',
   amb:{'ablatif|pluriel':'La terminaison <span class="lit">-is</span> vaut pour le datif et pour l’ablatif. Ici c’est le verbe qui décide : <span class="lit">parcere</span> demande le datif — on épargne <b>à</b> quelqu’un.'}}]},

{id:'L0918',lat:'Et lux in tenebris lucet',tr:'La lumière luit dans les ténèbres.',

  ['Un mot sans singulier','<span class="lit">tenebrae</span> n’existe qu’au pluriel, comme « les ténèbres », « les funérailles », « les mœurs ». Le dictionnaire le donne donc au pluriel.']],

{id:'L1566',lat:'Maxima debetur puero reverentia',tr:'Le plus grand respect est dû à l’enfant.',
 dis:['L’enfant doit le plus grand respect.','Le respect de l’enfant est ce qu’il y a de plus grand.'],
 grp:[['maxima reverentia','le plus grand respect'],['debetur','est dû'],['puero','à l’enfant']],
 notice:'<h5>Juvénal, Satires, 14</h5>On en a fait une devise d’école. Juvénal disait autre chose. La phrase continue : <i>si tu prépares quelque chose de honteux</i>. Ce n’est pas un principe d’éducation mais un avertissement — ne fais rien de bas devant un enfant, il t’imitera. Toute la satire porte sur les vices que les pères transmettent à leurs fils.',
 notes:[['Le datif après un verbe','<span class="lit">debetur</span>, « est dû », appelle un datif : dû <b>à</b> qui ? Même question qu’à l’unité 1 avec <span class="lit">scholae</span> et <span class="lit">vitae</span>, mais la terminaison change : le datif de la 2e est en <span class="lit">-o</span>.'],
  ['Un nom de 2e qui ne finit pas en -us','<span class="lit">puero</span> vient de <span class="lit">puer, pueri</span>. Le nominatif ne ressemble pas aux autres, le génitif rétablit tout : c’est bien la 2e déclinaison.']],
 mots:[{f:'reverentia',an:'nominatif|singulier',d:'1re',lem:'reverentia, ae (f.)',fn:'sujet de debetur',
   amb:{'vocatif|singulier':'On ne s’adresse pas au respect : on dit qu’il est dû.',
        'ablatif|singulier':'Le mot commande <span class="lit">debetur</span>, il en est le sujet. C’est <span class="lit">puero</span> qui en est le complément.'}},
  {f:'puero',an:'datif|singulier',d:'2e',lem:'puer, pueri (m.)',fn:'debetur + datif',
   amb:{'ablatif|singulier':'La terminaison <span class="lit">-o</span> vaut pour les deux, et rien dans la forme ne les sépare. Ici <span class="lit">debetur</span>, « est dû », appelle un datif : dû <b>à</b> qui ?'}}]},

 notes:[['Deux ablatifs, deux nombres','<span class="lit">animo</span> est un ablatif singulier, <span class="lit">oculis</span> un ablatif pluriel. Même cas, même fonction, deux terminaisons : <span class="lit">-o</span> et <span class="lit">-is</span>.']],

{id:'L1444',lat:'Lente hora, celeriter anni',tr:'L’heure passe lentement, les années rapidement.',

{id:'L2438',lat:'Risum teneatis, amici ?',tr:'Pourriez-vous retenir votre rire, mes amis ?',

 notes:[['Le vocatif pluriel ne se distingue plus','Au singulier, la 2e avait un vocatif à elle : <span class="lit">Medice</span>. Au pluriel, <span class="lit">amici</span> est identique au nominatif. Seule la virgule et le sens le signalent.']],

        'génitif|singulier':'Même terminaison, mais aucun nom à compléter ici.'}}]},

  ['Encore un nom en -er','<span class="lit">Librorum</span> vient de <span class="lit">liber, libri</span>. Les plus courants de ces noms sont <span class="lit">vir, viri</span> l’homme, <span class="lit">puer, pueri</span> l’enfant, <span class="lit">ager, agri</span> le champ, <span class="lit">magister, magistri</span> le maître. Deux gardent le <span class="lit">e</span> au génitif, <span class="lit">puer</span> et <span class="lit">vir</span> ; les autres le perdent. Seul le génitif le dit.']],

const NOTE_PARAD=`<b>Sept terminaisons pour dix cases — et deux cases qui n’en ont aucune.</b><div class="term"><i></i><i>singulier</i><i>pluriel</i><i>Nom.</i><s>—</s><u>-es</u><i>Voc.</i><s>—</s><u>-es</u><i>Acc.</i><u>-em</u><u>-es</u><i>Gén.</i><u>-is</u><u>-um / -ium</u><i>Dat.</i><u>-i</u><u>-ibus</u><i>Abl.</i><u>-e</u><u>-ibus</u></div>Le tiret ne marque pas une case vide : il marque qu’il <b>n’y a pas de terminaison à retenir</b>. <span class="lit">homo</span>, <span class="lit">mater</span>, <span class="lit">canis</span>, <span class="lit">timor</span>, <span class="lit">lis</span>, <span class="lit">virgo</span> : onze mots, onze terminaisons différentes. La 3e déclinaison n’a pas de nominatif type, et c’est là toute sa difficulté — il faut lire la seconde forme du dictionnaire pour trouver le radical.<br><br>Le vocatif, lui, ne s’écrit jamais autrement que le nominatif. Sur les cinq déclinaisons, une seule case porte une forme qui lui soit propre : le <span class="lit">-e</span> d’<span class="lit">amice</span>, à la 2e. Tu viens de ranger <span class="lit">virgo</span> et <span class="lit">cives</span> dans des cases que rien, dans leur terminaison, ne désignait : ce sont les phrases qui l’ont dit, les impératifs <span class="lit">collige</span> et <span class="lit">plaudite</span>.`;

const NOTE_PARAD=`<b>Six terminaisons pour douze cases — et l’une d’elles en remplit six.</b><div class="term"><i></i><i>singulier</i><i>pluriel</i><i>Nom.</i><u>-us</u><u>-us</u><i>Voc.</i><u>-us</u><u>-us</u><i>Acc.</i><u>-um</u><u>-us</u><i>Gén.</i><u>-us</u><u>-uum</u><i>Dat.</i><u>-ui</u><u>-ibus</u><i>Abl.</i><u>-u</u><u>-ibus</u></div>
Regarde la colonne de gauche et celle de droite ensemble : <span class="lit">-us</span> occupe le
nominatif, le vocatif et le génitif du singulier, puis le nominatif, le vocatif et l’accusatif du
pluriel. Six cases sur douze pour une seule forme écrite. Les Romains distinguaient une quantité —
<span class="lit">fructŭs</span> au nominatif singulier, <span class="lit">fructūs</span> au
génitif — mais l’écriture ne la note pas, et seule la construction décide.<br><br>Deux
terminaisons te sont déjà connues : le <span class="lit">-um</span> de l’accusatif singulier est
celui de la 2e, et le <span class="lit">-ibus</span> du pluriel oblique est celui de la 3e. Une
déclinaison nouvelle ne l’est jamais entièrement.`;

{id:'L3016',lat:'Gallias exercitibus diripiendas permittere',tr:'Permettre aux armées de piller les Gaules.',
 dis:['Permettre aux Gaules de piller les armées.','Livrer les armées au pillage des Gaules.'],

{id:'L2426',lat:'Res, non verba',tr:'Des actes, non des mots.',
 dis:['Les mots ne sont pas des choses.','Ni les choses ni les mots.'],
 grp:[['res','des actes'],['non verba','non des mots']],
 notice:'<h5>Formule de devise</h5>Aucun auteur. Elle appartient à une famille de variantes qui circulent toutes sans texte — <span class="lit">acta non verba</span>, <span class="lit">facta non verba</span> — et doit son succès à sa brièveté et à l’opposition de deux mots que le latin place côte à côte sans verbe. Quintilien dirait qu’elle est devenue le bien de tous par cela même qu’on n’en connaît pas l’auteur.',
 notes:[['Deux nominatifs pluriels, deux déclinaisons','<span class="lit">Res</span> est de la 5e, <span class="lit">verba</span> de la 2e neutre. Rien ne se ressemble, et pourtant les deux mots sont au même cas et au même nombre.'],
  ['Le nominatif pluriel en -es','Identique au singulier. Ici c’est <span class="lit">verba</span>, pluriel manifeste, qui impose la lecture.']],
 mots:[{f:'Res',an:'nominatif|pluriel',d:'5e',lem:'res, rei (f.)',fn:'formule nominale',
   amb:{'nominatif|singulier':'Même forme : la 5e ne distingue pas. Mais <span class="lit">verba</span> est un pluriel, et les deux termes s’opposent terme à terme.',
        'accusatif|pluriel':'Même forme encore. Mais il n’y a aucun verbe transitif : la phrase est nominale.'}},
  {f:'verba',an:'nominatif|pluriel',d:'2e',lem:'verbum, i (n.)',fn:'second terme de l’opposition',
   amb:{'accusatif|pluriel':'Au neutre, les deux se confondent toujours. Mais aucun verbe n’en fait un objet.'}}]},

{id:'L3010',lat:'O spes fallaces et cogitationes inanes meae !',tr:'Ô mes espoirs trompeurs et mes pensées vaines !',
 dis:['Ô mes pensées trompeuses et mes espoirs vains !','Mes espoirs et mes pensées m’ont trompé.'],
 grp:[['o meae spes','ô mes espoirs'],['fallaces','trompeurs'],['et cogitationes','et mes pensées'],['inanes','vaines']],
 notice:'<h5>Cicéron, Pour Milon</h5>Cicéron prête ces mots à Milon partant pour l’exil. Le discours qu’il a réellement prononcé fut un échec — il aurait été troublé par les soldats de Pompée entourant le tribunal — et celui que nous lisons est la version écrite après coup, celle qu’il aurait voulu prononcer. Milon, dit-on en le lisant à Marseille, ne mangerait pas d’aussi bon poisson s’il avait été défendu ainsi.',
 notes:[['Deux vocatifs pluriels, deux déclinaisons','<span class="lit">Spes</span> est de la 5e, <span class="lit">cogitationes</span> de la 3e — et les deux sont coordonnés par <span class="lit">et</span>, donc au même cas. C’est la meilleure occasion du cours de voir la règle jouer sur deux déclinaisons à la fois.'],
  ['Le vocatif pluriel n’existe nulle part','Depuis l’unité 2, tu l’as vu copier le nominatif à chaque déclinaison. Ici encore, et deux fois. Sur les cinq déclinaisons, une seule case du latin porte une forme propre au vocatif : le <span class="lit">-e</span> d’<span class="lit">amice</span>.']],
 mots:[{f:'spes',an:'vocatif|pluriel',d:'5e',lem:'spes, spei (f.)',fn:'apostrophe',
   amb:{'nominatif|pluriel':'Homographe, comme tous les vocatifs pluriels. C’est le <span class="lit">O</span> qui fait l’apostrophe.',
        'vocatif|singulier':'Même forme encore : la 5e ne distingue pas les nombres. Mais <span class="lit">fallaces</span> et <span class="lit">meae</span> sont des pluriels.'}},
  {f:'cogitationes',an:'vocatif|pluriel',d:'3e',lem:'cogitatio, cogitationis (f.)',fn:'second terme de l’apostrophe',
   amb:{'nominatif|pluriel':'Homographe aussi. La coordination avec <span class="lit">spes</span> l’entraîne au même cas.'}}]},

{id:'L1274',lat:'In medias res',tr:'Au milieu des choses.',
 dis:['Par le milieu des choses.','Les choses du milieu.'],
 grp:[['in res','dans les choses'],['medias','moyennes']],
 notice:'<h5>Horace, Art poétique</h5>Horace loue Homère de ne pas commencer l’<i>Iliade</i> par les origines : <span class="lit">nec gemino bellum Trojanum orditur ab ovo</span>, il n’entame pas la guerre de Troie à partir de l’œuf jumeau — celui de Léda, d’où naquit Hélène. Puis : il court toujours au dénouement et emporte l’auditeur <b>au milieu des choses</b> comme si elles lui étaient déjà connues. Les deux formules sont voisines d’un vers, et le français a gardé les deux : commencer <i>ab ovo</i>, c’est remonter à l’origine ; commencer <i>in medias res</i>, c’est jeter le lecteur au milieu.',
 notes:[['Trois mots qui ne se coupent pas comme on croit','<span class="lit">In</span> régit <span class="lit">res</span>, et <span class="lit">medias</span> s’accorde à <span class="lit">res</span> : ce n’est pas « dans le milieu des choses » mais « dans les choses moyennes ».'],
  ['L’accusatif pluriel après <span class="lit">in</span>','<span class="lit">In</span> demande l’accusatif quand il y a mouvement vers, l’ablatif quand il y a repos. Ici on entre : accusatif.'],
  ['Le quatrième emprunt à la même œuvre','L’unité 4 y a pris <span class="lit">Adhuc sub judice lis est</span>, l’unité 5 <span class="lit">Laudator temporis acti</span>, et la formule <span class="lit">vos plaudite</span> y figure aussi. Quatre citations du cours sortent d’un poème de quatre cent soixante-seize vers.']],
 mots:[{f:'res',an:'accusatif|pluriel',d:'5e',lem:'res, rei (f.)',fn:'après in, mouvement',
   amb:{'nominatif|pluriel':'Même forme, comme toujours. Mais <span class="lit">in</span> ne peut être suivi que d’un accusatif ou d’un ablatif — jamais d’un nominatif.',
        'nominatif|singulier':'Même forme encore. Mais <span class="lit">medias</span> est un pluriel, et il s’accorde.'}}]},

{id:'L2645',lat:'Sunt lacrimae rerum',tr:'Il y a des larmes pour les choses.',
 dis:['Les choses sont des larmes.','Les larmes ont leurs raisons.'],
 grp:[['sunt','il y a'],['lacrimae','des larmes'],['rerum','pour les choses']],
 notice:'<h5>Virgile, Énéide I</h5>Énée vient d’échouer à Carthage. Dans le temple que Didon fait bâtir à Junon, il découvre des fresques : la guerre de Troie, Priam, Achille cruel aux deux camps. Il s’arrête, il pleure, et dit : <span class="lit">quis iam locus, quae regio in terris nostri non plena laboris ?</span> Puis vient notre vers, suivi de <span class="lit">et mentem mortalia tangunt</span>. <b>Ce qui le bouleverse, c’est que des étrangers aient peint son malheur</b> — donc qu’ils l’aient compris. Ce n’est pas seulement une plainte, c’est une consolation. Diderot voulait qu’on écrivît le vers sur la porte des ateliers de peintres.',
 notes:[['Un génitif qu’on ne sait pas trancher','<span class="lit">Rerum</span> peut être objectif — des larmes <b>pour</b> les choses, on pleure sur les malheurs du monde — ou subjectif — les larmes <b>des</b> choses, le monde lui-même pleure. La critique tient l’ambiguïté pour délibérée, et les traducteurs se partagent depuis deux mille ans.'],
  ['Attention au français','« Pour les choses » sonne comme un datif. Ce n’en est pas un : <span class="lit">rerum</span> est un <b>génitif pluriel</b>. C’est le même piège que la <span class="lit">belua multorum capitum</span> de l’unité 5 : le français disait « la bête <b>aux</b> nombreuses têtes », et c’était un génitif.'],
  ['Et <span class="lit">res</span> reste vague exprès','Traduire par « malheurs » ou « circonstances » trancherait à la place de Virgile. Le mot le plus imprécis du latin fait ici un chef-d’œuvre.']],
 mots:[{f:'lacrimae',an:'nominatif|pluriel',d:'1re',lem:'lacrima, ae (f.)',fn:'sujet de sunt',
   amb:{'génitif|singulier':'La 1re confond le génitif singulier et le nominatif pluriel. Mais <span class="lit">sunt</span> est au pluriel et réclame un sujet.'}},
  {f:'rerum',an:'génitif|pluriel',d:'5e',lem:'res, rei (f.)',fn:'complément de lacrimae',
   amb:{'datif|pluriel':'Le datif pluriel de la 5e est <span class="lit">rebus</span>. Le français « pour les choses » induit en erreur : c’est bien un génitif.'}}]},

{id:'L0511',lat:'Cedit amor rebus',tr:'L’amour cède aux affaires.',
 dis:['Les affaires cèdent à l’amour.','L’amour se mêle des affaires.'],
 grp:[['amor','l’amour'],['cedit','cède'],['rebus','aux affaires']],
 notice:'<h5>Ovide, Remèdes à l’amour</h5>Une ordonnance médicale. Le poème enseigne comment se guérir d’un amour malheureux sans finir comme Didon ou Médée : s’occuper, voyager, fuir le vin et la poésie amoureuse. <span class="lit">Tam Venus otia amat ; qui finem quaeris amoris, cedit amor rebus : res age, tutus eris</span> — Vénus aime l’oisiveté ; toi qui cherches une fin à l’amour, occupe-toi, tu seras sauf. <b>Regarde le verbe</b> : Virgile faisait dire à Gallus <span class="lit">et nos cedamus Amori</span>, cédons à l’Amour. Même verbe, reddition inversée — chez l’un l’amant capitule, chez l’autre c’est l’amour.',
 notes:[['Le datif pluriel en -ebus','Cette terminaison n’appartient qu’à la 5e. Elle est ta meilleure marque de reconnaissance, avec le <span class="lit">-ei</span> du singulier.'],
  ['<span class="lit">Cedo</span> se construit avec le datif','Céder <b>à</b> quelque chose. C’est le verbe qui impose le cas, comme toujours — et la phrase suivante du paradigme fera le contraire.']],
 mots:[{f:'amor',an:'nominatif|singulier',d:'3e',lem:'amor, amoris (m.)',fn:'sujet de cedit',
   amb:{'vocatif|singulier':'Même forme, mais on ne s’adresse pas à l’amour ici : il est le sujet.'}},
  {f:'rebus',an:'datif|pluriel',d:'5e',lem:'res, rei (f.)',fn:'après cedit',
   amb:{'ablatif|pluriel':'La terminaison vaut pour les deux. Mais <span class="lit">cedo</span> demande un datif, et aucune préposition n’impose l’ablatif.'}}]},

{id:'L2398',lat:'Rebus sic stantibus',tr:'Les choses demeurant en l’état.',
 dis:['Les choses ont changé d’état.','Que les choses restent ainsi.'],
 grp:[['rebus stantibus','les choses demeurant'],['sic','ainsi']],
 notice:'<h5>Langue du droit</h5>Fragment d’une clause dont la forme complète est <span class="lit">conventio omnis intelligitur rebus sic stantibus</span> : toute convention s’entend les choses demeurant en l’état. Un engagement est pris dans des circonstances données, et ces circonstances font partie de l’engagement. Le principe est ancien — Polybe rapporte qu’en 211 avant notre ère on l’invoquait déjà — mais la formule est attribuée au juriste Scipione Gentili, mort en 1616. Le droit moderne l’a codifiée à l’article 62 de la Convention de Vienne sur le droit des traités. C’est l’exact contraire de <span class="lit">pacta sunt servanda</span>, et les deux maximes se disputent le droit des traités depuis quatre siècles.',
 notes:[['L’ablatif pluriel en -ebus','Même forme qu’au datif, comme dans <span class="lit">Cedit amor rebus</span>. Mais ici il n’y a pas de verbe qui commande : c’est un <b>ablatif absolu</b>, une construction où le nom et le participe forment à eux seuls une proposition.'],
  ['Deux phrases, une forme, deux cas','<span class="lit">Rebus</span> était datif chez Ovide parce que <span class="lit">cedo</span> l’exigeait ; il est ablatif ici parce que la construction l’impose. C’est la troisième fois que le cours te montre cela — après <span class="lit">pedibus</span> et <span class="lit">dentibus</span>, puis <span class="lit">operibus</span>.']],
 mots:[{f:'Rebus',an:'ablatif|pluriel',d:'5e',lem:'res, rei (f.)',fn:'ablatif absolu avec stantibus',
   amb:{'datif|pluriel':'Même terminaison. Mais aucun verbe ne réclame ici un datif : <span class="lit">stantibus</span> est un participe, et le tout forme un ablatif absolu.'}}]}
];

 mot:'<b><span class="lit">Rien</span> vient de <span class="lit">rem</span>, l’accusatif de <span class="lit">res</span>.</b> Le mot voulait dire « quelque chose » et ne s’est chargé de négation que par contagion du <i>ne</i> qui l’accompagnait — on le voit encore dans « il n’a rien dit » contre « as-tu rien vu ? ». Un mot qui signifie <i>nulle chose</i> et qui est littéralement <i>une chose</i>. Quant au <b>rébus</b>, il vient de <span class="lit">de rebus quae geruntur</span>, « des choses qui se passent » : c’était le titre des feuilles satiriques en images que les clercs de Picardie composaient au carnaval.'},
{lem:'dies, diei (m.)',sens:'le jour',cit:'Carpe diem',
 der:['jour','journal','midi','diesel'],ko:'diesel',
 koexp:'<b>diesel</b> vient du nom de Rudolf Diesel, l’ingénieur allemand qui déposa le brevet du moteur en 1892. Un nom propre déguisé en mot latin.',
 mot:'Le latin <span class="lit">dies</span> a presque disparu du français, mais il est partout sous d’autres formes. <b>Jour</b> vient de <span class="lit">diurnum</span>, ce qui dure un jour ; <b>journal</b> de <span class="lit">diurnalis</span> ; <b>midi</b> de <span class="lit">medius dies</span>. Et les jours de la semaine gardent les dieux romains : <span class="lit">dies Lunae</span>, <span class="lit">dies Martis</span>, <span class="lit">dies Mercurii</span>. Curiosité de genre : le mot est masculin quand il désigne le jour qui passe, féminin quand il désigne une date fixée.'},
{lem:'spes, spei (f.)',sens:'l’espoir',cit:'O salutis meae spes',

{lem:'species, speciei (f.)',sens:'l’aspect, l’apparence',cit:'Sub specie aeternitatis',

 koexp:'<b>espiègle</b> vient de l’allemand <i>Ulenspiegel</i>, le nom du farceur des contes populaires — passé en français par une traduction du XVI<sup>e</sup> siècle.',
 mot:'<b>L’épice et l’espèce sont le même mot.</b> L’Académie le dit : « les noms <i>épice</i> et <i>espèce</i> ont été jadis si proches qu’on les a un temps confondus ; l’un et l’autre datent du XII<sup>e</sup> siècle et sont issus du latin <span class="lit">species</span> ». Le mot vient d’une racine signifiant <b>observer</b> — d’où la vue, puis l’aspect, puis l’apparence ; et de l’apparence d’un objet on est passé à l’objet lui-même, si bien qu’en latin tardif <span class="lit">species</span> désignait les <b>denrées</b>, et en particulier les drogues et les épices. L’<b>épicier</b> vendait donc des espèces.'},
{lem:'facies, faciei (f.)',sens:'la face, l’apparence',cit:'Facies tua computat annos',

 notice:'<h5>Virgile, Bucoliques II</h5>Les cinq premiers vers plantent la scène : <span class="lit">Formosum pastor Corydon ardebat Alexin</span> — le berger Corydon brûlait pour le bel Alexis, et il était sans espérance. Il venait chaque jour sous les hêtres, et là, seul, il jetait aux monts et aux forêts ces plaintes sans art, d’un effort inutile. Notre vers est le premier mot du chant. <b>Alexis n’est pas là</b> : Corydon parle aux montagnes, et la deuxième personne s’adresse à un absent. Le poème est le plus imité des dix ; André Chénier s’en est nourri.',
 notes:[['La deuxième personne du singulier en -s','<span class="lit">Curas</span> : tu te soucies. C’est la terminaison du « tu », et elle n’en a pas d’autre. La deuxième personne est rare dans les sentences — on parle du monde, pas à quelqu’un — et c’est une des raisons pour lesquelles cette phrase a été retenue.']],
 /* Alexi est volontairement écarté de l'analyse : nom propre grec, à la déclinaison
    incertaine — l'étudiant n'a pas de quoi le ranger. Décision de l'enseignant, 4 sept. */
 mots:[{f:'carmina',an:'accusatif|pluriel',d:'3e',lem:'carmen, carminis (n.)',fn:'COD de curas',
   amb:{'nominatif|pluriel':'Même forme, au neutre. Mais <span class="lit">curas</span> a déjà son sujet, « tu », dans sa terminaison : <span class="lit">carmina</span> est ce dont il ne se soucie pas.'}},
  {esp:'verbe',f:'curas',an:'2e|singulier',d:'1re',lem:'curo, curas, curare, curavi, curatum',fn:'verbe principal',
   amb:{'2e|pluriel':'La deuxième personne du pluriel est en <span class="lit">-tis</span> : <span class="lit">curatis</span>. Le <span class="lit">-s</span> seul est le singulier.',
        '3e|singulier':'La troisième personne est en <span class="lit">-t</span> : <span class="lit">curat</span>. Ici Corydon parle <b>à</b> Alexis, non <b>de</b> lui.'}}]},

{id:'L1548',lat:'Manus manum lavat',tr:'Une main lave l’autre.',
 dis:['La main se lave elle-même.','On lave la main de la main.'],
 grp:[['Manus','la main'],['lavat','lave'],['manum','la main']],
 notice:'<h5>Sénèque, Apocoloquintose — déjà vue à l’unité 6</h5>Tu as analysé les deux noms de cette phrase, <span class="lit">Manus</span> et <span class="lit">manum</span>, nominatif et accusatif d’un même mot de la 4e déclinaison. <b>Le verbe attendait son tour.</b> Rappel : le Sénat des dieux délibère sur la divinisation de Claude, et Hercule court de l’un à l’autre pour acheter des voix — ce n’est pas une maxime sur l’entraide, c’est un renvoi d’ascenseur.',
 notes:[['La troisième personne du singulier en -t','<span class="lit">Lavat</span> : elle lave. Le sujet est <span class="lit">manus</span>, singulier, et la terminaison <span class="lit">-t</span> s’accorde avec lui. C’est la personne la plus fréquente des sentences latines — elles parlent du monde, à la troisième personne.'],
  ['Le verbe à la fin','<span class="lit">Manus manum lavat</span> : sujet, objet, verbe. C’est l’ordre le plus fréquent du latin, et l’inverse du français, qui met le verbe au milieu. Le mot à mot le remet dans l’ordre français pour la traduction — mais retiens que la phrase latine finit par son verbe.']],
 mots:[{f:'Manus',an:'nominatif|singulier',d:'4e',lem:'manus, manus (f.)',fn:'sujet de lavat',
   amb:{'génitif|singulier':'Le génitif s’écrit <span class="lit">manus</span> aussi. Mais <span class="lit">lavat</span> réclame un sujet, et rien d’autre ne peut l’être.'}},
  {f:'manum',an:'accusatif|singulier',d:'4e',lem:'manus, manus (f.)',fn:'COD de lavat',
   amb:{'nominatif|singulier':'Le nominatif est <span class="lit">manus</span>, au début de la phrase. Le <span class="lit">-um</span> est l’accusatif.'}},
  {esp:'verbe',f:'lavat',an:'3e|singulier',d:'1re',lem:'lavo, lavas, lavare, lavavi, lavatum',fn:'verbe principal',
   amb:{'3e|pluriel':'La troisième personne du pluriel est en <span class="lit">-nt</span> : <span class="lit">lavant</span>. Ici le sujet <span class="lit">manus</span> est un singulier — regarde son verbe.',
        '2e|singulier':'La deuxième personne est en <span class="lit">-s</span> : <span class="lit">lavas</span>. Le <span class="lit">-t</span> final dit « il » ou « elle ».'}}]},

{id:'L1216',lat:'Ignoramus et ignorabimus',tr:'Nous ignorons et nous ignorerons.',
 dis:['Nous ignorons ce que nous ignorions.','Nous ignorons et nous oublierons.'],
 grp:[['Ignoramus','nous ignorons'],['et ignorabimus','et nous ignorerons']],
 notice:'<h5>Emil du Bois-Reymond, 1872</h5>Physiologiste allemand, il prononce à Leipzig un discours sur les limites de la connaissance de la nature — et ce sont ses deux derniers mots. Deux limites lui paraissent infranchissables : la nature ultime de la matière, et l’énigme de la conscience. La formule est devenue une querelle : Haeckel l’accusa d’être de mèche avec le Vatican, et David Hilbert lui répondit à la radio en 1930 — <i>wir müssen wissen, wir werden wissen</i>, nous devons savoir, nous saurons. <b>Le sort a tranché contre Hilbert</b> : Gödel et Tarski ont démontré qu’il existe en mathématiques des questions indécidables.',
 notes:[['La première personne du pluriel en -mus','<span class="lit">Ignoramus</span> : nous ignorons. La terminaison <span class="lit">-mus</span> dit « nous » — c’est, après la deuxième du pluriel, la plus rare des sentences, parce qu’elles parlent rarement au nom d’un groupe.'],
  ['Deux temps du même verbe','<span class="lit">Ignoramus</span> est au présent, <span class="lit">ignorabimus</span> au <b>futur</b> — nous ne savons pas <i>aujourd’hui</i>, nous ne saurons pas <i>jamais</i>. Toute la thèse tient dans ce changement de temps. Le futur viendra plus tard ; retiens seulement que <span class="lit">-bi-</span> l’annonce.']],
 mots:[{esp:'verbe',f:'Ignoramus',an:'1re|pluriel',d:'1re',lem:'ignoro, ignoras, ignorare, ignoravi, ignoratum',fn:'premier verbe',
   amb:{'1re|singulier':'La première personne du singulier est en <span class="lit">-o</span> : <span class="lit">ignoro</span>. Le <span class="lit">-mus</span> dit « nous ».',
        '2e|pluriel':'La deuxième personne du pluriel est en <span class="lit">-tis</span> : <span class="lit">ignoratis</span>. Ici c’est <span class="lit">-mus</span>.'}}]},

{id:'L3031',lat:'Sic vos non vobis mellificatis, apes',tr:'Ainsi vous faites du miel, mais non pour vous, abeilles.',
 dis:['Ainsi vous ne faites pas de miel pour vous, abeilles.','Ainsi les abeilles ne font pas de miel pour vous.'],
 grp:[['Sic vos','ainsi vous'],['apes','abeilles'],['mellificatis','vous faites du miel'],['non vobis','(mais) non pour vous']],
 notice:'<h5>Attribué à Virgile, par une anecdote suspecte</h5>La <i>Vie de Virgile</i> raconte qu’ayant affiché anonymement un distique flatteur pour Auguste, le poète vit un certain Bathylle s’en attribuer le mérite et la récompense. Piqué, il réafficha les vers avec quatre débuts identiques, laissés inachevés — <span class="lit">Sic vos non vobis…</span> — que nul ne sut compléter. Puis il les acheva : les oiseaux, les brebis, <b>les abeilles</b>, les bœufs — chacun travaillant pour d’autres que soi. <b>Mais l’anecdote est probablement apocryphe</b> : elle ne figure que dans une version augmentée et tardive de la <i>Vie</i>, et la critique la tient pour suspecte. Le texte le plus célèbre contre le vol littéraire est peut-être lui-même mal attribué.',
 notes:[['La deuxième personne du pluriel en -tis','<span class="lit">Mellificatis</span> : vous faites du miel. Six syllabes, et la terminaison <span class="lit">-tis</span> s’y entend nettement — pour apprendre une désinence, un mot long vaut mieux qu’un court. C’est la personne la plus rare des sentences latines : on parle du monde, on ne s’adresse presque jamais à quelqu’un.'],
  ['Le sujet est dit deux fois','<span class="lit">Vos</span> le dit, et <span class="lit">-tis</span> le redit. Le latin n’a pas besoin du pronom ; s’il l’ajoute, c’est pour insister — <b>vous</b>, et pas pour vous.']],
 mots:[{esp:'verbe',f:'mellificatis',an:'2e|pluriel',d:'1re',lem:'mellifico, mellificas, mellificare, mellificavi, mellificatum',fn:'verbe principal',
   amb:{'2e|singulier':'La deuxième personne du singulier est en <span class="lit">-s</span> : <span class="lit">mellificas</span>. Ici <span class="lit">-tis</span>, et <span class="lit">vos</span> le confirme.',
        '3e|pluriel':'La troisième personne du pluriel est en <span class="lit">-nt</span> : <span class="lit">mellificant</span>. Mais on parle <b>aux</b> abeilles, non d’elles.'}},
  {f:'apes',an:'vocatif|pluriel',d:'3e',lem:'apis, apis (f.)',fn:'apostrophe',
   amb:{'nominatif|pluriel':'Même forme, comme toujours au pluriel. Mais le verbe est à la deuxième personne : on s’adresse aux abeilles, elles ne sont pas le sujet parlant.',
        'accusatif|pluriel':'Même forme encore. Mais <span class="lit">mellificatis</span> n’a pas d’objet exprimé — on parle aux abeilles.'}}]},

{id:'L1188',lat:'Honores mutant mores',tr:'Les honneurs changent les mœurs.',

 grp:[['Honores','les honneurs'],['mutant','changent'],['mores','les mœurs']],
 notice:'<h5>Proverbe médiéval — déjà vu à l’unité 4</h5>Tu as analysé <span class="lit">Honores</span> et <span class="lit">mores</span>, deux pluriels de 3e en <span class="lit">-es</span> dont seul le sens disait lequel était sujet. <b>C’est le verbe qui tranchait, et tu ne l’avais pas regardé.</b> <span class="lit">Mutant</span> est au pluriel : il s’accorde avec son sujet, et le sujet est ce qui change l’autre.',
 notes:[['La troisième personne du pluriel en -nt','<span class="lit">Mutant</span> : ils changent. Le <span class="lit">-nt</span> dit un sujet pluriel. Ici les deux noms sont pluriels, donc la terminaison ne départage pas — c’est le sens qui le fait. Mais dans <span class="lit">Manus manum lavat</span>, le <span class="lit">-t</span> disait tout.'],
  ['Le radical entre deux mots','<span class="lit">Mut-a-nt</span> : le radical, la voyelle de la conjugaison, la terminaison de personne. Cette voyelle <span class="lit">-a-</span> est la marque de la première conjugaison. Tu la retrouves dans les six autres verbes du paradigme.']],
 mots:[{f:'Honores',an:'nominatif|pluriel',d:'3e',lem:'honor, honoris (m.)',fn:'sujet de mutant',
   amb:{'accusatif|pluriel':'Même forme au pluriel de la 3e. C’est le sens qui range <span class="lit">honores</span> comme sujet : ce sont les honneurs qui changent les mœurs.'}},
  {esp:'verbe',f:'mutant',an:'3e|pluriel',d:'1re',lem:'muto, mutas, mutare, mutavi, mutatum',fn:'verbe principal',
   amb:{'3e|singulier':'La troisième personne du singulier est en <span class="lit">-t</span> : <span class="lit">mutat</span>. Ici <span class="lit">-nt</span>, et le sujet <span class="lit">honores</span> est un pluriel.',
        '1re|pluriel':'La première personne du pluriel est en <span class="lit">-mus</span> : <span class="lit">mutamus</span>. Personne ne dit « nous » ici.'}},
  {f:'mores',an:'accusatif|pluriel',d:'3e',lem:'mos, moris (m.)',fn:'COD de mutant',
   amb:{'nominatif|pluriel':'Même forme. Mais si <span class="lit">mores</span> était sujet, ce seraient les mœurs qui changeraient les honneurs — le proverbe dit l’inverse.'}}]},

{id:'L0887',lat:'Errare humanum est, perseverare autem diabolicum',tr:'Se tromper est humain, mais persévérer est diabolique.',
 dis:['L’erreur est humaine, la persévérance est divine.','Se tromper est diabolique, persévérer est humain.'],
 grp:[['Errare','se tromper'],['humanum est','est humain'],['perseverare autem','mais persévérer'],['diabolicum','(est) diabolique']],
 notice:'<h5>Deux sources, aucune n’étant l’auteur</h5>Cicéron fournit la structure entière, dans les <i>Philippiques</i> : <span class="lit">cuiusvis hominis est errare ; nullius nisi insipientis perseverare in errore</span> — se tromper est le propre de tout homme, persévérer dans l’erreur n’appartient qu’à l’insensé. Augustin fournit le mot « diabolique », dans un sermon : <span class="lit">humanum fuit errare, diabolicum est per animositatem in errore manere</span>. La forme reçue est la condensation médiévale des deux. Quant à l’attribution courante à Sénèque, c’est une bévue de lecture : on a lu <span class="lit">humanum errare est</span> là où Sénèque le Rhéteur écrivait <span class="lit">per humanos errores</span>.',
 notes:[['L’infinitif présent en -are','<span class="lit">Errare</span>, <span class="lit">perseverare</span> : deux infinitifs, et le <span class="lit">-are</span> est la marque de la première conjugaison. C’est la troisième forme que donne le dictionnaire — <span class="lit">erro, erras, <b>errare</b></span> — et c’est elle qui te dira toujours la conjugaison.'],
  ['L’infinitif peut être sujet','« Se tromper » est le sujet de <span class="lit">est</span>. Le latin emploie l’infinitif comme un nom neutre — d’où l’accord de <span class="lit">humanum</span> au neutre. Et <span class="lit">diabolicum</span> s’accorde de même, avec un <span class="lit">est</span> sous-entendu.'],
  ['Premier contact avec le verbe être','<span class="lit">Est</span> : il est. Tu l’as rencontré douze fois dans les unités précédentes sans jamais l’analyser. Il est irrégulier — pas de <span class="lit">-a-</span>, pas de <span class="lit">-e-</span> — et on y reviendra. Mais son <span class="lit">-t</span> est bien celui de la troisième personne du singulier.']],
 /* Errare et perseverare sont volontairement écartés de l'analyse : le panneau n'aurait

    dans Reconnaître et au dictionnaire. Décision de l'enseignant, 4 sept. */
 mots:[]}

const FAM=[
{lem:'lavo, lavas, lavare',sens:'laver',cit:'Manus manum lavat',

 koexp:'<b>lavallière</b> porte le nom de la duchesse de La Vallière, maîtresse de Louis XIV, qui a donné son nom à la cravate. Un nom propre déguisé en dérivé.',
 mot:'<b>Ton lavabo est un verbe conjugué au futur.</b> <span class="lit">Lavabo inter innocentes manus meas</span> — je laverai mes mains parmi les innocents — est un verset du psaume 25 que le prêtre disait en se lavant les doigts après avoir béni le pain et le vin. Le mot a désigné le rite, puis le linge, puis la fontaine des monastères, et enfin, au XIX<sup>e</sup> siècle, le meuble. Depuis Vatican II le prêtre dit un autre verset, mais le rite a gardé son nom. <b>C’est la seule forme du futur que tout le monde connaît sans le savoir</b> — et elle annonce une étape prochaine. La <b>lavande</b> est la plante qu’on mettait dans l’eau de lavage.'},

{lem:'muto, mutas, mutare',sens:'changer',cit:'Honores mutant mores',
 der:['muer','mutuel','emprunt','muet'],ko:'muet',
 koexp:'<b>muet</b> vient de <span class="lit">mutus</span>, silencieux — deux lettres près de <span class="lit">muto</span>, et rien de commun. Mais l’histoire ne s’arrête pas là : lis la suite.',

{id:'L2288',lat:'Qui monet quasi adjuvat',tr:'Qui avertit aide en quelque sorte.',

 notice:'<h5>Plaute, Curculio, 460 — déjà vue à l’unité 8</h5>Tu avais cliqué <span class="lit">adjuvat</span>, le verbe de la première conjugaison ; <span class="lit">monet</span>, avec son <span class="lit">-e-</span>, était l’intrus. Il est aujourd’hui la cible. <b>Et la phrase n’est pas une sagesse, c’est une réplique de théâtre.</b> Le banquier Lycon presse le maquereau Cappadox de prendre l’argent et de livrer la jeune fille malgré son serment — <span class="lit">Quid id refert tua, dum argentum accipias ?</span> — et Cappadox cède : <span class="lit">Qui monet quasi adjuvat. Sequimini.</span> « Qui avertit aide en quelque sorte. Suivez-moi. » La maxime sur le bon conseil est l’alibi d’un parjure. Compare avec <span class="lit">Res sacra consilium</span>, que tu as vue aux unités 3 et 7 : là, le conseil est sacré ; ici, il sert d’excuse.',

{id:'L0631',lat:'Cucurbitae caput non habemus',tr:'Nous n’avons pas une tête de courge.',

 grp:[['Non habemus','Nous n’avons pas'],['caput','une tête'],['cucurbitae','de courge']],
 notice:'<h5>Apulée, Métamorphoses I, 15</h5>Lucius veut quitter l’auberge avant l’aube ; le portier, à moitié endormi, refuse d’ouvrir : les routes sont infestées de brigands — <span class="lit">nos cucurbitae caput non habemus ut pro te moriamur</span>, nous n’avons pas une tête de courge, pour aller mourir à ta place. Autrement dit : nous ne sommes pas assez bêtes. <b>La courge des Romains n’est pas la citrouille</b>, qui vient d’Amérique : c’est la courge-calebasse, <i>Lagenaria</i>, dont on faisait des vases — Pline le dit, on en tirait des brocs et des jarres à vin. Une tête de courge est une tête creuse, un récipient vide. Le français a gardé l’image : une <i>gourde</i>, c’est le même mot latin.',
 notes:[['La première personne du pluriel en -emus','<span class="lit">Habemus</span> : nous avons. Le <span class="lit">-mus</span> dit « nous », comme <span class="lit">ignoramus</span> à l’unité 8 ; le <span class="lit">-e-</span> dit la deuxième conjugaison. La phrase est celle d’un portier qui parle pour lui et ses semblables : le pluriel est un « nous, les gens sensés ».'],
  ['Un génitif en -ae','<span class="lit">Cucurbitae</span> complète <span class="lit">caput</span> : une tête <i>de</i> courge. Le <span class="lit">-ae</span> de la première déclinaison pourrait être un nominatif pluriel ou un datif — mais <span class="lit">caput</span> est le COD d’<span class="lit">habemus</span>, et il lui faut un complément. Tu retrouveras ce même génitif en <span class="lit">-ae</span> dans <i>Reconnaître</i>, chez Jérôme : <span class="lit">talpae</span>, de taupe.']],

{id:'L0199',lat:'Aliud est celare, aliud tacere',tr:'Cacher est une chose, taire en est une autre.',
 dis:['Cacher et taire sont une seule et même chose.','Il est autre de se cacher, autre de se taire.'],
 grp:[['Aliud est celare','Cacher est une chose'],['aliud tacere','taire en est une autre']],
 notice:'<h5>Cicéron, De officiis III, 52</h5>Un marchand de Rhodes apporte du blé à Alexandrie affamée ; il sait que d’autres navires chargés de blé sont en route. Doit-il le dire, ou se taire et vendre au prix fort ? Cicéron fait débattre deux stoïciens. Antipater : tu dois parler, l’intérêt commun est le tien. Diogène de Babylone répond : <span class="lit">Aliud est celare, aliud tacere</span> — cacher, c’est autre chose que taire ; je ne te cache rien si je ne te dis pas ce que je ne suis pas tenu de dire. <b>Cicéron donne tort à Diogène</b> — mais la distinction est restée.',

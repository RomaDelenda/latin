 src:'Térence, <i>Phormion</i> 506 : <span class="lit">immo, id quod aiunt, auribus teneo lupum</span> — « comme on dit », précise Antiphon : c’était déjà un dicton, et le loup qu’il tient est sa propre femme, qu’il ne peut ni garder ni lâcher. Suétone (<i>Tibère</i> 25) rapporte que Tibère disait souvent tenir ainsi le loup par les oreilles — l’empire. Jefferson, en 1820, appliqua l’image à l’esclavage : <i>we have the wolf by the ears</i>.'},
{lat:'Timeo Danaos et dona ferentes',tr:'Je crains les Danaens, même lorsqu’ils apportent des présents.',ok:'Timeo',esp:'verbe',c:'1re',n:'singulier',
 lem:'timeo, times, timere, timui',note:'<span class="lit">Timeo</span> : je crains — <span class="lit">-eo</span>, première personne, deuxième conjugaison. <span class="lit">Ferentes</span> est un participe, « apportant » ; il n’est pas conjugué.',
 src:'Virgile, <i>Énéide</i> II, 49. Laocoon devant le cheval de bois : <span class="lit">quidquid id est, timeo Danaos et dona ferentis</span>. Virgile écrit <span class="lit">ferentis</span>, l’accusatif pluriel en <span class="lit">-is</span> des poètes ; la forme reçue de la locution est <span class="lit">ferentes</span>.'},
{lat:'Timeo lectorem unius libri',tr:'Je crains le lecteur d’un seul livre.',ok:'Timeo',esp:'verbe',c:'1re',n:'singulier',
 lem:'timeo, times, timere, timui',note:'Le même <span class="lit">timeo</span> que chez Virgile. <span class="lit">Lectorem</span>, accusatif de la 3e ; <span class="lit">libri</span>, génitif de la 2e — deux analyses que tu connais.',
 src:'<b>Attribuée à Thomas d’Aquin, elle n’est pas dans ses œuvres.</b> La première trace de l’attribution est anglaise et tardive — l’évêque Jeremy Taylor, en 1649. La formule qui se méfie du lecteur d’un seul livre n’a pas de livre.'},
{lat:'Si vales, bene est. Ego valeo',tr:'Si tu vas bien, c’est bien. Moi, je vais bien.',ok:['vales','valeo'],esp:'verbe',c:['2e','1re'],n:'singulier',
 lem:'valeo, vales, valere, valui, valitum',note:'Deux formes du même verbe, deux personnes : <span class="lit">vales</span>, tu vas bien ; <span class="lit">valeo</span>, je vais bien. L’une ou l’autre est une bonne réponse. Et <span class="lit">ego</span> est dit exprès : <b>moi</b>, je vais bien — la terminaison suffisait, le pronom insiste.',
 src:'Cicéron, <i>Ad familiares</i> XIV, 8 — à sa femme Térentia, de Brindes, le 2 juin 47. C’est la formule d’ouverture des lettres romaines, si courante qu’on l’abrégeait : S.V.B.E.E.V. La lettre continue : prends grand soin de ta santé, on m’écrit que tu as eu de la fièvre.'},
{lat:'Qui timide rogat, docet negare',tr:'Celui qui demande timidement apprend à refuser.',ok:'docet',esp:'verbe',c:'3e',n:'singulier',
 lem:'doceo, doces, docere, docui, doctum',note:'Trois verbes, trois formes : <span class="lit">rogat</span>, première conjugaison, <span class="lit">-a-</span> ; <span class="lit">docet</span>, deuxième, <span class="lit">-e-</span> ; <span class="lit">negare</span>, infinitif de la première. Une seule était à cliquer.',
 src:'Sénèque, <i>Phèdre</i> 593-594. <b>C’est Phèdre qui parle</b>, seule, avant d’avouer à Hippolyte l’amour qu’elle lui porte : <span class="lit">intrepida constent verba : qui timide rogat docet negare</span> — que mes mots soient fermes. La maxime d’audace sert le pire des aveux.'},
{lat:'Semel in anno licet insanire',tr:'Une fois dans l’année, il est permis d’être fou.',ok:'licet',esp:'verbe',c:'3e',n:'singulier',
 lem:'licet, licere, licuit',note:'<span class="lit">Licet</span> : il est permis — un verbe qui ne se conjugue qu’à la troisième personne, comme le français « il faut ». <span class="lit">Insanire</span> est un infinitif d’une conjugaison que tu ne connais pas encore.',
 src:'Proverbe médiéval, lié au carnaval. Le noyau est antique : Augustin cite un mot de Sénèque, <span class="lit">tolerabile est semel anno insanire</span>. Et Horace disait déjà <span class="lit">Dulce est desipere in loco</span> — que tu as vu à l’unité 2 : il est doux de délirer au bon moment.'},
{lat:'Sol omnibus lucet',tr:'Le soleil luit pour tous.',ok:'lucet',esp:'verbe',c:'3e',n:'singulier',
 lem:'luceo, luces, lucere, luxi',note:'Le même <span class="lit">lucet</span> que dans <span class="lit">Et lux in tenebris lucet</span>, en tête de la série. <span class="lit">Omnibus</span> : un datif pluriel — pour tous.',
 src:'Pétrone, <i>Satiricon</i> 100. Ce n’est pas une maxime de justice : c’est <b>Encolpe</b> qui se console de ce que le jeune Giton plaise au vieux poète Eumolpe — ce que la nature a fait de meilleur est à tout le monde, le soleil luit pour tous. La formule a survécu à la situation.'},
{lat:'Habent sua fata libelli',tr:'Les livres ont leurs propres destins.',ok:'Habent',esp:'verbe',c:'3e',n:'pluriel',
 lem:'habeo, habes, habere, habui, habitum',note:'<span class="lit">Habent</span> : ils ont — <span class="lit">libelli</span>, les petits livres, sujet pluriel. Le verbe du paradigme, une fois de plus.',
 src:'Térentianus Maurus, <i>De litteris</i>, v. 1286 — <b>et le vers entier change le sens</b> : <span class="lit">pro captu lectoris habent sua fata libelli</span>, <i>selon la capacité du lecteur</i>, les livres ont leur destin. Ce que le livre devient dépend de qui le lit. Coupée de son premier hémistiche, la phrase parle de fatalité ; entière, elle parle de toi.'},
{lat:'Infandum regina jubes renovare dolorem',tr:'Tu m’ordonnes, ô reine, de renouveler une douleur indicible.',ok:'jubes',esp:'verbe',c:'2e',n:'singulier',
 lem:'jubeo, jubes, jubere, jussi, jussum',note:'<span class="lit">Jubes</span> : tu ordonnes — <span class="lit">-es</span>, deuxième personne du singulier, deuxième conjugaison. <span class="lit">Renovare</span> est un infinitif de la première : ce qu’on ordonne.',
 src:'Virgile, <i>Énéide</i> II, 3 : le premier vers du récit d’Énée à Didon, la chute de Troie. La reine a demandé ; le héros commence par dire ce qu’il lui en coûte.'},
{lat:'Aliena vitia in oculis habemus, a tergo nostra sunt',tr:'Nous avons les vices d’autrui devant les yeux, les nôtres sont dans notre dos.',ok:'habemus',esp:'verbe',c:'1re',n:'pluriel',
 lem:'habeo, habes, habere, habui, habitum',note:'<span class="lit">Habemus</span> : nous avons — la même forme que dans <span class="lit">Cucurbitae caput non habemus</span>. <span class="lit">Sunt</span> est le verbe être, à la troisième personne du pluriel ; trois noms de la 2e déclinaison l’entourent : <span class="lit">vitia</span>, <span class="lit">oculis</span>, <span class="lit">tergo</span>.',
 src:'Sénèque, <i>De la colère</i> II, 28, 8. Derrière la sentence, une fable : Jupiter a pendu à chaque homme deux besaces, celle de ses propres vices dans le dos, celle des vices d’autrui sur la poitrine — Phèdre la raconte, La Fontaine l’a reprise. Et rapproche-la de Jérôme, plus haut : <span class="lit">ad ceteros talpae, caprearum in me oculos possidetis</span>. Sénèque dit que nous sommes tous aveugles à nous-mêmes ; Jérôme reproche à ses censeurs de ne voir que lui.'},
{lat:'Auriculas asini Mida rex habet',tr:'Le roi Midas a des oreilles d’âne.',ok:'habet',esp:'verbe',c:'3e',n:'singulier',
 lem:'habeo, habes, habere, habui, habitum',note:'<span class="lit">Habet</span> : il a — le verbe du paradigme encore, à la troisième personne du singulier. Trois déclinaisons t’entourent : <span class="lit">auriculas</span> (1re, accusatif pluriel), <span class="lit">asini</span> (2e, génitif), <span class="lit">rex</span> (3e, nominatif).',
 src:'Perse, <i>Satires</i> I, 121 — <b>et le vers a été censuré</b>. La <i>Vie de Perse</i> rapporte que le poète avait écrit ceci en visant Néron, qui se piquait de musique, et que son maître Cornutus, après sa mort, changea le vers en <span class="lit">auriculas asini quis non habet ?</span>, « qui n’a pas des oreilles d’âne ? », pour que l’empereur ne s’y reconnût pas. Les manuscrits ne portent plus que la seconde version. Midas, qui avait préféré la flûte de Pan à la lyre d’Apollon, en reçut des oreilles d’âne : son barbier, ne pouvant se taire, confia le secret à un trou, d’où poussèrent des roseaux qui le répétèrent au vent.'},
{lat:'Plus vident oculi quam oculus',tr:'Plusieurs yeux voient mieux qu’un seul.',ok:'vident',esp:'verbe',c:'3e',n:'pluriel',
 lem:'video, vides, videre, vidi, visum',note:'<span class="lit">Vident</span> : ils voient — <span class="lit">-ent</span>, troisième personne du pluriel de la deuxième conjugaison. Et regarde les deux autres mots : <span class="lit">oculi</span> et <span class="lit">oculus</span>, le même nom au pluriel et au singulier, sujets l’un de <span class="lit">vident</span>, l’autre du verbe sous-entendu.',
 src:'Maxime de droit, sans source antique repérée : les recueils juridiques la donnent plutôt dans l’ordre <span class="lit">Plus vident oculi quam oculus</span>. Elle dit ce que dit le français « quatre yeux valent mieux que deux ».'},
{lat:'Actibus immensis urbs fulget massiliensis',tr:'La ville de Marseille brille par ses hauts faits.',ok:'fulget',esp:'verbe',c:'3e',n:'singulier',
 lem:'fulgeo, fulges, fulgere, fulsi',note:'<span class="lit">Fulget</span> : elle brille — le sujet est <span class="lit">urbs</span>, la ville. <span class="lit">Actibus</span> est un ablatif pluriel de 4e déclinaison, ablatif de moyen : c’est <i>par</i> ses hauts faits qu’elle brille.',
 src:'Devise de Marseille, après celle de Paris à l’unité 8, <span class="lit">Fluctuat nec mergitur</span>. L’ordre des mots vaut d’être regardé : <span class="lit">actibus … immensis</span> et <span class="lit">urbs … massiliensis</span> s’enchâssent l’un dans l’autre, chaque nom séparé de son adjectif — une figure que le latin aime et que le français ne peut pas rendre.'},
{lat:'Ad ceteros talpae, caprearum in me oculos possidetis',tr:'Vous avez pour les autres des yeux de taupe, pour moi les yeux (perçants) des chèvres sauvages.',ok:'possidetis',esp:'verbe',c:'2e',n:'pluriel',
 lem:'possideo, possides, possidere, possedi, possessum',note:'<span class="lit">Possidetis</span> : vous possédez — <span class="lit">-etis</span>, deuxième personne du pluriel, la case rare. Et <span class="lit">talpae</span> est un génitif singulier, parallèle à <span class="lit">caprearum</span> : des yeux <i>de</i> taupe, des yeux <i>de</i> chèvres sauvages — le même <span class="lit">-ae</span> que <span class="lit">cucurbitae</span> au paradigme.',
 src:'Jérôme, <i>Lettre</i> 84, 7, à Pammachius et Océanus. Ses adversaires se disent ses imitateurs et l’accusent d’avoir aimé Origène ; il leur retourne le compliment : aveugles aux fautes de tous, perçants pour les siennes. La taupe sans yeux et la chèvre sauvage qui voit de loin sont deux figures du bestiaire antique — Isidore de Séville les décrit encore ainsi. On cite d’ordinaire la phrase amputée, <span class="lit">Talpae… oculos possidetis</span> : il lui manque alors la moitié qui fait la pointe.'}
];

CATALOGUE[10]=(function(){
/* ═══════════════ IDENTITÉ DE L'UNITÉ ═══════════════
   Troisième et dernière unité du présent actif : la 3e, la 3e mixte et la 4e d'un
   seul tenant. META.conj a cinq valeurs, et le moteur bascule de lui-même sur la
   grille msgConj10 dès qu'il voit l'une des trois dernières.
   Deux nouveautés de dispositif, arrêtées par l'enseignant :
     META.paradColonnes — le paradigme se transpose, une ligne par personne et par
       nombre, une colonne par conjugaison. Les quatre lignes que les trois
       conjugaisons partagent portent partout:true et leur terminaison nue dans
       term ; elles remplissent les deux autres colonnes toutes seules. Dix entrées
       pour dix-huit cases : douze y sont indifférentes, et c'est la leçon.
     META.dicoOuvert — les temps primitifs s'affichent sous le mot AVANT la réponse.
       Sans eux, deux des six cases seraient indevinables : rien, au présent, ne
       sépare la mixte de la 4e.
   L'infinitif n'a pas de case au paradigme et n'est jamais analysé (règle des
   unités 8 et 9). Les trois phrases à infinitif sont donc dans Reconnaître, non
   dans les citations — sauf Parcere personis, qui porte deux noms à analyser.
   Ce qu'on a vu ne porte AUCUN item d'analyse sur un verbe : les boutons de
   famille y afficheraient les trois conjugaisons que l'unité n'a pas encore
   enseignées, et l'exercice 0 ne doit rien demander qui soit dans l'unité même. */
const META={
 unite:'Unité 10',
 titre:'Unité 10 — le présent de l’indicatif actif, 3e, mixte et 4e conjugaisons',
 h1:'Le présent de l’indicatif, troisième, mixte et quatrième',
 sous:'<i>rego, regis, regere</i> · <i>facio, facis, facere</i> · <i>scio, scis, scire</i>',
 decl:['1re','2e','3e','4e','5e'],
 conj:['1re','2e','3e','mixte','4e'],
 espece:'verbe',
 paradColonnes:['3e','mixte','4e'],
 dicoOuvert:true,
 notePre:'Cinq conjugaisons sont connues : dis d’abord de laquelle est le verbe, puis sa personne et son nombre. L’entrée du dictionnaire est affichée sous le mot — à l’unité 10, la forme seule ne suffit plus.',
 triBloc:{'3e à 4e':['3e','mixte','4e']},
 consigneTri:'Clique sur chaque verbe, et dis à quelle conjugaison il appartient.',
 suivante:'Unité 11',
 bilan:{
  titre:'Le présent est vu pour toutes les conjugaisons.',
  notes:[
   '<b>Mêmes six terminaisons, pour la troisième fois.</b> <span class="lit">-o</span>, <span class="lit">-s</span>, <span class="lit">-t</span>, <span class="lit">-mus</span>, <span class="lit">-tis</span>, <span class="lit">-nt</span> n’ont pas bougé depuis l’unité 8. Mais pour la première fois, ce qui est devant ne décide plus. Sur six cases, <b>quatre s’écrivent exactement de la même façon dans les trois conjugaisons</b> : <span class="lit">mergis</span>, <span class="lit">regit</span>, <span class="lit">discimus</span>, <span class="lit">reperitis</span> pourraient appartenir à n’importe laquelle. Les unités 8 et 9 t’avaient habitué à ce que la voyelle tranche ; ici, le plus souvent, elle se tait.',
   '<b>Deux cases parlent, et à moitié seulement.</b> À la première personne du singulier, <span class="lit">quaero</span> n’a rien devant son <span class="lit">-o</span>, tandis que <span class="lit">Fugio</span> et <span class="lit">scio</span> ont un <span class="lit">-i-</span>. À la troisième du pluriel, <span class="lit">discunt</span> contre <span class="lit">faciunt</span> et <span class="lit">sitiunt</span>. Dans les deux cas, la troisième se détache — mais la mixte et la quatrième restent ensemble. Au présent, <b>rien ne les sépare jamais</b>.',
   '<b>Pourquoi « troisième mixte ».</b> Le nom dit exactement ce qu’elle fait : elle emprunte aux deux voisines. Le <span class="lit">-io</span> de la quatrième — <span class="lit">facio</span> comme <span class="lit">scio</span> — et l’infinitif de la troisième — <span class="lit">facere</span> comme <span class="lit">regere</span>. Ce n’est pas une cinquième conjugaison, c’est un croisement. Et c’est pour cela qu’elle ne se laisse reconnaître que par son entrée de dictionnaire.',
   '<b>L’infinitif range le verbe, mais il ne suffit plus.</b> C’était la leçon de l’unité 9 : <span class="lit">-are</span> pour la première, <span class="lit">-ere</span> pour la deuxième. Elle tient encore, à une complication près — <span class="lit">-ere</span> appartient maintenant à <b>trois</b> conjugaisons : la deuxième, la troisième et la mixte. <span class="lit">Monēre</span>, <span class="lit">regĕre</span> et <span class="lit">facĕre</span> s’écrivent de la même façon ; la voyelle est longue à la deuxième, brève aux deux autres, et l’écriture ne le note pas. C’est pourquoi tu as passé l’unité à lire des entrées entières au lieu de leur première forme. Devant un verbe inconnu, c’est désormais le seul recours.',
   '<b>Le verbe être attend toujours.</b> <span class="lit">Estis</span>, dans la question de Marc, s’ajoute aux formes déjà croisées depuis l’unité 7 — <span class="lit">est</span>, <span class="lit">sunt</span>, <span class="lit">sumus</span>. Il ne suit aucune des quatre conjugaisons, pas plus que <span class="lit">malo</span> dans <span class="lit">Errare malo cum Platone</span>. On les rassemblera quand il sera temps.'],
  suite:'Le parfait. Tu connais maintenant les cinq déclinaisons et toutes les conjugaisons du présent — mais les entrées de dictionnaire que tu viens d’apprendre à lire portent deux formes que tu n’as pas encore utilisées. <span class="lit">Quaesivi</span>, <span class="lit">feci</span>, <span class="lit">didici</span> : le latin y change de radical, et c’est là que les verbes se reconnaissent vraiment.'
 },
 finRec:[
  [0,'<b>Dix-sept des vingt et une phrases venaient des unités précédentes.</b> Tu en avais analysé les noms, et le verbe était là, sous tes yeux, depuis l’unité 1 — <span class="lit">lucet</span> était dans la l’une des premières citations du cours. Quatre seulement sont neuves : <span class="lit">Non canimus surdis</span>, <span class="lit">Tempus edax rerum</span>, <span class="lit">Vivos voco</span> et <span class="lit">Errare malo cum Platone</span>.'],
  [0,'<b>Trente formes à trier, et douze sont allées dans le même bouton.</b> Onze étaient de la première, sept de la deuxième, douze du bloc. Ce bloc « 3e à 4e » est l’héritier du bouton « une autre » des unités 2 à 6, à une différence près : celui-là avouait l’ignorance, celui-ci nomme ce qu’il contient. Tu sais désormais ce qu’il y a dedans — tu ne peux simplement pas le séparer sans le dictionnaire.'],
  [1,'<b>Dans sept des vingt et une, deux verbes de conjugaisons différentes.</b> <span class="lit">Hora fugit, stat jus</span> — quatre mots, deux conjugaisons. <span class="lit">Verba volant, scripta manent</span> oppose la première à la deuxième, <span class="lit">Aliud est celare, aliud tacere</span> aussi, mais par leurs infinitifs. Et <span class="lit">Vivos voco. Mortuos plango. Fulgura frango.</span> aligne trois verbes qui finissent tous en <span class="lit">-o</span> sans appartenir à la même famille. C’est le propre de cette unité : la terminaison ne décide plus, et deux verbes côte à côte peuvent n’avoir en commun que leur fin.']],
 bonus:[['Famille de mots','Six verbes de l’unité et leurs descendants français.',0],
        ['Reconnaître','Vingt et une phrases : trie chaque verbe par conjugaison.',1],
        ['Cartes','Revoir les onze citations, dans les deux sens.',2]]
};

/* La note de clôture du paradigme : le tableau des terminaisons à trois colonnes,
   classe .term4. Formule retenue par l'enseignant : douze cases sur dix-huit sont
   indifférentes. */
const NOTE_PARAD=`<b>Dix-huit cases, et douze n’y distinguent rien.</b><div class="term4"><i></i><i>3e</i><i>mixte</i><i>4e</i><i>1re sing.</i><u>-o</u><u>-io</u><u>-io</u><i>2e sing.</i><s>-is</s><s>-is</s><s>-is</s><i>3e sing.</i><s>-it</s><s>-it</s><s>-it</s><i>1re plur.</i><s>-imus</s><s>-imus</s><s>-imus</s><i>2e plur.</i><s>-itis</s><s>-itis</s><s>-itis</s><i>3e plur.</i><u>-unt</u><u>-iunt</u><u>-iunt</u></div>
Les quatre lignes grises se lisent dans les trois colonnes à la fois : une seule forme y suffit,
et aucune ne t’apprend à quelle conjugaison appartient le verbe. <span class="lit">Mergis</span>,
<span class="lit">capis</span>, <span class="lit">scis</span> ne se distinguent pas — la quantité du
<span class="lit">i</span> les sépare à l’oreille, l’écriture ne la note pas.<br><br>
Deux lignes seulement portent une différence, et toutes deux opposent la troisième aux
deux autres : le <span class="lit">-i-</span> est là ou il n’y est pas. <b>Aucune ne sépare la mixte
de la quatrième.</b> Rien, au présent, ne les distingue : il faut l’infinitif,
<span class="lit">facere</span> contre <span class="lit">scire</span>, et donc le dictionnaire.<br><br>

 src:'<h5>Cicéron, Tusculanes I, 38, 92</h5>Tu l’as analysée à l’unité 9 — <span class="lit">habes</span> y fut ton premier verbe de deuxième conjugaison. Cicéron vient d’évoquer Endymion endormi et en tire une consolation : la mort, on en essaie chaque nuit le modèle réduit. Le texte continue — <i>eamque cotidie induis</i>, et tu la revêts chaque jour.'},

{lat:'Sol omnibus lucet',tr:'Le soleil luit pour tous.',

 src:'<h5>Pétrone, Satiricon 100</h5>Ce n’est pas une maxime de justice : c’est Encolpe qui se console de voir le jeune Giton plaire au vieil Eumolpe. La formule a survécu à la situation. Elle circule dans l’ordre <i>Sol lucet omnibus</i> ; Pétrone écrit <i>Sol omnibus lucet</i>, et c’est son texte qui est donné ici.'},
{lat:'Omnia vincit amor',tr:'L’amour triomphe de tout.',

 src:'<h5>Virgile, Bucoliques X, 69</h5>Ce n’est pas Virgile qui parle, mais Gallus, l’officier que sa maîtresse a quitté et que le poème imagine en berger d’Arcadie. Il essaie tout, puis cède. Tu as trié ses noms à l’unité 4 ; et la phrase vient du même poème que <span class="lit">Non canimus surdis</span>, soixante vers plus loin.'},

 src:'<h5>Matthieu 6, 34</h5>La fin du passage sur l’inquiétude : ne vous souciez pas du lendemain, le lendemain se souciera de lui-même. Le verbe régit un datif, <span class="lit">diei</span> : la peine suffit <b>à</b> son jour.'},

 src:'<h5>Emil du Bois-Reymond, 1872</h5>Le physiologiste clôt sa conférence sur les limites de la connaissance de la nature par cette formule, qui devint le mot d’ordre d’un camp et l’épouvantail de l’autre. Tu l’as rangée au paradigme de l’unité 8.'},

 src:'<h5>Virgile, Bucoliques X, 8</h5>La même églogue qu’<span class="lit">Omnia vincit amor</span>, soixante vers plus tôt. Le poète chante les amours de Gallus et se rassure : les bois répondent.'},

 src:'<h5>Un vers que la tradition prête à Virgile</h5>Un mauvais poète s’était approprié un distique de lui ; Virgile aurait affiché quatre vers commençant tous par <i>sic vos non vobis</i>, que nul ne sut achever. Tu l’as vue à l’unité 8.'},

 src:'<h5>Marc 4, 40</h5>Jésus aux disciples après la tempête apaisée. Deux deuxièmes personnes du pluriel côte à côte, l’une du verbe être, l’autre non — c’est pourquoi la phrase te revient ici.'},
{lat:'Tempus edax rerum, tuque, invidiosa vetustas, omnia destruitis',tr:'Temps qui dévores les choses, et toi, envieuse vieillesse, vous détruisez tout.',

 src:'<h5>Ovide, Métamorphoses XV, 234-235</h5>Dans le discours de Pythagore sur la fuite du temps. Le verbe a deux sujets à la fois, <span class="lit">Tempus</span> et <span class="lit">vetustas</span>, tous deux apostrophés — d’où le pluriel.'},

 src:'<h5>Inscription de cloche, Schaffhouse, 1486</h5>La cloche de l’abbatiale de Tous-les-Saints a sonné jusqu’en 1895 ; Schiller a mis ces trois phrases en épigraphe de son <i>Chant de la cloche</i>, et on l’appelle depuis la cloche de Schiller. La formule n’est pourtant pas née là : on la lit sur quantité de cloches médiévales. Et le troisième membre n’est pas une image — on sonnait pour briser l’orage, et le rituel romain, en bénissant une cloche, demandait que s’éloignent la foudre et la tempête. <b>Ce que la cloche prétendait faire, un paratonnerre l’a fait.</b> Tu as vu à l’unité 2 <span class="lit">Eripuit caelo fulmen sceptrumque tyrannis</span> : Franklin a arraché au ciel le <i>fulmen</i> que la cloche brisait en vain.'},

/* messages d'erreur de déclinaison, écrits par terminaison et non par mot */
function msgDecl(forme,bonne,choisie){
 const f=forme.toLowerCase();
 const L=t=>`<span class="lit">${t}</span>`;
 /* Le message explique pourquoi la terminaison ne peut pas appartenir
    à la déclinaison choisie. Il est écrit par terminaison, jamais par mot. */
 /* 4e et 5e déclinaisons, connues à partir des unités 6 et 7 */
 if(choisie==='4e'){
  if(/(ae|arum|as|am|a)$/.test(f))return `La 4e déclinaison n’a aucune forme en ${L('-a')} : ses marques sont ${L('-us')}, ${L('-um')}, ${L('-ui')}, ${L('-u')}, ${L('-uum')}, ${L('-ibus')}.`;
  if(/(es|em|ei|erum|ebus)$/.test(f))return `${L('-es')}, ${L('-em')}, ${L('-ei')}, ${L('-ebus')} : ce sont les terminaisons de la 5e. La 4e n’a pas de ${L('-e-')}.`;
  if(/(is|i|o|orum)$/.test(f))return `La 4e ne connaît ni ${L('-i')}, ni ${L('-o')}, ni ${L('-orum')} : son datif est en ${L('-ui')}, son ablatif en ${L('-u')}, son génitif pluriel en ${L('-uum')}.`;
  if(/(us|um)$/.test(f))return `La forme pourrait être de la 4e — mais regarde le génitif au dictionnaire : ${L('-us')} pour la 4e, ${L('-i')} pour la 2e, ${L('-oris')} ou ${L('-eris')} pour un neutre de 3e.`;
  return `La 4e se reconnaît à son génitif en ${L('-us')} et à ses formes en ${L('-u-')} : datif ${L('-ui')}, ablatif ${L('-u')}, génitif pluriel ${L('-uum')}.`;
 }
 if(choisie==='5e'){
  if(/(us|um|ui|u|uum|ibus)$/.test(f))return `${L('-us')}, ${L('-um')}, ${L('-ui')}, ${L('-u')}, ${L('-uum')}, ${L('-ibus')} : ce sont les marques de la 4e. La 5e a un ${L('-e-')} partout — ${L('-es')}, ${L('-em')}, ${L('-ei')}, ${L('-ebus')}.`;
  if(/(ae|arum|as|am|a)$/.test(f))return `La 5e n’a aucune forme en ${L('-a')} : ses terminaisons portent toutes un ${L('-e-')}.`;
  if(/(i|o|orum)$/.test(f))return `La 5e ne connaît ni ${L('-i')}, ni ${L('-o')}, ni ${L('-orum')} : son génitif et son datif sont en ${L('-ei')}, son génitif pluriel en ${L('-erum')}.`;
  if(/es$/.test(f))return `${L('-es')} existe à la 5e — mais aussi à la 3e. Regarde le génitif au dictionnaire : ${L('-ei')} pour la 5e, ${L('-is')} pour la 3e.`;
  return `La 5e se reconnaît à son génitif en ${L('-ei')} et à son ${L('-e-')} constant : ${L('-es')}, ${L('-em')}, ${L('-ei')}, ${L('-erum')}, ${L('-ebus')}.`;
 }
 if(bonne==='4e'){
  if(/(ui|u|uum)$/.test(f))return `${L('-ui')}, ${L('-u')}, ${L('-uum')} n’existent qu’à la 4e déclinaison. Aucune autre ne met un ${L('-u-')} devant sa terminaison.`;
  if(/ibus$/.test(f))return `${L('-ibus')} appartient à la 3e et à la 4e. Ici le génitif au dictionnaire est en ${L('-us')} : c’est la 4e.`;
  if(/(us|um)$/.test(f))return `${L('-us')} et ${L('-um')} existent aussi à la 2e et à la 3e — c’est le piège. Le génitif tranche : ${L('-us')} à la 4e, ${L('-i')} à la 2e, ${L('-oris')} ou ${L('-eris')} au neutre de 3e.`;
  return `Ce mot est de la 4e : son génitif au dictionnaire est en ${L('-us')}, et ses formes obliques portent un ${L('-u-')}.`;
 }
 if(bonne==='5e'){
  if(/(ei|erum|ebus)$/.test(f))return `${L('-ei')}, ${L('-erum')}, ${L('-ebus')} n’existent qu’à la 5e déclinaison : nulle autre n’a ce ${L('-e-')} suivi de la terminaison.`;
  if(/es$/.test(f))return `${L('-es')} existe à la 3e aussi. Mais le génitif au dictionnaire est en ${L('-ei')} : c’est la 5e — ${L('res, rei')}, ${L('dies, diei')}, ${L('spes, spei')}.`;
  if(/em$/.test(f))return `${L('-em')} existe à la 3e aussi — ${L('hominem')}. Le génitif tranche : ${L('-ei')} pour la 5e, ${L('-is')} pour la 3e.`;
  if(/e$/.test(f))return `${L('-e')} est l’ablatif singulier de la 3e comme de la 5e. Le génitif au dictionnaire tranche : ${L('-ei')} pour la 5e.`;
  return `Ce mot est de la 5e : son génitif au dictionnaire est en ${L('-ei')}, et toutes ses formes portent un ${L('-e-')}.`;
 }
 if(choisie==='3e'){
  if(/(ae|arum|as|am)$/.test(f))return `${L('-ae')}, ${L('-am')}, ${L('-as')}, ${L('-arum')} : ce sont les terminaisons de la 1re. La 3e n’en a aucune.`;
  if(/(us|um|os|orum)$/.test(f))return `${L('-us')}, ${L('-um')}, ${L('-os')}, ${L('-orum')} : ce sont les terminaisons de la 2e. La 3e fait son accusatif en ${L('-em')} et son génitif pluriel en ${L('-um')} ou ${L('-ium')}.`;
  if(/(a|o|i)$/.test(f))return `Cette terminaison appartient aux deux premières déclinaisons. Le radical le confirme : c’est le génitif en ${L('-is')} qui signale la 3e.`;
  return `Regarde le radical : la 3e se reconnaît à son génitif en ${L('-is')}, pas à cette terminaison.`;
 }
 if(bonne==='3e'){
  if(/ibus$/.test(f))return `La 1re et la 2e font leur datif-ablatif pluriel en ${L('-is')}, jamais en ${L('-ibus')}. Le ${L('-ibus')} est la marque de la 3e.`;
  if(/em$/.test(f))return `Ni la 1re ni la 2e n’ont d’accusatif en ${L('-em')} : la 1re a ${L('-am')}, la 2e ${L('-um')}.`;
  if(/ium$/.test(f))return `Le génitif pluriel est en ${L('-arum')} à la 1re et en ${L('-orum')} à la 2e. Le ${L('-ium')} n’appartient qu’à la 3e.`;
  if(/es$/.test(f))return `Aucune des deux premières déclinaisons n’a de forme en ${L('-es')}. Leurs pluriels sont en ${L('-ae')} et ${L('-as')}, ou en ${L('-i')} et ${L('-os')}.`;
  if(/is$/.test(f))return `${L('-is')} existe aux deux premières déclinaisons, mais seulement au datif-ablatif <b>pluriel</b>. Ici la forme est un singulier.`;
  if(/e$/.test(f))return `Le ${L('-e')} final n’est un vocatif qu’à la 2e, et seulement sur les noms en ${L('-us')}. Partout ailleurs, c’est l’ablatif singulier de la 3e.`;
  return `La 3e déclinaison n’a pas de nominatif type : c’est le génitif en ${L('-is')} qui la fait reconnaître, et lui seul.`;
 }
 if(bonne==='2e'){
  if(/a$/.test(f))return `Le ${L('-a')} de la 1re est un singulier ; celui du neutre de 2e est un pluriel. Les deux s’écrivent pareil — c’est au radical qu’on les sépare.`;
  if(/(us|um|e|os)$/.test(f))return `La 1re déclinaison n’a aucune forme de ce type. Son nominatif singulier est en ${L('-a')}, son accusatif en ${L('-am')}, son accusatif pluriel en ${L('-as')}.`;
  if(/orum$/.test(f))return `La 1re a ${L('-arum')}, la 2e ${L('-orum')} : seule la voyelle change.`;
  if(/i$/.test(f))return `Le ${L('-i')} n’existe pas à la 1re déclinaison. C’est le ${L('-ae')} qui y remplit les mêmes cases.`;
  if(/o$/.test(f))return `La 1re déclinaison n’a pas de ${L('-o')}. Son datif et son ablatif singuliers sont en ${L('-ae')} et en ${L('-a')}.`;
  if(/is$/.test(f))return `Les deux déclinaisons ont un datif-ablatif pluriel en ${L('-is')}. Regarde le reste du mot : le radical n’est pas celui d’un nom en ${L('-a')}.`;
 }
 if(/is$/.test(f))return `Les deux déclinaisons ont un datif-ablatif pluriel en ${L('-is')}. Regarde le reste du mot.`;
 return `La 2e déclinaison n’a aucune forme en ${L('-a')} au singulier. Son nominatif est en ${L('-us')}, son accusatif pluriel en ${L('-os')}.`;
}


const EXOS=[

];
const ACTIFS=EXOS.filter(e=>e.len()>0);
/* ═══ avancée mémorisée ═══
   Le verrou ne bouge pas : chaque exercice ouvre le suivant. Mais l'avancée est
   écrite dans le navigateur, si bien qu'on reprend là où l'on s'était arrêté au
   lieu de refaire l'unité entière. C'est ce qui déroutait les premiers essayeurs.
   Ce qui est mémorisé : les exercices terminés sans faute et les sections
   « Pour aller plus loin » déjà vues. Rien d'autre — un exercice interrompu en
   cours de route repart de son premier item, comme aujourd'hui en séance.
   La signature est le compte d'items de chaque exercice. Si l'unité change — une
   citation ajoutée, une phrase retirée — l'avancée enregistrée ne correspond plus
   au travail à faire : on la jette et l'unité repart de zéro. On garde donc la
   main sur les unités déjà déposées.
   localStorage n'est pas garanti sur file:// selon le navigateur, et n'existe pas
   du tout sous Node où tournent les batteries : tout passe par try/catch, et
   l'avancée retombe alors en mémoire, le temps de la séance. */
const CLEF_PROGRES='latin.progres';
let UNITE_CLEF=META.unite;
function signature(){return EXOS.map(e=>e.len()).join('.');}
function litProgres(){try{return JSON.parse(localStorage.getItem(CLEF_PROGRES)||'{}')||{};}catch(e){return {};}}
function ecritProgres(o){try{localStorage.setItem(CLEF_PROGRES,JSON.stringify(o));}catch(e){}}
function chargeProgres(clef){
 UNITE_CLEF=clef;
 const neuf={fini:EXOS.map(e=>e.len()>0?0:1),bonus:[0,0,0]};
 const t=litProgres()[clef];
 if(!t||t.sig!==signature())return neuf;
 return {fini:neuf.fini.map((v,i)=>v||(t.fini&&t.fini[i]?1:0)),
         bonus:neuf.bonus.map((_,i)=>t.bonus&&t.bonus[i]?1:0)};
}
function noteProgres(){
 const o=litProgres();
 o[UNITE_CLEF]={sig:signature(),fini:fini.slice(),bonus:bonus.slice()};
 ecritProgres(o);}
/* Reprendre l'unité à zéro : appelé par le bouton du sommaire. */
function oublieProgres(){
 const o=litProgres();delete o[UNITE_CLEF];ecritProgres(o);
 fini=EXOS.map(e=>e.len()>0?0:1);bonus=[0,0,0];POSE={};S=null;menu();}

/* Une unité peut n'avoir aucun item pour un exercice — la 1re n'a rien à réviser.
   L'exercice est alors retiré du menu et compté comme fait. */
const PROGRES0=chargeProgres(META.unite);
let fini=PROGRES0.fini, bonus=PROGRES0.bonus, POSE={}, S=null;

/* ═══ journal des notices ═══
   Un essayeur a demandé à pouvoir relire une notice sans refaire l'exercice.
   Rejouer l'écran précédent est exclu : chaque run() reconstruit la question à
   neuf, sans mémoire de la réponse — on afficherait la citation nue, la notice
   absente. On garde donc ce qui a été VU : en quittant un item, on relève les
   encadrés de l'écran (.note, hors messages d'erreur .note r) et on les range
   avec leur citation. Le panneau les rouvre PAR-DESSUS l'écran courant, sans y
   toucher : écraser app.innerHTML obligerait à le reconstruire au retour, et
   run() effacerait la réponse en cours. Rien n'y est cliquable. */
let JOURNAL=[];
function noterEcran(){
 if(!S)return;
 const blocs=[...app.querySelectorAll('.note')]
   .filter(n=>!n.classList.contains('r'))
   .map(n=>({cls:n.className,html:n.innerHTML}));
 if(!blocs.length)return;
 /* De quoi titrer l'entrée : la citation si l'écran en montre une. Les écrans
    d'intrus — ceux de L'intrus et ceux du même type dans Ce qu'on a vu — n'en
    ont pas : ils posent une question, et c'est elle qui identifie l'item. Sans
    ce rattrapage, l'entrée s'intitulait du nom de l'exercice, deux fois. */
 const l=app.querySelector('.latin');
 let titre=((l?l.textContent:'')||'').replace(/\s+/g,' ').trim(), lat=1;
 if(!titre){const q=app.querySelector('.card > p');
  titre=((q?q.textContent:'')||'').replace(/\s+/g,' ').trim();lat=0;}
 if(!titre){titre=EXOS[S.n].nom;lat=0;}
 if(titre.length>90)titre=titre.slice(0,88).replace(/\s+\S*$/,'')+'…';
 const cle=S.n+'|'+S.file[S.k];
 const d=JOURNAL.find(e=>e.cle===cle);
 if(d){d.blocs=blocs;d.titre=titre;return;} /* la reprise enrichit, elle ne double pas */
 JOURNAL.push({cle:cle,ex:EXOS[S.n].nom,titre:titre,lat:lat,blocs:blocs});}

function majJournal(){
 let b=document.getElementById('jrn');
 if(!b){b=document.createElement('button');b.id='jrn';b.className='jrn';
  b.textContent='Relire les notices';b.onclick=ouvrirJournal;document.body.appendChild(b);}
 b.style.display=(S&&JOURNAL.length)?'block':'none';}

function ouvrirJournal(){
 if(document.getElementById('revoir'))return;
 const d=document.createElement('div');d.id='revoir';
 d.innerHTML='<div class="revoir-fond"></div><div class="revoir-boite" role="dialog">'
  +'<div class="revoir-tete"><b>Ce que tu as déjà lu</b>'
  +'<button class="ghost" id="revoir-x">Fermer</button></div><div class="revoir-corps">'
  +JOURNAL.map(e=>'<div class="revoir-item"><div class="step">'+esc(e.ex)
    +' — '+(e.lat?'<span class="lit">'+esc(e.titre)+'</span>'
      :'<span class="q">'+esc(e.titre)+'</span>')+'</div>'
    +e.blocs.map(b=>'<div class="'+b.cls+'">'+b.html+'</div>').join('')+'</div>').join('')
  +'</div></div>';
 document.body.appendChild(d);
 const fermer=()=>{const x=document.getElementById('revoir');if(x)x.remove();
   document.removeEventListener('keydown',ech);};
 const ech=(e)=>{if(e.key==='Escape')fermer();};
 document.getElementById('revoir-x').onclick=fermer;
 d.querySelector('.revoir-fond').onclick=fermer;
 document.addEventListener('keydown',ech);
 d.querySelector('.revoir-corps').scrollTop=1e6;}

function pied(){return '<div class="foot" id="foot"><span class="grey"></span></div>';}
function suivant(label){
 let f=document.getElementById('foot');
 if(!f){f=document.createElement('div');f.className='foot';f.id='foot';
  f.innerHTML='<span></span>';app.appendChild(f);}
 f.insertAdjacentHTML('beforeend',`<button class="go" id="nx">${label||'Continuer'}</button>`);
 const b=document.getElementById('nx');
 /* focus() faisait défiler la page jusqu'au bouton avant que l'étudiant ait vu si sa
    réponse était juste. preventScroll : le bouton reçoit le focus sans bouger la page. */
 try{b.focus({preventScroll:true});}catch(e){}
 b.onclick=avancer;return b;}
/* Le focus ne défilant plus, rien ne ramenait la page en haut : on arrivait sur la
   nouvelle citation par son pied. */
function hautDePage(){try{window.scrollTo({top:0,behavior:'instant'});}catch(e){try{window.scrollTo(0,0);}catch(e2){}}}
function avancer(){
 noterEcran();
 S.k++;
 if(S.k<S.file.length){hautDePage();S.run();drawBar();return;}
 if(S.rate.length){S.file=S.rate.slice();S.rate=[];S.k=0;S.reprise=true;reprise();return;}
 fini[S.n]=1;noteProgres();S=null;menu();}
function reprise(){
 const e=EXOS[S.n];
 if(e.avantReprise)e.avantReprise(S.file);
 drawBar();
 app.innerHTML=`<div class="card"><div class="step"><em>Reprise</em></div>
  <p style="font:600 21px/1.3 'EB Garamond',serif;margin:0">
  ${S.file.length} item${S.file.length>1?'s':''} à reprendre.</p></div>${pied()}`;
 suivant('Reprendre').onclick=()=>{hautDePage();S.run();drawBar();};}
let RATES=new Set();
function rate(sub){
 if(!S.rate.includes(S.file[S.k]))S.rate.push(S.file[S.k]);
 if(sub!==undefined)RATES.add(S.file[S.k]+'|'+sub);}
function lancer(n){
 const e=EXOS[n];
 if(e.init)e.init();
 let f=Array.from({length:e.len()},(_,k)=>k);
 if(e.melange)f=mix(f);
 S={n:n,file:f,rate:[],k:0,reprise:false,run:e.run};
 eye.textContent=META.unite+' · '+e.nom;st.textContent=e.cons;
 hautDePage();e.run();drawBar();}

/* ═══════════════ SOMMAIRE ═══════════════ */
function menu(){
 eye.textContent=META.unite;st.innerHTML=META.sous;bar.innerHTML='';majJournal();
 const tous=fini.every(Boolean);
 let h='';
 ACTIFS.forEach((e)=>{const k=e.n;
  /* ok||… : un exercice déjà terminé ne se referme jamais, même si l'état relu
     laissait un trou avant lui. Sans cette garde, un « terminé » pouvait s'afficher
     sur un bouton inerte. */
  const ok=fini[k], open=k===0||fini[k-1]||ok;
  h+=`<button class="menu${ok?' ok':''}" data-n="${k}" ${open?'':'disabled'}>
   <span class="mt"><span class="mn">${esc(e.nom)}</span>
   <span class="ms${ok?' ok':''}">${ok?'terminé':open?'':'verrouillé'}</span></span>
   <span class="md">${esc(e.cons)}</span></button>`;});
 h+='<div class="hgroup">Pour aller plus loin</div>';
 META.bonus.forEach(([nom,desc,i])=>{
  h+=`<button class="menu opt${bonus[i]?' ok':''}" data-b="${i}" ${tous?'':'disabled'}>
   <span class="mt"><span class="mn">${nom}</span>
   <span class="ms${bonus[i]?' ok':''}">${bonus[i]?'vu':tous?'':'plus tard'}</span></span>
   <span class="md">${desc}</span></button>`;});
 /* L'avancée étant mémorisée, il faut un moyen d'en sortir : sans lui, une unité
    laissée dans un état qu'on ne veut plus n'aurait aucune porte de secours. */
 const rien=fini.every((v,i)=>v===(EXOS[i].len()>0?0:1))&&bonus.every(v=>!v);
 h+=`<div class="foot" style="margin-top:20px">
  <button class="ghost" id="src">Sources</button>
  ${rien?'':'<button class="ghost" id="raz">Reprendre l’unité à zéro</button>'}
  ${tous?'<button class="go" id="bilan">Bilan</button>':'<span></span>'}</div>`;
 app.innerHTML=h;
 app.querySelectorAll('.menu[data-n]').forEach(b=>b.onclick=()=>lancer(+b.dataset.n));
 app.querySelectorAll('.menu[data-b]').forEach(b=>b.onclick=()=>[()=>famille(0),()=>reconn(0),()=>{CARD=null;cartesChoix();}][+b.dataset.b]());
 document.getElementById('src').onclick=sources;
 const raz=document.getElementById('raz');
 if(raz)raz.onclick=()=>{if(confirm('Effacer l’avancée de cette unité et tout reprendre depuis le début ?'))oublieProgres();};
 if(tous)document.getElementById('bilan').onclick=bilan;
 /* Au retour d'un exercice, le sommaire s'ouvrait là où on l'avait quitté :
    on amène le prochain exercice à faire en haut de l'écran. */
 const suiv=ACTIFS.find(e=>!fini[e.n]);
 const cible=suiv ? app.querySelector(`.menu[data-n="${suiv.n}"]`)
                  : app.querySelector('.menu.opt:not(.ok)') || app.querySelector('#bilan');
 if(cible&&cible.scrollIntoView)
  setTimeout(()=>cible.scrollIntoView({block:'start',behavior:'smooth'}),40);}

/* une ligne d'analyse : déclinaison, puis cas et nombre */
function ligneAnalyse(rows,m,brut,fin,sub){
 /* Tant qu'une seule déclinaison est au programme, la question n'a pas de sens :
    on va droit au cas et au nombre. */
 const E=ESPECES[m.esp||'nom'], FAM=E.familles();
 const SANSDECL=FAM.length<2;
 const k=brut.findIndex(w=>net(w)===m.f);
 const row=document.createElement('div');row.className='arow';
 /* META.dicoOuvert (unité 10) : les temps primitifs s'affichent AVANT la réponse, sous
    le mot. Sans cette clé — unités 1 à 9 — l'entrée reste une récompense, révélée en fin
    de ligne avec l'étiquette et la fonction : leurs écrans ne bougent pas. */
 const dico=(META.dicoOuvert&&m.lem)?`<div class="dico dsous">au dictionnaire : ${esc(m.lem)}</div>`:'';
 row.innerHTML=`<span class="aw">${esc(m.f)}</span>${dico}
  ${SANSDECL?'':`<span class="dgroup">${FAM.map(x=>`<button class="db" data-d="${x}">${x}</button>`).join('')}</span>`}
  <span class="pick"><button class="pb">${E.bouton}</button>
   <div class="panel">${(E.nombres||['singulier','pluriel']).map(n=>`<div class="col"><h4>${ABRN[n]||n}</h4>${
     E.lignes.map(c=>`<button class="cb" style="${E.couleur?`background:${E.couleur(c)};color:${E.fg(c)}`:''}" data-v="${c}|${n}">${
       E.marque?`<span class="mq">${E.marque(c,n)}</span> `:''}${E.abr[c]}</button>`).join('')}</div>`).join('')}
   </div></span>
  <button class="hint">Indice</button>
  <span class="tag hidden"></span>
  <span class="hintbox hidden"></span>
  <span class="detail hidden"></span>
  <span class="amb hidden" style="flex-basis:100%"></span>`;
 rows.appendChild(row);
 const pick=row.querySelector('.pick'),pb=row.querySelector('.pb'),panel=row.querySelector('.panel'),
       tag=row.querySelector('.tag'),det=row.querySelector('.detail'),
       hb=row.querySelector('.hint'),hbox=row.querySelector('.hintbox'),amb=row.querySelector('.amb');
 const [cc,nn]=m.an.split('|');
 const fait={d:SANSDECL,c:false}; let livre=false;
 const check=()=>{if(fait.d&&fait.c&&!livre){livre=true;fin();}};
 /* Le panneau des cas reste inerte tant que la déclinaison n'est pas trouvée.
    Sans cela on pouvait répondre au cas d'abord : le mot se colorait, l'étiquette
    et le lemme s'affichaient, le bouton disparaissait — tout avait l'air fini,
    seule la déclinaison manquait, et « Continuer » ne venait jamais. Le bug a été
    rencontré à l'unité 6 (morborum) : mauvaise déclinaison, puis bon cas à la main.
    L'ouverture automatique après la bonne déclinaison est conservée. */
 pb.disabled=!fait.d;
 const ouvrePanneau=()=>{panel.classList.add('open');
  const r=panel.getBoundingClientRect();
  if(r.right>window.innerWidth-8)panel.classList.add('right');
  /* Sur un écran étroit, un panneau ouvert sur une ligne basse déborde sous le pli :
     on fait remonter la ligne juste ce qu'il faut pour que le panneau tienne entier. */
  /* Recadrage vertical, pour le mobile : visualViewport donne la hauteur
     réellement visible, barre d'adresse déduite, là où innerHeight l'ignore.
     RESTE IMPARFAIT — la barre se redéploie parfois après le recadrage et masque
     de nouveau la dernière ligne du panneau. Une écoute du redimensionnement du
     viewport a été tentée le 2 septembre : sans effet observable, retirée. */
  setTimeout(()=>{
   const vv=window.visualViewport;
   const h=(vv&&vv.height)||window.innerHeight||600;
   const q=panel.getBoundingClientRect(), MARGE=28;
   if(q.bottom>h-MARGE){
    const d=Math.min(q.bottom-h+MARGE, row.getBoundingClientRect().top-12);
    if(d>0&&window.scrollBy)window.scrollBy({top:d,behavior:'smooth'});
   }},220);};
 const indice=()=>{hbox.innerHTML=E.question(cc);hbox.classList.remove('hidden');hb.classList.add('hidden');};
 hb.onclick=indice;
 /* Sans question de déclinaison, toutes les lignes seraient prêtes en même temps
    et tous les panneaux s'ouvriraient d'un coup. On n'ouvre que la première non faite. */
 if(SANSDECL)row.ouvrir=ouvrePanneau;
 row.querySelectorAll('.db').forEach(b=>b.onclick=()=>{
  if(b.dataset.d!==m.d){
   b.style.borderColor='var(--no)';rate(sub);
   setTimeout(()=>b.style.borderColor='',700);
   amb.innerHTML=`<div class="note r">${E.msgFam(m.f,m.d,b.dataset.d,m.lem)}</div>`;amb.classList.remove('hidden');
   return;}
  row.querySelectorAll('.db').forEach(x=>{x.disabled=true;if(x!==b)x.style.opacity=.22});
  b.classList.add('sel');amb.classList.add('hidden');
  fait.d=true;pb.disabled=false;
  if(!fait.c)ouvrePanneau();   /* le menu s'ouvre de lui-même */
  check();});
 pb.onclick=()=>{if(pb.disabled)return;
  if(panel.classList.contains('open'))panel.classList.remove('open');else ouvrePanneau();};
 panel.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{
  if(b.dataset.v!==m.an){
   b.style.outline='2px solid var(--no)';rate(sub);
   setTimeout(()=>b.style.outline='',700);
   amb.innerHTML=m.amb&&m.amb[b.dataset.v]
     ? `<div class="note r">${m.amb[b.dataset.v]}</div>`
     : `<div class="note r">Cette terminaison ne peut pas porter ce cas.</div>`;
   amb.classList.remove('hidden');
   /* Le panneau se referme : déployé, il masquait la moitié du message.
      Le bouton reste visible pour rouvrir et corriger. */
   setTimeout(()=>panel.classList.remove('open'),260);
   return;}
  panel.classList.remove('open');pb.classList.add('hidden');amb.classList.add('hidden');
  row.dataset.fait='1';
  tag.textContent=E.etiquette(cc,nn);
  if(E.couleur){tag.style.background=E.couleur(cc);tag.style.color=E.fg(cc);}
  tag.classList.remove('hidden');
  if(k>=0){const w=document.getElementById('w'+k);
   if(w){
    if(E.couleur){w.style.background=E.couleur(cc);w.style.color=E.fg(cc);}
    /* verbe : la marque se pose SOUS le mot, sans le colorer */
    else if(E.marque){const q=document.createElement('span');q.className='mq sous';
      q.textContent=E.marque(cc,nn);q.title=E.etiquette(cc,nn);w.appendChild(q);}}}
  indice();
  det.innerHTML=`<b>${esc(m.lem)}</b> · ${cc} ${nn} — ${m.fn}`;
  det.classList.remove('hidden');
  fait.c=true;check();});}

/* ═══════════════ LES ESPÈCES DE MOTS ═══════════════
   Un nom s'analyse en déclinaison, cas et nombre ; un verbe en conjugaison, personne
   et nombre. La ligne d'analyse et le paradigme ne connaissent que l'ESPÈCE d'un mot :
   elle leur dit quelles lignes afficher, quelle marque poser, quelle question poser.
   Un mot sans champ esp est un nom — les sept premières unités ne changent pas.
   (Le champ t est déjà pris : il dit le type d'un item de révision.) */
/* Toutes les citations n'ont pas de mot à analyser : une phrase peut n'être retenue
   que pour sa notice, ou ses mots écartés à dessein. On les retire de l'exercice
   plutôt que de les traverser à vide. */
function ANAL(){return D.filter(d=>d.mots&&d.mots.length);}  /* déclaration hissée : ACTIFS l'appelle plus haut */
const CERCLE={'1re':1,'2e':2,'3e':3};
/* marque des formes verbales : cercle VIDE au singulier, PLEIN au pluriel ;
   le compte dit la personne. Décision de l'enseignant, unité 8 : pas de couleur
   pour les verbes, la couleur restant la signature de la déclinaison. */
const marqueVerbe=(p,n)=>(n==='pluriel'?'●':'○').repeat(CERCLE[p]||0);
const ESPECES={
 nom:{
  lignes:ORDRE, abr:ABR,
  couleur:c=>`var(${CAS[c]})`, fg:c=>FG(c),
  question:c=>QUESTION[c],
  familles:()=>META.decl, msgFam:msgDecl,
  bouton:'cas et nombre',
  etiquette:(c,n)=>ABR[c]+' '+ABRN[n],
  marque:null,
  legende:()=>ORDRE.map(c=>`<span class="lg"><span class="sw" style="background:var(${CAS[c]})"></span>${c}</span>`).join('')
 },
 inf:{
  /* l'infinitif n'a ni personne ni nombre : une case, qui grandira quand les
     infinitifs parfait et futur arriveront. Le nom du « nombre » est le temps. */
  lignes:['infinitif'], nombres:['présent'], abr:{'infinitif':'infinitif'},
  couleur:null, fg:null,
  question:()=>{const c=META.conj||['1re'];const T={'1re':'-are','2e':'-ere','3e':'-ere','mixte':'-ere','4e':'-ire'};
    return `L’infinitif présent se termine en ${c.map(x=>`<span class="lit">${T[x]||'-re'}</span> (${x})`).join(', ')} : c’est la troisième forme que donne le dictionnaire.`;},
  familles:()=>META.conj||['1re'], msgFam:(f,b,c,lem)=>msgConj(f,b,c,lem),
  bouton:'forme',
  etiquette:(c,n)=>'INF '+(n==='présent'?'PR':n.toUpperCase()),
  marque:()=>'—',
  legende:()=>`<span class="lg"><span class="mq">—</span> infinitif</span>`
 },
 verbe:{
  lignes:['1re','2e','3e'], abr:{'1re':'1re','2e':'2e','3e':'3e'},
  couleur:null, fg:null,
  question:()=>`Regarde la fin du mot : ${['-o','-s','-t','-mus','-tis','-nt'].map(x=>`<span class="lit">${x}</span>`).join(', ')} — six terminaisons, six personnes.`,
  familles:()=>META.conj||['1re'], msgFam:(f,b,c,lem)=>msgConj(f,b,c,lem),
  bouton:'personne et nombre',
  etiquette:(p,n)=>CERCLE[p]+' '+(n==='pluriel'?'PL':'SG'),
  marque:(p,n)=>marqueVerbe(p,n),
  legende:()=>`<span class="lg"><span class="mq">○</span> singulier</span><span class="lg"><span class="mq">●</span> pluriel</span><span class="lg">le nombre de cercles dit la personne</span>`
 }
};
/* ── unité 10 : la 3e, la mixte et la 4e ────────────────────────────────────
   Ici la moitié des cas ne se décident PAS par la forme. Deux familles de messages,
   donc : ceux qui réfutent, et ceux qui disent que la terminaison ne pouvait pas
   trancher et renvoient à l'entrée du dictionnaire, affichée à l'écran. Un message
   ne reproche jamais à l'étudiant d'avoir bien lu. Grille arrêtée par l'enseignant
   le 13 septembre 2026. La grille des unités 8 et 9 reste intacte en dessous : elle
   sert tant que META.conj ignore les trois dernières conjugaisons. */
function msgConj10(f,bonne,choisie,lem,L){
 const E=lem?` L’entrée est sous tes yeux : ${L(lem)}.`:'';
 const VOYELLE=/a(s|t|mus|tis|nt)$/.test(f)?'1re':/e(s|t|mus|tis|nt)$/.test(f)?'2e':null;
 if(VOYELLE&&VOYELLE!==choisie)
  return `La voyelle devant la terminaison est un ${L(VOYELLE==='1re'?'-a-':'-e-')}, `
   +`et c’est la marque de la ${VOYELLE} conjugaison : ${VOYELLE==='1re'
     ?`${L('amas')}, ${L('amat')}, ${L('amant')}`:`${L('mones')}, ${L('monet')}, ${L('monent')}`}.`;
 if(/are$/.test(f))
  return `Un infinitif en ${L('-are')} n’est que de la 1re : ${L('amare')}, ${L('errare')}, ${L('celare')}.`;
 if(/ire$/.test(f))
  return `Un infinitif en ${L('-ire')} n’est que de la 4e : ${L('scire')}, ${L('sitire')}, ${L('insanire')}.`;
 if(/ere$/.test(f))
  return `L’infinitif en ${L('-ere')} ne tranche pas : la 2e, la 3e et la mixte le partagent — ${L('monere')}, ${L('dicere')}, ${L('desipere')}. La quantité du ${L('e')} les sépare, mais l’écriture ne la note pas.${E}`;
 if(/iunt$/.test(f))
  return choisie==='3e'
   ? `Le ${L('-i-')} devant la terminaison écarte la 3e, qui dit ${L('-unt')} tout court : ${L('discunt')}, ${L('regunt')}. Restent la mixte et la 4e, que le présent ne sépare jamais — ${L('faciunt')} et ${L('sitiunt')} finissent pareil. Seul l’infinitif les distingue.${E}`
   : `Le ${L('-iunt')} n’appartient qu’à la mixte et à la 4e, et il ne tranche pas entre les deux.${E}`;
 if(/unt$/.test(f))
  return `Le ${L('-unt')} sans ${L('-i-')} n’est que de la 3e : ${L('discunt')}, ${L('regunt')}. La mixte et la 4e glissent un ${L('-i-')} devant — ${L('faciunt')}, ${L('sitiunt')}.`;
 if(/eo$/.test(f))
  return `Le ${L('-e-')} devant le ${L('-o')} n’existe qu’à la 2e conjugaison : ${L('moneo')}, ${L('video')}, ${L('habeo')}.`;
 /* Un message ne félicite l'étudiant que si la FORME ne pouvait pas trancher. Quand
    elle écarte ce qu'il a cliqué, on le lui dit. Sans ce partage, « Rien à te reprocher »
    saluait un clic sur « mixte » devant quaero, dont le -o nu exclut justement la mixte
    et la 4e — et c'est la première case de l'unité. Correction du 2026-10-03. */
 const BLOC=(choisie==='mixte'||choisie==='4e');
 if(/io$/.test(f))
  return BLOC
   ? `Le ${L('-io')} n’appartient qu’à la mixte et à la 4e, et il ne tranche pas entre les deux : ${L('fugio')} et ${L('scio')} s’écrivent pareil. C’est l’infinitif qui décide, ${L('-ere')} contre ${L('-ire')}.${E}`
   : `Le ${L('-io')} n’appartient qu’à la mixte et à la 4e. Les trois autres ne mettent rien devant le ${L('-o')}, ou un ${L('-e-')} : ${L('amo')}, ${L('moneo')}, ${L('quaero')}.`;
 if(/o$/.test(f))
  return choisie==='2e'
   ? `La 2e garde son ${L('-e-')} devant le ${L('-o')} : ${L('moneo')}, ${L('habeo')}, ${L('timeo')}. Ici il n’y en a pas.`
   : BLOC
   ? `La mixte et la 4e glissent un ${L('-i-')} devant le ${L('-o')} : ${L('fugio')}, ${L('scio')}. Ici il n’y en a pas, et c’est ce qui les écarte. Restent la 1re et la 3e, que le ${L('-o')} nu ne sépare pas — l’entrée tranche, par la deuxième personne et l’infinitif.${E}`
   : `Rien à te reprocher : un ${L('-o')} nu ne dit pas la conjugaison. La 2e garde son ${L('-e-')} devant lui, ${L('moneo')} ; la 1re et la 3e ne montrent rien, ${L('amo')} et ${L('quaero')}. L’entrée tranche, par la deuxième personne et l’infinitif — ${L('-as, -are')} pour la 1re, ${L('-is, -ere')} pour la 3e.${E}`;
 if(/i(s|t|mus|tis)$/.test(f))
  return (choisie==='1re'||choisie==='2e')
   ? `La voyelle devant la terminaison est un ${L('-i-')} : ni la 1re, qui met un ${L('-a-')}, ni la 2e, qui met un ${L('-e-')} — ${L('amas')}, ${L('mones')}.`
   : `Rien à te reprocher : ce ${L('-i-')} ne tranche pas entre la 3e, la mixte et la 4e — ${L('mergis')}, ${L('capis')}, ${L('scis')} s’écrivent de la même façon. C’est l’entrée qui décide.${E}`;
 return `Cette forme n’est pas de la ${choisie} conjugaison. Regarde la voyelle qui précède la terminaison, puis l’entrée du dictionnaire.${E}`;
}

function msgConj(forme,bonne,choisie,lem){
 /* Messages d'erreur de conjugaison, écrits PAR TERMINAISON et jamais par mot : on lit
    la voyelle qui précède la désinence, puisque -s, -t, -mus, -tis, -nt sont communs.
    Grille arrêtée par l'enseignant le 5 septembre 2026, pour les deux conjugaisons
    connues à l'unité 9 ; à compléter à l'unité 10 (3e, mixte, 4e), où l'infinitif en
    -ere de la 3e (legere) obligera à réécrire le message de l'infinitif — la quantité
    du e n'est pas notée, comme fructŭs / fructūs à l'unité 6. */
 const f=forme.toLowerCase();
 const L=t=>`<span class="lit">${t}</span>`;
 /* dès que l'unité connaît l'une des trois dernières conjugaisons, la grille de
    l'unité 10 prend la main : les messages des unités 8 et 9 y seraient faux. */
 if((META.conj||[]).some(x=>x==='3e'||x==='mixte'||x==='4e'))return msgConj10(f,bonne,choisie,lem,L);
 if(choisie==='2e'){
  if(/a(s|t|mus|tis|nt)$/.test(f))return `Ce verbe ne peut pas être de la 2e conjugaison, dont la deuxième personne est en ${L('-es')} et l’infinitif en ${L('-ere')}. Regarde la voyelle devant la terminaison : c’est un ${L('-a-')}, et le ${L('-a-')} est la marque de la 1re — ${L('amas')}, ${L('amat')}, ${L('amamus')}, ${L('amatis')}, ${L('amant')}.`;
  if(/are$/.test(f))return `Un infinitif en ${L('-are')} n’est jamais de la 2e conjugaison, dont l’infinitif est en ${L('-ere')} : ${L('monere')}, ${L('habere')}, ${L('videre')}.`;
  if(/[^e]o$/.test(f))return `Le ${L('-o')} de la première personne est le même dans toutes les conjugaisons : il ne dit rien à lui seul. Mais la 2e garde sa voyelle devant lui — ${L('moneo')}, ${L('video')}, ${L('habeo')} — et ici il n’y a rien : ${L('amo')}. Le dictionnaire tranche par la deuxième forme : ${L('-as')} pour la 1re, ${L('-es')} pour la 2e.`;
  return `Ce verbe ne peut pas être de la 2e conjugaison, dont la deuxième personne est en ${L('-es')} et l’infinitif en ${L('-ere')}.`;
 }
 if(choisie==='1re'){
  if(/e(s|t|mus|tis|nt)$/.test(f))return `Ce verbe ne peut pas être de la 1re conjugaison, dont la deuxième personne est en ${L('-as')} et l’infinitif en ${L('-are')}. Regarde la voyelle devant la terminaison : c’est un ${L('-e-')}, et le ${L('-e-')} est la marque de la 2e — ${L('mones')}, ${L('monet')}, ${L('monemus')}, ${L('monetis')}, ${L('monent')}.`;
  if(/ere$/.test(f))return `Un infinitif en ${L('-ere')} n’est jamais de la 1re conjugaison, dont l’infinitif est en ${L('-are')} : ${L('amare')}, ${L('laudare')}, ${L('errare')}.`;
  if(/eo$/.test(f))return `Le ${L('-e-')} devant le ${L('-o')} n’existe qu’à la 2e conjugaison : ${L('moneo')}, ${L('video')}, ${L('habeo')}, ${L('timeo')}. La 1re dit ${L('amo')} : la voyelle du radical s’y est effacée devant le ${L('-o')}.`;
  return `Ce verbe ne peut pas être de la 1re conjugaison, dont la deuxième personne est en ${L('-as')} et l’infinitif en ${L('-are')}.`;
 }
 return `Cette forme n’est pas de la ${choisie} conjugaison. Regarde la voyelle qui précède la terminaison.`;
}

/* ═══════════════ 7 — LE PARADIGME ═══════════════ */
/* Deux grilles possibles. Par défaut, lignes × (singulier, pluriel) : c'est celle
   des unités 1 à 9. Si META.paradColonnes est déclaré — unité 10 : les trois
   dernières conjugaisons —, la grille se transpose : une ligne par personne et par
   nombre, une colonne par conjugaison. Les formes que les trois conjugaisons
   partagent (p.partout) se rangent dans leur propre colonne et remplissent les
   deux autres avec leur terminaison nue (p.term). */
function ex7(){
 const cur=PARAD[S.file[S.k]];
 if(META.paradColonnes)return ex7col(cur);
 const phrase=cur.cit.split(' ').map(w=>
   net(w)===cur.f
     ? `<u style="text-underline-offset:5px;text-decoration-thickness:2px">${esc(w)}</u>`
     : esc(w)).join(' ');
 const E=ESPECES[META.espece||'nom'];
 const grille=E.lignes.map(c=>`<tr><td class="lab">${E.abr[c]}</td>`+
  ['singulier','pluriel'].map(n=>{
   const p=POSE[c+'|'+n];
   return `<td>${p
    ? `<button class="cellb${p.pre?' pre':''}" disabled style="${E.couleur?`color:${E.couleur(c)}`:''}">${
        E.marque?`<span class="mq">${E.marque(c,n)}</span> `:''}${esc(p.f)}</button>`
    : `<button class="cellb" data-v="${c}|${n}">${E.marque?`<span class="mq dim">${E.marque(c,n)}</span>`:''}</button>`}</td>`;}).join('')+'</tr>').join('');
 app.innerHTML=head()+`<div class="card">
  <p class="latin" style="margin:0 0 6px">${phrase}</p>
  <p class="grey" style="margin:0 0 18px">Dans quelle case le mot souligné va-t-il ?</p>
  <table class="par"><tr><th></th><th>singulier</th><th>pluriel</th></tr>${grille}</table>
  ${META.notePre?`<p class="grey" style="margin:10px 0 0">${META.notePre}</p>`:''}<div id="tail"></div></div>`+pied();
 app.querySelectorAll('.cellb[data-v]').forEach(b=>b.onclick=()=>{
  if(b.dataset.v!==cur.c+'|'+cur.n){
   b.style.outline='2px solid var(--no)';rate();
   setTimeout(()=>b.style.outline='',700);return;}
  POSE[cur.c+'|'+cur.n]=cur;
  b.disabled=true;if(E.couleur)b.style.color=E.couleur(cur.c);
  b.innerHTML=(E.marque?`<span class="mq">${E.marque(cur.c,cur.n)}</span> `:'')+esc(cur.f);
  app.querySelectorAll('.cellb[data-v]').forEach(x=>x.disabled=true);
  if(Object.keys(POSE).length===E.lignes.length*2){
   document.getElementById('tail').innerHTML=`<div class="note">${NOTE_PARAD}</div>`;
   suivant();}
  else setTimeout(avancer,340);});}

function casesCol(){
 const E=ESPECES[META.espece||'nom'], N=E.nombres||['singulier','pluriel'];
 const out=[];
 N.forEach(n=>E.lignes.forEach(c=>META.paradColonnes.forEach(j=>out.push(c+'|'+n+'|'+j))));
 return out;
}

function ex7col(cur){
 const E=ESPECES[META.espece||'nom'], N=E.nombres||['singulier','pluriel'];
 const COLS=META.paradColonnes;
 const phrase=cur.cit.split(' ').map(w=>
   net(w)===net(cur.f)
     ? `<u style="text-underline-offset:5px;text-decoration-thickness:2px">${esc(w)}</u>`
     : esc(w)).join(' ');
 /* l'ordre des lignes suit le paradigme récité : 1re, 2e, 3e du singulier,
    puis du pluriel — donc le nombre en premier. */
 const grille=[];
 N.forEach(n=>E.lignes.forEach(c=>{
  grille.push(`<tr><td class="lab">${E.abr[c]} ${ABRN[n]||n}</td>`+COLS.map(j=>{
   const p=POSE[c+'|'+n+'|'+j];
   return `<td>${p
    ? `<button class="cellb${p.auto?' auto':''}" disabled>${esc(p.f)}</button>`
    : `<button class="cellb" data-v="${c}|${n}|${j}"></button>`}</td>`;}).join('')+'</tr>');
 }));
 app.innerHTML=head()+`<div class="card">
  <p class="latin" style="margin:0 0 4px">${phrase}</p>
  ${cur.lem?`<p class="dico">au dictionnaire : ${esc(cur.lem)}</p>`:''}
  <p class="grey" style="margin:0 0 14px">Dans quelle case le mot souligné va-t-il ?</p>
  <table class="par trois"><tr><th></th>${COLS.map(j=>`<th>${j}</th>`).join('')}</tr>${grille.join('')}</table>
  ${META.notePre?`<p class="grey" style="margin:10px 0 0">${META.notePre}</p>`:''}<div id="tail"></div></div>`+pied();
 app.querySelectorAll('.cellb[data-v]').forEach(b=>b.onclick=()=>{
  const [c,n,j]=b.dataset.v.split('|');
  /* la ligne doit être la bonne ; la colonne ne compte que là où les conjugaisons
     se distinguent — ailleurs, la forme vaut pour les trois. */
  if(c!==cur.c||n!==cur.n||(!cur.partout&&j!==cur.j)){
   b.style.outline='2px solid var(--no)';rate();
   setTimeout(()=>b.style.outline='',700);return;}
  POSE[cur.c+'|'+cur.n+'|'+cur.j]=cur;
  if(cur.partout)COLS.filter(x=>x!==cur.j).forEach(x=>
   POSE[cur.c+'|'+cur.n+'|'+x]={f:cur.term,auto:true});
  /* on peint les cases tout de suite : à la dernière forme, l'exercice s'arrête
     sans redessiner, et sans cela le mot posé ne s'afficherait jamais. */
  COLS.forEach(x=>{const p=POSE[cur.c+'|'+cur.n+'|'+x];if(!p)return;
   const q=app.querySelector(`.cellb[data-v="${cur.c}|${cur.n}|${x}"]`);if(!q)return;
   q.textContent=p.f;q.disabled=true;if(p.auto)q.classList.add('auto');
   q.removeAttribute('data-v');});
  app.querySelectorAll('.cellb[data-v]').forEach(x=>x.disabled=true);
  if(Object.keys(POSE).length===casesCol().length){
   document.getElementById('tail').innerHTML=`<div class="note">${NOTE_PARAD}</div>`;
   suivant();}
  else setTimeout(avancer,340);});}

/* ═══════════════ RECONNAÎTRE ═══════════════ */
/* Deux exercices sous un même nom, selon ce que les données portent.
   • entrées avec n:[[forme,déclinaison,note]] → trier les noms par déclinaison (unités 2 et suivantes)
   • entrées avec ok / c / n                   → repérer le nom au programme et donner son cas
   Le second est le seul possible tant qu'une seule déclinaison est connue. */
/* Deux mécaniques sous un même nom. Quand plusieurs déclinaisons sont connues,
   on trie chaque nom de la phrase (données : n:[[forme,décl,note]]). Quand une seule
   l'est, trier n'a pas de sens : on clique sur le mot qui en relève
   (données : ok, c, n, note). Le moteur choisit d'après la forme des données. */
function reconn(j){
 /* Attention : à l'unité 1, le champ n porte le NOMBRE (une chaîne).
    Le tri se reconnaît à ce que n est un tableau de noms à classer. */
 return Array.isArray(REC[j].n) ? reconnTri(j) : reconnCas(j); }

function reconnCas(j){
 const R=REC[j];
 eye.textContent=META.unite+' · reconnaître';st.textContent='';
 bar.innerHTML=REC.map((_,k)=>`<i class="${k<j?'done':k===j?'cur':''}"></i>`).join('');
 app.innerHTML=`<div class="card opt">
  <p class="grey" style="margin:0 0 14px">${esc(META.consigneRec||'Clique sur le mot de la 1re déclinaison.')}</p>
  <p class="latin">${R.lat.split(' ').map((w,k)=>
    `<span class="w" id="r${k}" style="cursor:pointer">${esc(w)}</span>`).join(' ')}</p>
  <div id="tail"></div></div>`+pied();
 R.lat.split(' ').forEach((w,k)=>{
  const el=document.getElementById('r'+k);
  el.onclick=()=>{
   if(![R.ok].flat().includes(net(w))){
    el.style.background='#2A1919';setTimeout(()=>el.style.background='',600);return;}
   const OKS=[R.ok].flat(), OK=OKS[0];
   /* R.c peut être un tableau aligné sur R.ok, quand deux cibles n'ont pas la même
      personne (Si vales, bene est. Ego valeo — unité 9). */
   const RC=Array.isArray(R.c)?R.c[Math.max(0,OKS.indexOf(net(w)))]:R.c;
   if(R.esp==='verbe'||R.esp==='inf'){const q=document.createElement('span');q.className='mq sous';
     q.textContent=R.esp==='inf'?'—':marqueVerbe(RC,R.n);q.title=R.esp==='inf'?'infinitif':CERCLE[RC]+' '+(R.n==='pluriel'?'PL':'SG');el.appendChild(q);}
   else{el.style.background=`var(${CAS[RC]})`;el.style.color=FG(RC);}
   document.querySelectorAll('.latin .w').forEach(x=>x.onclick=null);
   document.getElementById('tail').innerHTML=
    `<div class="note"><b>${esc(R.tr)}</b></div>
     <div class="note"><span class="lit">${esc(net(w))}</span> — ${RC} ${R.n}. ${R.note}</div>`
    +(R.lem?`<div class="note"><b>Au dictionnaire.</b> <span class="lit">${esc(OK)}</span> — <span class="lit">${esc(R.lem)}</span></div>`:'')
     +(R.src?`<div class="note g">${R.src}</div>`:'');
   suivant(j+1<REC.length?'Suivant':'Retour').onclick=()=>{
    if(j+1<REC.length)reconn(j+1);else{bonus[1]=1;noteProgres();finRec();}};};});}

function reconnTri(j){
 const R=REC[j];let faits=0;
 const cibles={};R.n.forEach((x,i)=>{cibles[i]=x;});
 eye.textContent=META.unite+' · reconnaître';st.textContent='';
 bar.innerHTML=REC.map((_,k)=>`<i class="${k<j?'done':k===j?'cur':''}"></i>`).join('');
 const mots=R.lat.split(' ');
 /* on associe chaque cible à sa position dans la phrase, doublons compris */
 let used=[];
 const pos=R.n.map(x=>{
  const i=mots.findIndex((w,idx)=>net(w)===x[0]&&!used.includes(idx));
  used.push(i);return i;});
 app.innerHTML=`<div class="card opt">
  <p class="grey" style="margin:0 0 14px">${esc(META.consigneTri||'Clique sur chaque nom, et dis à quelle déclinaison il appartient.')}</p>
  <p class="latin">${mots.map((w,k)=>
    `<span class="w" id="n${k}"${pos.includes(k)?' style="cursor:pointer;border-bottom:1px dotted var(--mute)"':''}>${esc(w)}</span>`).join(' ')}</p>
  <div id="tail"></div></div>`+pied();
 pos.forEach((k,i)=>{
  const el=document.getElementById('n'+k);
  el.onclick=()=>{
   if(el.dataset.done||document.querySelector('.dpanel'))return;
   const box=document.createElement('span');box.className='dpanel';
   box.innerHTML=DECL.map(d=>`<button class="db" data-d="${d}">${d}</button>`).join('');
   el.after(box);
   box.querySelectorAll('.db').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    if(b.dataset.d!==cibles[i][1]){
     b.style.borderColor='var(--no)';setTimeout(()=>b.style.borderColor='',600);return;}
    box.remove();el.dataset.done=1;el.style.borderBottom='';el.style.cursor='default';
    const t=document.createElement('span');t.className='dtag';
    t.textContent=cibles[i][1]==='une autre'?(cibles[i][2]||'autre'):cibles[i][1];
    el.after(t);
    if(++faits===R.n.length){
     /* Récapitulatif des lemmes : c'est le génitif qui justifie chaque réponse,
        et l'étudiant ne l'a pas sous les yeux pendant qu'il trie. */
     const lem=R.n.filter(x=>x[3]).map(x=>
       /* Le récapitulatif nomme la famille EXACTE. Quand l'étiquette du tri est un
          regroupement — « 3e à 4e » à l'unité 10, déclaré par META.triBloc —, elle ne
          la nomme pas : le troisième rang la donne alors. Les unités sans triBloc ne
          sont pas concernées, leur étiquette EST la famille. */
       `<span class="lit">${esc(x[0])}</span> — <span class="lit">${esc(x[3])}</span>, ${
         x[1]==='une autre'?(x[2]||'autre')
         :((META.triBloc&&META.triBloc[x[1]]&&x[2])?x[2]:x[1])}`);
     /* Cinquième rang du quadruplet : la note de grammaire du mot, phrase entière.
        Rang neuf, ajouté à l'unité 10 — le troisième rang gardait déjà un sens, le
        nom de la déclinaison inconnue, et le réemployer aurait fait parler les
        unités 2 à 7, où il ne porte que des étiquettes brèves (« neutre »,
        « vocatif en -e »). Les unités anciennes ne remplissent pas ce rang : leurs
        écrans ne bougent pas. */
     const gram=R.n.filter(x=>x[4]).map(x=>
       `<span class="lit">${esc(x[0])}</span> — ${x[4]}`);
     document.getElementById('tail').innerHTML=
      `<div class="note"><b>${esc(R.tr)}</b></div>`
      +(gram.length?`<div class="note">${gram.join('<br>')}</div>`:'')
      +(lem.length?`<div class="note"><b>Au dictionnaire.</b><br>${lem.join('<br>')}</div>`:'')
      +(R.n.some(x=>x[1]==='une autre')
        ? `<div class="note g">Les déclinaisons que tu ne connais pas encore viendront : ${
            R.n.filter(x=>x[1]==='une autre').map(x=>`<span class="lit">${esc(x[0])}</span>, ${x[2]}`).join(' · ')}.</div>`
        : '')
      +(R.src?`<div class="note g">${R.src}</div>`:'');
     suivant(j+1<REC.length?'Suivant':'Retour').onclick=()=>{
      if(j+1<REC.length)reconn(j+1);else{bonus[1]=1;noteProgres();finRec();}};}});};});}

function finRec(){
 eye.textContent=META.unite+' · reconnaître';bar.innerHTML='';
 app.innerHTML=`<div class="card opt"><div class="step"><b>Ce que la série a montré</b></div>
  ${META.finRec.map(n=>`<div class="note${n[0]?' g':''}">${n[1]}</div>`).join('\n  ')}</div>`+pied();
 suivant('Retour').onclick=menu;}

/* ═══════════════ CARTES ═══════════════ */
const SEUIL=2;
let CARD=null;
function cartesChoix(){
 eye.textContent=META.unite+' · cartes';st.textContent='';bar.innerHTML='';
 const N=D.length;
 const opts=[5,10,20,30].filter(x=>x<N);opts.push(N);
 app.innerHTML=`<div class="card opt">
  <p style="margin:0 0 6px;font-size:15px">Combien de cartes veux-tu revoir ?</p>
  <p class="grey" style="margin:0 0 16px">Elles sont tirées au sort parmi les ${N} citations de l’unité.</p>
  <div class="forms" id="f"></div></div>`+pied();
 const box=document.getElementById('f');
 opts.forEach(x=>{
  const b=document.createElement('button');b.className='fb sm';
  b.style.minWidth='120px';b.style.textAlign='center';
  b.textContent=x===N?`Toutes (${N})`:`${x} cartes`;
  b.onclick=()=>{CARD=mix(D.map((d,i)=>({i:i,niv:0}))).slice(0,x);cartes();};
  box.appendChild(b);});
 document.getElementById('foot').innerHTML='<button class="ghost" id="rt">Retour au sommaire</button>';
 document.getElementById('rt').onclick=menu;}

function cartes(){
 if(!CARD)return cartesChoix();
 eye.textContent=META.unite+' · cartes';st.textContent='';
 const q=CARD.filter(c=>c.niv<SEUIL);
 if(!q.length){bonus[2]=1;noteProgres();bar.innerHTML='';
  app.innerHTML=`<div class="card opt">
   <p style="font:600 21px/1.3 'EB Garamond',serif;margin:0">
   ${CARD.length} citation${CARD.length>1?'s':''} sue${CARD.length>1?'s':''}, dans les deux sens.</p>
   <p class="grey" style="margin-top:8px">Rien n’est conservé d’une séance à l’autre :
   au prochain passage, le tirage recommencera.</p></div>
   <div class="foot" id="foot"><button class="ghost" id="rj">Autres cartes</button></div>`;
  document.getElementById('rj').onclick=()=>{CARD=null;cartesChoix();};
  suivant('Retour').onclick=menu;return;}
 const c=q[0], d=D[c.i], envers=c.niv>=1;
 const sues=CARD.filter(x=>x.niv>=SEUIL).length;
 bar.innerHTML=CARD.map(x=>`<i class="${x.niv>=SEUIL?'done':x===c?'cur':''}"></i>`).join('');
 app.innerHTML=`<div class="card opt">
  <div class="step">${envers?'Français → latin':'Latin → français'} · ${sues} / ${CARD.length} sues</div>
  <div class="face${envers?' fr':''}">${esc(envers?d.tr:d.lat)}</div>
  <div id="back"></div></div>`+pied();
 suivant('Retourner').onclick=()=>{
  document.getElementById('back').innerHTML=
   `<div class="face${envers?'':' fr'}" style="border-top:1px solid var(--line);min-height:0">
    ${esc(envers?d.lat:d.tr)}</div>
    <div class="srs">
     <button class="srsb" data-v="2">Je sais</button>
     <button class="srsb" data-v="1">À moitié</button>
     <button class="srsb" data-v="0">À revoir</button></div>`;
  document.getElementById('foot').innerHTML='<span></span>';
  document.querySelectorAll('.srsb').forEach(b=>b.onclick=()=>{
   const v=+b.dataset.v;
   CARD=CARD.filter(x=>x!==c);
   if(v===2){c.niv++;CARD.splice(Math.min(CARD.length,9),0,c);}
   else if(v===1){CARD.splice(Math.min(CARD.length,6),0,c);}
   else{c.niv=0;CARD.splice(Math.min(CARD.length,2),0,c);}
   cartes();});};}

/* ═══════════════ BILAN ═══════════════ */
function bilan(){
 eye.textContent=META.unite+' · bilan';st.textContent='';bar.innerHTML='';
 app.innerHTML=`<div class="card">
  <p style="font:600 23px/1.25 'EB Garamond',serif;margin:0 0 14px">${META.bilan.titre}</p>
  ${META.bilan.notes.map(n=>`<div class="note">${n}</div>`).join('\n  ')}
  <div class="note g"><b>Ce qui vient ensuite.</b> ${META.bilan.suite}</div></div>
  <div class="foot"><button class="ghost" id="rt">Retour</button>
  <button class="go" disabled>${esc(META.suivante)}</button></div>`;
 /* Retour au sommaire de l'unité, et non rechargement : une fois l'unité faite,
    tout y reste déverrouillé et l'étudiant refait ce qu'il veut. */
 document.getElementById('rt').onclick=menu;}

menu();


/* ═══ lecture facilitée ═══
   Mémorisé d'une session à l'autre. localStorage n'est pas garanti sur file://
   selon le navigateur : on l'entoure d'un try/catch et on retombe en mémoire,
   auquel cas le réglage tient le temps de la session et rien ne casse. */
let FACILE=false;
const MEM=(()=>{try{const k='latin.facile';localStorage.setItem(k,localStorage.getItem(k)||'');
 return{lire:()=>localStorage.getItem(k)==='1',ecrire:v=>localStorage.setItem(k,v?'1':'0')};}
 catch(e){let m=false;return{lire:()=>m,ecrire:v=>{m=v;}};}})();
function appliquerLisibilite(v){
 FACILE=v; document.body.classList.toggle('facile',v);
 const b=document.getElementById('lisi');
 if(b){b.setAttribute('aria-pressed',v?'true':'false');
       b.textContent=v?'Lecture normale':'Lecture facilitée';}
 MEM.ecrire(v);
}
(function(){
 const b=document.getElementById('lisi');
 if(b)b.onclick=()=>appliquerLisibilite(!FACILE);
 appliquerLisibilite(MEM.lire());
})();

/* ═══════════════ SOMMAIRE GÉNÉRAL ═══════════════
   La version distribuée réunit toutes les unités. Charger une unité consiste à
   remplacer les données que le moteur consomme, puis à réinitialiser son état. */
const PROGRES={};
let UNITE=null;

function chargerUnite(n){
 const U=CATALOGUE[n];
 META=U.META; NOTE_PARAD=U.NOTE_PARAD; DECL=U.DECL; REVIS=U.REVIS; D=U.D;
 COMPL=U.COMPL; INTRUS=U.INTRUS; DICO=U.DICO; PREREMPLI=U.PREREMPLI;
 PARAD=U.PARAD; FAM=U.FAM; REC=U.REC; SOURCES=U.SOURCES;
 /* EXOS et ACTIFS ont été construits sur les données de la première unité :
    on recalcule ce qui en dépend. */
 ACTIFS.length=0; EXOS.forEach(e=>{if(e.len()>0)ACTIFS.push(e);});
 /* La progression de chaque unité est gardée le temps de la session : passer par
    le sommaire et revenir ne doit pas tout reverrouiller. Au premier chargement,
    elle est relue du navigateur : chargeProgres rend l'avancée enregistrée si sa
    signature correspond encore aux données de l'unité, sinon une page blanche. */
 if(!PROGRES[n])PROGRES[n]=Object.assign(chargeProgres(META.unite),{pose:{}});
 UNITE=n; UNITE_CLEF=META.unite;
 fini=PROGRES[n].fini; bonus=PROGRES[n].bonus; POSE=PROGRES[n].pose;
 S=null; RATES=new Set();
 document.getElementById('tt').textContent=META.h1;
 document.getElementById('st').innerHTML=META.sous;
 document.title=META.titre;
 menu();
 const b=document.createElement('button');
 b.className='retour'; b.textContent='Sommaire'; b.onclick=accueil;
 const h=document.querySelector('header');
 const vieux=h.querySelector('.retour'); if(vieux)vieux.remove();
 h.appendChild(b);
}

function accueil(){
 const h=document.querySelector('header');
 const v=h.querySelector('.retour'); if(v)v.remove();
 document.getElementById('eye').textContent='';
 document.getElementById('tt').textContent='Le latin par les locutions';
 document.getElementById('st').innerHTML='déclinaisons et conjugaisons';
 document.title='Le latin par les locutions';
 bar.innerHTML='';
 app.innerHTML='<div class="accueil">'
  +'<p class="ms" style="margin:0 0 14px;color:var(--ui)">Version en cours de développement</p>'
  +'<p class="grey" style="margin:0 0 16px">'
  +`${Object.keys(CATALOGUE).length} unités, à faire dans l’ordre. Chacune s’ouvre sur une révision de la précédente.</p>`
  +Object.keys(CATALOGUE).map(n=>{const M=CATALOGUE[n].META;
    return `<button class="uni" data-u="${n}"><span class="n">${esc(M.unite)}</span>`
      +`<span class="t">${esc(M.h1)}</span><span class="s">${M.sous}</span></button>`;}).join('')
  +'</div>';
 document.querySelectorAll('.uni').forEach(b=>b.onclick=()=>chargerUnite(+b.dataset.u));
}

/* Le bouton de fin d'unité mène à la suivante quand elle existe. */
const bilanOrigine=bilan;
bilan=function(){
 bilanOrigine();
 const g=document.querySelector('.foot .go[disabled]');
 if(!g)return;
 const n=Object.keys(CATALOGUE).map(Number).find(k=>CATALOGUE[k].META.unite===META.suivante);
 if(n){g.disabled=false;g.onclick=()=>chargerUnite(n);}
};

accueil();
</script></body></html>
